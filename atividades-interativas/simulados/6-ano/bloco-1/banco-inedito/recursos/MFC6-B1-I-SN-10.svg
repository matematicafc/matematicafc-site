<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 390" width="320" height="390" role="img" aria-labelledby="MFC6-B1-I-SN-10-SNV1-titulo" aria-describedby="MFC6-B1-I-SN-10-SNV1-descricao" class="mfc-sn-svg" style="font-family:Arial,sans-serif"><title id="MFC6-B1-I-SN-10-SNV1-titulo">Numeração dos dois lados</title><desc id="MFC6-B1-I-SN-10-SNV1-descricao">Diagrama de folhas completas: primeira folha com frente 41 e verso 42; folha seguinte com frente 43 e verso 44; reticências indicam continuação; última folha com frente 79 e verso 80. O total de folhas não está escrito.</desc><rect x="0" y="0" width="320" height="390" fill="white" data-fundo="true"/><text x="160" y="23" text-anchor="middle" font-size="19" fill="#172b3a" >Trecho com folhas completas</text><text x="160" y="47" text-anchor="middle" font-size="16" fill="#172b3a" >Primeira folha</text><rect x="24" y="57" width="272" height="64" rx="3" fill="white" stroke="#263d4d" /><path d="M160 57V121" stroke="#263d4d"/><text x="92" y="77" text-anchor="middle" font-size="15" fill="#172b3a" >Frente</text><text x="92" y="109" text-anchor="middle" font-size="27" fill="#172b3a" data-pagina="41" data-folha="0">41</text><text x="228" y="77" text-anchor="middle" font-size="15" fill="#172b3a" >Verso</text><text x="228" y="109" text-anchor="middle" font-size="27" fill="#172b3a" data-pagina="42" data-folha="0">42</text><text x="160" y="141" text-anchor="middle" font-size="16" fill="#172b3a" >Folha seguinte</text><rect x="24" y="151" width="272" height="64" rx="3" fill="white" stroke="#263d4d" /><path d="M160 151V215" stroke="#263d4d"/><text x="92" y="171" text-anchor="middle" font-size="15" fill="#172b3a" >Frente</text><text x="92" y="203" text-anchor="middle" font-size="27" fill="#172b3a" data-pagina="43" data-folha="1">43</text><text x="228" y="171" text-anchor="middle" font-size="15" fill="#172b3a" >Verso</text><text x="228" y="203" text-anchor="middle" font-size="27" fill="#172b3a" data-pagina="44" data-folha="1">44</text><text x="160" y="268" text-anchor="middle" font-size="16" fill="#172b3a" >Última folha</text><rect x="24" y="278" width="272" height="64" rx="3" fill="white" stroke="#263d4d" /><path d="M160 278V342" stroke="#263d4d"/><text x="92" y="298" text-anchor="middle" font-size="15" fill="#172b3a" >Frente</text><text x="92" y="330" text-anchor="middle" font-size="27" fill="#172b3a" data-pagina="79" data-folha="2">79</text><text x="228" y="298" text-anchor="middle" font-size="15" fill="#172b3a" >Verso</text><text x="228" y="330" text-anchor="middle" font-size="27" fill="#172b3a" data-pagina="80" data-folha="2">80</text><g data-continuacao="true"><circle cx="160" cy="231" r="2.5" fill="#172b3a"/><circle cx="160" cy="241" r="2.5" fill="#172b3a"/><circle cx="160" cy="251" r="2.5" fill="#172b3a"/></g><text x="160" y="371" text-anchor="middle" font-size="17" fill="#172b3a" >Uma folha tem duas páginas</text></svg>
