<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 373" width="320" height="373" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-08-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-08-MDV1-descricao"><title id="MFC6-B1-I-MD-08-MDV1-titulo">Cortar sem sobras</title><desc id="MFC6-B1-I-MD-08-MDV1-descricao">Fita A de 54 cm e fita B de 72 cm, alinhadas à esquerda e desenhadas na mesma escala, quatro pixels por centímetro. Um modelo de pedaço tem comprimento desconhecido, sem escala de corte definida. Não há divisões ou comprimento de resposta indicado.</desc><rect x="0" y="0" width="320" height="373" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="20" fill="#172b3a" >Fitas antes dos cortes</text><text x="160" y="62" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="fita_A_cm" data-valor="54">Fita A: 54 cm</text><rect x="16" y="79" width="216" height="37" fill="#edf4f8" stroke="#263d4d" data-fita="A"/><text x="160" y="154" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="fita_B_cm" data-valor="72">Fita B: 72 cm</text><rect x="16" y="171" width="288" height="37" fill="#fff3df" stroke="#263d4d" data-fita="B"/><text x="160" y="246" text-anchor="middle" font-size="16" fill="#172b3a" >Comprimentos na mesma escala</text><rect x="93" y="270" width="134" height="44" fill="white" stroke="#263d4d" /><text x="160" y="299" text-anchor="middle" font-size="22" fill="#172b3a" >? cm</text><text x="160" y="348" text-anchor="middle" font-size="17" fill="#172b3a" >Cortar pedaços iguais, sem sobras</text></svg>
