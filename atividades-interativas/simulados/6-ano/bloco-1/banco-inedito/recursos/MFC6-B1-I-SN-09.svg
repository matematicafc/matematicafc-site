<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 370" width="320" height="370" role="img" aria-labelledby="MFC6-B1-I-SN-09-SNV1-titulo" aria-describedby="MFC6-B1-I-SN-09-SNV1-descricao" class="mfc-sn-svg" style="font-family:Arial,sans-serif"><title id="MFC6-B1-I-SN-09-SNV1-titulo">Duas telas, um intervalo</title><desc id="MFC6-B1-I-SN-09-SNV1-descricao">Duas escalas com ampliações diferentes. A tela à centena indica 8.700 e sua reta tem marcas de 100 em 100, de 8.500 a 8.900. A tela ao milhar indica 9.000 e sua reta marca 8.000, 9.000 e 10.000. As leituras são aproximações, não limites da contagem real.</desc><rect x="0" y="0" width="320" height="370" fill="white" data-fundo="true"/><text x="160" y="24" text-anchor="middle" font-size="18" fill="#172b3a" >Leitura à centena</text><text x="160" y="65" text-anchor="middle" font-size="32" fill="#172b3a" data-leitura="8700">8.700</text><path d="M35 102H285" stroke="#172b3a" stroke-width="2"/><path d="M35.0 96V108" stroke="#172b3a" data-eixo="centena" data-marca="8500" data-x="35.0"/><text x="35.0" y="134" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="centena" data-valor="8500">8.500</text><path d="M97.5 96V108" stroke="#172b3a" data-eixo="centena" data-marca="8600" data-x="97.5"/><path d="M160.0 96V108" stroke="#172b3a" data-eixo="centena" data-marca="8700" data-x="160.0"/><text x="160.0" y="134" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="centena" data-valor="8700">8.700</text><path d="M222.5 96V108" stroke="#172b3a" data-eixo="centena" data-marca="8800" data-x="222.5"/><path d="M285.0 96V108" stroke="#172b3a" data-eixo="centena" data-marca="8900" data-x="285.0"/><text x="285.0" y="134" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="centena" data-valor="8900">8.900</text><text x="160" y="164" text-anchor="middle" font-size="16" fill="#172b3a" >Passo: 100</text><text x="160" y="207" text-anchor="middle" font-size="18" fill="#172b3a" >Leitura ao 