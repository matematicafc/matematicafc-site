<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 275" width="320" height="275" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-03-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-03-ONV1-descricao"><title id="MFC6-B1-I-ON-03-ONV1-titulo">Produção com parada para manutenção</title><desc id="MFC6-B1-I-ON-03-ONV1-descricao">Barra de 30 minutos dividida em uma parte de manutenção de 6 minutos e uma parte de produção sem duração escrita. O ritmo é quatro peças por minuto. A barra agrupa durações, sem indicar em qual momento ocorreu a parada.</desc><rect x="0" y="0" width="320" height="275" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="19" fill="#172b3a" >Distribuição do tempo</text><text x="160" y="61" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="janela_minutos" data-valor="30">Tempo total: 30 min</text><rect x="20" y="92" width="56.0" height="58" rx="3" fill="#fff3df" stroke="#263d4d" data-parte="manutencao"/><rect x="76.0" y="92" width="224.0" height="58" rx="3" fill="#edf4f8" stroke="#263d4d" data-parte="producao"/><text x="48.0" y="129" text-anchor="middle" font-size="16" fill="#172b3a" >6 min</text><text x="188.0" y="129" text-anchor="middle" font-size="20" fill="#172b3a" >Produção</text><text x="160" y="186" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="manutencao_minutos" data-valor="6">Manutenção: 6 min</text><text x="160" y="217" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="pecas_por_minuto" data-valor="4">Ritmo: 4 peças por minuto</text><text x="160" y="255" text-anchor="middle" font-size="14" fill="#172b3a" >O esquema não indica a ordem da parada</text></svg>
