<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 488" width="320" height="488" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-09-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-09-FRV1-descricao"><title id="MFC6-B1-I-FR-09-FRV1-titulo">Transferência entre recipientes</title><desc id="MFC6-B1-I-FR-09-FRV1-descricao">Dois recipientes retangulares iguais antes da repartição: A está preenchido até metade da altura e B até um quarto, com as frações 1/2 e 1/4 identificadas. Uma seta indica repartir igualmente sem perda. Abaixo, os mesmos dois recipientes aparecem sem nível preenchido e com interrogações. Nenhum volume final está desenhado ou calculado.</desc><rect x="0" y="0" width="320" height="488" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Antes da repartição</text><rect x="43" y="49" width="92" height="120" fill="white" stroke="#263d4d" /><rect x="43" y="109.0" width="92" height="60.0" fill="#aac7dd" stroke="#263d4d" data-liquido="A"/><text x="89" y="199" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="recipiente_A" data-valor="1/2">A: 1/2</text><rect x="185" y="49" width="92" height="120" fill="white" stroke="#263d4d" /><rect x="185" y="139.0" width="92" height="30.0" fill="#aac7dd" stroke="#263d4d" data-liquido="B"/><text x="231" y="199" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="recipiente_B" data-valor="1/4">B: 1/4</text><path d="M160 219V251M156 246L160 251L164 246" stroke="#263d4d" stroke-width="2" fill="none"/><text x="160" y="278" text-anchor="middle" font-size="17" fill="#172b3a" >Repartir igualmente, sem perda</text><rect x="43" y="301" width="92" height="120" fill="white" stroke="#263d4d" /><text x="89" y="349" text-anchor="middle" font-size="28" fill="#172b3a" >?</text><text x="89" y="381" text-anchor="middle" font-size="17" fill="#172b3a" >da</text><text x="89" y="403" text-anchor="middle" font-size="15" fill="#172b3a" >capacidade</text><rect x="185" y="301" width="92" height="120" fill="white" stroke="#263d4d" /><text x="231" y="349" text-anchor="middle" font-size="28" fill="#172b3a" >?</text><text x="231" y="381" text-anchor="middle" font-size="17" fill="#172b3a" >da</text><text x="231" y="403" text-anchor="middle" font-size="15" fill="#172b3a" >capacidade</text><text x="160" y="462" text-anchor="middle" font-size="16" fill="#172b3a" data-campo="recipientes" data-valor="2">2 recipientes de mesma capacidade</text></svg>
