<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" role="img" aria-labelledby="MFC6-B1-I-SN-06-SNV1-titulo" aria-describedby="MFC6-B1-I-SN-06-SNV1-descricao" class="mfc-sn-svg" style="font-family:Arial,sans-serif"><title id="MFC6-B1-I-SN-06-SNV1-titulo">Troca de ordens no formulário</title><desc id="MFC6-B1-I-SN-06-SNV1-descricao">Quadro inicial com M=7, C=2, D=3 e U=4. Setas ligam C a U e U a C. No quadro seguinte, M=7 e D=3 permanecem escritos; as posições C e U ficam vazias para completar a troca.</desc><rect x="0" y="0" width="320" height="340" fill="white" data-fundo="true"/><text x="160" y="22" text-anchor="middle" font-size="19" fill="#172b3a" >Trocar centenas e unidades</text><text x="50" y="53" text-anchor="middle" font-size="18" fill="#172b3a" >M</text><text x="123" y="53" text-anchor="middle" font-size="18" fill="#172b3a" >C</text><text x="196" y="53" text-anchor="middle" font-size="18" fill="#172b3a" >D</text><text x="269" y="53" text-anchor="middle" font-size="18" fill="#172b3a" >U</text><rect x="21" y="65" width="58" height="45" rx="3" fill="white" stroke="#263d4d" /><text x="50" y="96" text-anchor="middle" font-size="28" fill="#172b3a" data-quadro="antes" data-posicao="M">7</text><rect x="94" y="65" width="58" height="45" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="123" y="96" text-anchor="middle" font-size="28" fill="#172b3a" data-quadro="antes" data-posicao="C">2</text><rect x="167" y="65" width="58" height="45" rx="3" fill="white" stroke="#263d4d" /><text x="196" y="96" text-anchor="middle" font-size="28" fill="#172b3a" data-quadro="antes" data-posicao="D">3</text><rect x="240" y="65" width="58" height="45" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="269" y="96" text-anchor="middle" font-size="28" fill="#172b3a" data-quadro="antes" data-posicao="U">4</text><rect x="21" y="216" width="58" height="45" rx="3" fill="white" stroke="#263d4d" /><text x="50" y="247" text-anchor="middle" font-size="28" fill="#172b3a" data-quadro="depois" data-posicao="M">7</text><rect x="94" y="216" width="58" height="45" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="123" y="247" text-anchor="middle" font-size="28" fill="#172b3a" data-quadro="depois" data-posicao="C">□</text><rect x="167" y="216" width="58" height="45" rx="3" fill="white" stroke="#263d4d" /><text x="196" y="247" text-anchor="middle" font-size="28" fill="#172b3a" data-quadro="depois" data-posicao="D">3</text><rect x="240" y="216" width="58" height="45" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="269" y="247" text-anchor="middle" font-size="28" fill="#172b3a" data-quadro="depois" data-posicao="U">□</text><text x="11" y="128" text-anchor="start" font-size="15" fill="#172b3a" >Antes</text><text x="11" y="286" text-anchor="start" font-size="15" fill="#172b3a" >Depois</text><defs><marker id="MFC6-B1-I-SN-06-seta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#172b3a"/></marker></defs><path d="M123 111Q123 155 269 209" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#MFC6-B1-I-SN-06-seta)" data-troca="C-U"/><path d="M269 111Q269 170 123 209" fill="none" stroke="#172b3a" stroke-width="2" marker-end="url(#MFC6-B1-I-SN-06-seta)" data-troca="U-C"/><text x="160" y="318" text-anchor="middle" font-size="15" fill="#172b3a" >M e D permanecem iguais</text></svg>
