<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 351" width="320" height="351" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-10-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-10-MDV1-descricao"><title id="MFC6-B1-I-MD-10-MDV1-titulo">Pacotes entre dois limites</title><desc id="MFC6-B1-I-MD-10-MDV1-descricao">Um grupo de oito unidades e um grupo de doze unidades, ambos desenhados por objetos. A reta mostra 40, 50, 60, 70 e 80; o ponto 50 é aberto e uma seta aponta para totais maiores. Os múltiplos comuns não estão assinalados.</desc><rect x="0" y="0" width="320" height="351" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="20" fill="#172b3a" >Dois formatos para a remessa</text><text x="83" y="59" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="grupo_A" data-valor="8">Grupo de 8</text><rect x="36" y="80" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="A" data-objeto="0"/><rect x="60" y="80" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="A" data-objeto="1"/><rect x="84" y="80" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="A" data-objeto="2"/><rect x="108" y="80" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="A" data-objeto="3"/><rect x="36" y="104" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="A" data-objeto="4"/><rect x="60" y="104" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="A" data-objeto="5"/><rect x="84" y="104" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="A" data-objeto="6"/><rect x="108" y="104" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="A" data-objeto="7"/><text x="237" y="59" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="grupo_B" data-valor="12">Grupo de 12</text><rect x="190" y="80" width="22" height="22" fill="#edf4f8" stroke="#263d4d" data-grupo="B" data-objeto="0"/><rect x="214" y="80"