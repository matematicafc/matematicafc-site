<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 349" width="320" height="349" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-05-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-05-FRV1-descricao"><title id="MFC6-B1-I-FR-05-FRV1-titulo">Usando a parte que sobrou</title><desc id="MFC6-B1-I-FR-05-FRV1-descricao">Uma cartolina inteira é representada por três partes iguais. A primeira está cinza e identificada como já usada, correspondendo a 1/3. Uma chave reúne as outras duas partes como a sobra após o primeiro uso. A indicação do segundo uso é 1/2 somente dessa sobra. A cartolina após o segundo uso não está desenhada.</desc><rect x="0" y="0" width="320" height="349" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="uso_inicial" data-valor="1/3">Primeiro uso: 1/3 da cartolina</text><rect x="25" y="62" width="90" height="84" fill="#d6d6d6" stroke="#263d4d" data-terco="0" data-usado="true"/><rect x="115" y="62" width="90" height="84" fill="white" stroke="#263d4d" data-terco="1" data-usado="false"/><rect x="205" y="62" width="90" height="84" fill="white" stroke="#263d4d" data-terco="2" data-usado="false"/><text x="70" y="97" text-anchor="middle" font-size="17" fill="#172b3a" >Já</text><text x="70" y="123" text-anchor="middle" font-size="17" fill="#172b3a" >usada</text><path d="M115 169V174H295V169" stroke="#263d4d" stroke-width="2" fill="none"/><text x="205" y="204" text-anchor="middle" font-size="17" fill="#172b3a" >Parte que restou</text><text x="160" y="252" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="fracao_do_restante_usada" data-valor="1/2">Segundo uso: 1/2</text><text x="160" y="282" text-anchor="middle" font-size="17" fill="#172b3a" >somente da parte que restou</text><text x="160" y="323" text-anchor="middle" font-size="16" fill="#172b3a" >Referência final: cartolina original</text></svg>
