<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 332" width="320" height="332" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-04-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-04-NDV1-descricao"><title id="MFC6-B1-I-ND-04-NDV1-titulo">Valor que cruza a marca</title><desc id="MFC6-B1-I-ND-04-NDV1-descricao">Reta de 4,94 a 5,06, com marcas igualmente espaçadas a cada 0,02, incluindo a referência 5,00. Um ponto marca a medição inicial 4,98. Abaixo, uma seta isolada e o rótulo de aumento +0,04 indicam a mudança, sem marcar a posição final ou calcular o excedente.</desc><rect x="0" y="0" width="320" height="332" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="medicao" data-valor="4.98">Medição inicial: 4,98</text><text x="160" y="57" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="referencia" data-valor="5">Referência: 5</text><path d="M25 143H295" stroke="#263d4d" stroke-width="2"/><path d="M25.0 135V151" stroke="#263d4d" data-marca="247/50" data-x="25.0"/><text x="25.0" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >4,94</text><path d="M70.0 135V151" stroke="#263d4d" data-marca="124/25" data-x="70.0"/><text x="70.0" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >4,96</text><path d="M115.0 135V151" stroke="#263d4d" data-marca="249/50" data-x="115.0"/><text x="115.0" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >4,98</text><path d="M160.0 135V151" stroke="#263d4d" data-marca="5" data-x="160.0"/><text x="160.0" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >5,00</text><path d="M205.0 135V151" stroke="#263d4d" data-marca="251/50" data-x="205.0"/><text x="205.0" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >5,02</text><path d="M250.0 135V151" stroke="#263d4d" data-marca="126/25" data-x="250.0"/><text x="250.0" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >5,04</text><path d="M295.0 135V151" stroke="#263d4d" data-marca="253/50" data-x="295.0"/><text x="295.0" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >5,06</text><circle cx="115.0" cy="143" r="5" fill="#263d4d" data-inicio="4.98"/><text x="160" y="235" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="aumento" data-valor="0.04">Aumento: +0,04</text><path d="M115 263H205L199 258M205 263L199 268" stroke="#263d4d" stroke-width="2" fill="none"/><text x="160" y="305" text-anchor="middle" font-size="16" fill="#172b3a" >A posição final não está marcada</text></svg>
