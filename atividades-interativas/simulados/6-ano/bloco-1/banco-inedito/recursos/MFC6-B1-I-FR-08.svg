<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 515" width="320" height="515" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-08-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-08-FRV1-descricao"><title id="MFC6-B1-I-FR-08-FRV1-titulo">Qual proposta cabe?</title><desc id="MFC6-B1-I-FR-08-FRV1-descricao">Seis barras independentes e de igual comprimento representam o tempo inteiro da mesma apresentação. Debate: 1/2; perguntas: mínimo de 1/6; propostas de demonstração: 1/3, 1/2, 2/3 e 5/12. Cada barra está dividida em doze partes iguais para comparação. Nenhuma proposta está combinada às reservas ou marcada como aceita.</desc><rect x="0" y="0" width="320" height="515" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="18" fill="#172b3a" >Mesmo tempo total de referência</text><text x="160" y="65" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="debate" data-valor="1/2">Debate: 1/2</text><rect x="30.0" y="77" width="21.666666666666668" height="24" fill="#aac7dd" stroke="#263d4d" data-barra="debate" data-parte="0" data-preenchida="true"/><rect x="51.66666666666667" y="77" width="21.666666666666668" height="24" fill="#aac7dd" stroke="#263d4d" data-barra="debate" data-parte="1" data-preenchida="true"/><rect x="73.33333333333334" y="77" width="21.666666666666668" height="24" fill="#aac7dd" stroke="#263d4d" data-barra="debate" data-parte="2" data-preenchida="true"/><rect x="95.0" y="77" width="21.666666666666668" height="24" fill="#aac7dd" stroke="#263d4d" data-barra="debate" data-parte="3" data-preenchida="true"/><rect x="116.66666666666667" y="77" width="21.666666666666668" height="24" fill="#aac7dd" stroke="#263d4d" data-barra="debate" data-parte="4" data-preenchida="true"/><rect x="138.33333333333331" y="77" width="21.666666666666668" height="24" fill="#aac7dd" stroke="#263d4d" data-barra="debate" data-parte="5" data-preenchida="true"/><rect x="160.0" y="77" width="21.666666666666668" heig