<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 302" width="320" height="302" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-05-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-05-ONV1-descricao"><title id="MFC6-B1-I-ON-05-ONV1-titulo">Borda de uma placa</title><desc id="MFC6-B1-I-ON-05-ONV1-descricao">Grade de seis linhas e oito colunas. As células da borda estão destacadas, e as internas ficam brancas. Cada canto é uma única célula. As dimensões estão indicadas sem calcular a quantidade de células da borda.</desc><rect x="0" y="0" width="320" height="302" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" >6 linhas e 8 colunas</text><rect x="32" y="49" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="0" data-coluna="0" data-borda="true"/><rect x="64" y="49" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="0" data-coluna="1" data-borda="true"/><rect x="96" y="49" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="0" data-coluna="2" data-borda="true"/><rect x="128" y="49" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="0" data-coluna="3" data-borda="true"/><rect x="160" y="49" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="0" data-coluna="4" data-borda="true"/><rect x="192" y="49" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="0" data-coluna="5" data-borda="true"/><rect x="224" y="49" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="0" data-coluna="6" data-borda="true"/><rect x="256" y="49" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="0" data-coluna="7" data-borda="true"/><rect x="32" y="81" width="32" height="32" rx="3" fill="#aac7dd" stroke="#263d4d" data-linha="1" data-coluna="0" data-borda="true"/><rect x="64" y="81" width="32" height="32" rx="3" fill="white" stroke="#263