<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 355" width="320" height="355" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-04-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-04-MDV1-descricao"><title id="MFC6-B1-I-MD-04-MDV1-titulo">Quatro rodas por carrinho</title><desc id="MFC6-B1-I-MD-04-MDV1-descricao">Quatro opções de lote: 37, 41, 46 e 52 rodas. O fluxo separa duas rodas de reserva e encaminha todas as restantes para carrinhos. O modelo de carrinho mostra quatro rodas. As quantidades após a reserva não estão calculadas.</desc><rect x="0" y="0" width="320" height="355" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" >Escolher um lote</text><rect x="12" y="40" width="65" height="46" fill="#edf4f8" stroke="#263d4d" /><text x="44" y="71" text-anchor="middle" font-size="24" fill="#172b3a" data-campo="lotes.0" data-valor="37">37</text><rect x="89" y="40" width="65" height="46" fill="#edf4f8" stroke="#263d4d" /><text x="121" y="71" text-anchor="middle" font-size="24" fill="#172b3a" data-campo="lotes.1" data-valor="41">41</text><rect x="166" y="40" width="65" height="46" fill="#edf4f8" stroke="#263d4d" /><text x="198" y="71" text-anchor="middle" font-size="24" fill="#172b3a" data-campo="lotes.2" data-valor="46">46</text><rect x="243" y="40" width="65" height="46" fill="#edf4f8" stroke="#263d4d" /><text x="275" y="71" text-anchor="middle" font-size="24" fill="#172b3a" data-campo="lotes.3" data-valor="52">52</text><path d="M160 87V113M156 108L160 113L164 108" fill="none" stroke="#263d4d" stroke-width="2"/><rect x="29" y="121" width="262" height="64" fill="#fff3df" stroke="#263d4d" /><text x="160" y="145" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="reserva" data-valor="2">Separar 2 rodas de reserva</text><circle cx="145" cy="169" r="8" fill="#edf4f8" stroke="#263d4d" data-roda-reserva="0"/><circle cx="175" cy="169" r="8" fill="#edf4f8" stroke="#263d4d" data-roda-reserva="1"/><path d="M160 186V215M156 210L160 215L164 210" fill="none" stroke="#263d4d" stroke-width="2"/><text x="160" y="243" text-anchor="middle" font-size="18" fill="#172b3a" >Usar todas as rodas restantes</text><text x="160" y="272" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="rodas_por_carrinho" data-valor="4">Cada carrinho: 4 rodas</text><rect x="80" y="293" width="160" height="35" fill="#edf4f8" stroke="#263d4d" /><circle cx="95" cy="291" r="9" fill="#edf4f8" stroke="#263d4d" data-roda-carrinho="sim"/><circle cx="225" cy="291" r="9" fill="#edf4f8" stroke="#263d4d" data-roda-carrinho="sim"/><circle cx="95" cy="330" r="9" fill="#edf4f8" stroke="#263d4d" data-roda-carrinho="sim"/><circle cx="225" cy="330" r="9" fill="#edf4f8" stroke="#263d4d" data-roda-carrinho="sim"/></svg>
