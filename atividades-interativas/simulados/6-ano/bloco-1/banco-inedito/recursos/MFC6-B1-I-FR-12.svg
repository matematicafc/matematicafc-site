<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 413" width="320" height="413" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-12-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-12-FRV1-descricao"><title id="MFC6-B1-I-FR-12-FRV1-titulo">Completar com placas iguais</title><desc id="MFC6-B1-I-FR-12-FRV1-descricao">Faixa inteira dividida em oito partes iguais, com cinco destacadas como já cobertas. Abaixo e fora da faixa aparece uma única peça igual às disponíveis, cuja largura é 1/16 do comprimento da faixa e cuja altura é a mesma. Peça e faixa usam a mesma escala. Não são desenhadas peças encaixadas na parte restante nem informada a quantidade necessária.</desc><rect x="0" y="0" width="320" height="413" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="ja_coberto" data-valor="5/8">Já coberto: 5/8 da faixa</text><rect x="32.0" y="49" width="32.0" height="64" fill="#aac7dd" stroke="#263d4d" data-barra="faixa" data-parte="0" data-preenchida="true"/><rect x="64.0" y="49" width="32.0" height="64" fill="#aac7dd" stroke="#263d4d" data-barra="faixa" data-parte="1" data-preenchida="true"/><rect x="96.0" y="49" width="32.0" height="64" fill="#aac7dd" stroke="#263d4d" data-barra="faixa" data-parte="2" data-preenchida="true"/><rect x="128.0" y="49" width="32.0" height="64" fill="#aac7dd" stroke="#263d4d" data-barra="faixa" data-parte="3" data-preenchida="true"/><rect x="160.0" y="49" width="32.0" height="64" fill="#aac7dd" stroke="#263d4d" data-barra="faixa" data-parte="4" data-preenchida="true"/><rect x="192.0" y="49" width="32.0" height="64" fill="white" stroke="#263d4d" data-barra="faixa" data-parte="5" data-preenchida="false"/><rect x="224.0" y="49" width="32.0" height="64" fill="white" stroke="#263d4d" data-barra="faixa" data-parte="6" data-preenchida="false"/><rect x="256.0" y="49" width="32.0" height="64" fill="white" stroke="#263d4d" data-barra="faixa" data-parte="7" data-preenchida="false"/><text x="160" y="145" text-anchor="middle" font-size="17" fill="#172b3a" >Faixa inteira em oito partes iguais</text><text x="160" y="195" text-anchor="middle" font-size="19" fill="#172b3a" >Uma peça disponível</text><rect x="152" y="216" width="16.0" height="64" fill="#fff3df" stroke="#263d4d" data-peca="modelo"/><text x="160" y="316" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="por_peca" data-valor="1/16">Cada peça cobre 1/16 da faixa</text><text x="160" y="357" text-anchor="middle" font-size="17" fill="#172b3a" >Peça e faixa na mesma escala</text><text x="160" y="386" text-anchor="middle" font-size="16" fill="#172b3a" >Cobrir exatamente a parte restante</text></svg>
