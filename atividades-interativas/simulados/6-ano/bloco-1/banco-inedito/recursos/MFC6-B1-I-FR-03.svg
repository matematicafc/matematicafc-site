<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 357" width="320" height="357" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-03-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-03-FRV1-descricao"><title id="MFC6-B1-I-FR-03-FRV1-titulo">Dois lotes com o mesmo inteiro</title><desc id="MFC6-B1-I-FR-03-FRV1-descricao">Duas barras de igual comprimento representam a mesma bobina inteira de referência. A reserva A destaca duas de cinco partes iguais; a reserva B destaca três de dez partes iguais. Cada barra tem extremos zero e uma bobina. Não há barra da soma nem do restante.</desc><rect x="0" y="0" width="320" height="357" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" >Mesma bobina de referência</text><text x="160" y="66" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="reserva_A" data-valor="2/5">Reserva A: 2/5</text><rect x="30.0" y="84" width="52.0" height="44" fill="#aac7dd" stroke="#263d4d" data-barra="A" data-parte="0" data-preenchida="true"/><rect x="82.0" y="84" width="52.0" height="44" fill="#aac7dd" stroke="#263d4d" data-barra="A" data-parte="1" data-preenchida="true"/><rect x="134.0" y="84" width="52.0" height="44" fill="white" stroke="#263d4d" data-barra="A" data-parte="2" data-preenchida="false"/><rect x="186.0" y="84" width="52.0" height="44" fill="white" stroke="#263d4d" data-barra="A" data-parte="3" data-preenchida="false"/><rect x="238.0" y="84" width="52.0" height="44" fill="white" stroke="#263d4d" data-barra="A" data-parte="4" data-preenchida="false"/><text x="30" y="152" text-anchor="middle" font-size="16" fill="#172b3a" >0</text><text x="290" y="152" text-anchor="end" font-size="16" fill="#172b3a" >1 bobina</text><text x="160" y="202" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="reserva_B" data-valor="3/10">Reserva B: 3/10</text><rect x="30.0" y="220" width="26.0" height="44" fill="#aac7dd" stroke="#263d4d" data-barra="B" data-parte="0" data-preenchida="true"/><rect x="56.0" y="220" width="26.0" height="44" fill="#aac7dd" stroke="#263d4d" data-barra="B" data-parte="1" data-preenchida="true"/><rect x="82.0" y="220" width="26.0" height="44" fill="#aac7dd" stroke="#263d4d" data-barra="B" data-parte="2" data-preenchida="true"/><rect x="108.0" y="220" width="26.0" height="44" fill="white" stroke="#263d4d" data-barra="B" data-parte="3" data-preenchida="false"/><rect x="134.0" y="220" width="26.0" height="44" fill="white" stroke="#263d4d" data-barra="B" data-parte="4" data-preenchida="false"/><rect x="160.0" y="220" width="26.0" height="44" fill="white" stroke="#263d4d" data-barra="B" data-parte="5" data-preenchida="false"/><rect x="186.0" y="220" width="26.0" height="44" fill="white" stroke="#263d4d" data-barra="B" data-parte="6" data-preenchida="false"/><rect x="212.0" y="220" width="26.0" height="44" fill="white" stroke="#263d4d" data-barra="B" data-parte="7" data-preenchida="false"/><rect x="238.0" y="220" width="26.0" height="44" fill="white" stroke="#263d4d" data-barra="B" data-parte="8" data-preenchida="false"/><rect x="264.0" y="220" width="26.0" height="44" fill="white" stroke="#263d4d" data-barra="B" data-parte="9" data-preenchida="false"/><text x="30" y="288" text-anchor="middle" font-size="16" fill="#172b3a" >0</text><text x="290" y="288" text-anchor="end" font-size="16" fill="#172b3a" >1 bobina</text><text x="160" y="331" text-anchor="middle" font-size="16" fill="#172b3a" >Reservas mostradas separadamente</text></svg>
