<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 414" width="320" height="414" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-11-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-11-MDV1-descricao"><title id="MFC6-B1-I-MD-11-MDV1-titulo">Páginas marcadas por dois monitores</title><desc id="MFC6-B1-I-MD-11-MDV1-descricao">Quadro com páginas de 1 a 24. Triângulos do monitor A marcam 4, 8, 12, 16, 20 e 24. Quadrados do monitor B marcam 6, 12, 18 e 24. As páginas 12 e 24 têm as duas formas. A legenda diferencia as marcas por forma e texto, sem apresentar o total de páginas marcadas.</desc><rect x="0" y="0" width="320" height="414" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="primeira_pagina" data-valor="1">Página inicial: 1</text><text x="160" y="51" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="ultima_pagina" data-valor="24">Página final: 24</text><path d="M14 67L21 80H7Z" fill="#dceacb" stroke="#263d4d"/><text x="174" y="79" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="passo_A" data-valor="4">A: múltiplos de 4</text><rect x="7" y="94" width="14" height="14" fill="#fff3df" stroke="#263d4d" /><text x="174" y="107" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="passo_B" data-valor="6">B: múltiplos de 6</text><rect x="15" y="131" width="44" height="51" fill="white" stroke="#263d4d" /><text x="37" y="154" text-anchor="middle" font-size="19" fill="#172b3a" data-pagina="1">1</text><rect x="64" y="131" width="44" height="51" fill="white" stroke="#263d4d" /><text x="86" y="154" text-anchor="middle" font-size="19" fill="#172b3a" data-pagina="2">2</text><rect x="113" y="131" width="44" height="51" fill="white" stroke="#263d4d" /><text x="135" y="154" text-anchor="middle" font-size="19" fill="#172b3a" data-pagina="3">3</text><rect x="162" y="131" width="44" height="51" fill="white" stroke="#263d4d" /><text x="184" y="154" text