<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-09-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-09-MDV1-descricao"><title id="MFC6-B1-I-MD-09-MDV1-titulo">Cartaz retangular com linhas limitadas</title><desc id="MFC6-B1-I-MD-09-MDV1-descricao">Trinta e sete peças individuais disponíveis, desenhadas em cinco linhas de sete e uma linha de duas apenas para contagem do estoque. Elas devem ser reorganizadas em um retângulo com pelo menos duas linhas e duas colunas, usando todas sem sobra. O estoque não representa um painel pronto.</desc><rect x="0" y="0" width="320" height="340" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="pecas" data-valor="37">37 peças disponíveis</text><rect x="36" y="48" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="0"/><rect x="72" y="48" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="1"/><rect x="108" y="48" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="2"/><rect x="144" y="48" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="3"/><rect x="180" y="48" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="4"/><rect x="216" y="48" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="5"/><rect x="252" y="48" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="6"/><rect x="36" y="78" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="7"/><rect x="72" y="78" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="8"/><rect x="108" y="78" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="9"/><rect x="144" y="78" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="10"/><rect x="180" y="78" width="31" height="25" fill="#edf4f8" stroke="#263d4d" data-peca="11"/><rect x="216" y="78" width="31" height="25" fil