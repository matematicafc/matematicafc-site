<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 298" width="320" height="298" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-06-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-06-FRV1-descricao"><title id="MFC6-B1-I-FR-06-FRV1-titulo">Total desconhecido, parte conhecida</title><desc id="MFC6-B1-I-FR-06-FRV1-descricao">O estoque inteiro desconhecido aparece em uma barra com cinco partes iguais. As três primeiras estão destacadas, correspondendo a 3/5. Uma chave liga essas três partes à indicação de 18 objetos catalogados, como quantidade conjunta e não por parte. Os objetos por quinto e o total do estoque não estão indicados.</desc><rect x="0" y="0" width="320" height="298" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Estoque inteiro: ? objetos</text><rect x="30.0" y="59" width="52.0" height="65" fill="#aac7dd" stroke="#263d4d" data-barra="estoque" data-parte="0" data-preenchida="true"/><rect x="82.0" y="59" width="52.0" height="65" fill="#aac7dd" stroke="#263d4d" data-barra="estoque" data-parte="1" data-preenchida="true"/><rect x="134.0" y="59" width="52.0" height="65" fill="#aac7dd" stroke="#263d4d" data-barra="estoque" data-parte="2" data-preenchida="true"/><rect x="186.0" y="59" width="52.0" height="65" fill="white" stroke="#263d4d" data-barra="estoque" data-parte="3" data-preenchida="false"/><rect x="238.0" y="59" width="52.0" height="65" fill="white" stroke="#263d4d" data-barra="estoque" data-parte="4" data-preenchida="false"/><path d="M30 146V151H186.0V146" stroke="#263d4d" stroke-width="2" fill="none"/><text x="112" y="181" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="objetos_catalogados" data-valor="18">18 catalogados</text><text x="160" y="232" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="fracao_catalogada" data-valor="3/5">Parte catalogada: 3/5</text><text x="160" y="271" text-anchor="middle" font-size="15" fill="#172b3a" >Partes com igual quantidade de objetos</text></svg>
