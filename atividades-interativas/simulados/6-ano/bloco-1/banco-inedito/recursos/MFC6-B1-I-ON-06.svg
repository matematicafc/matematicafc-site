<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 363" width="320" height="363" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-06-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-06-ONV1-descricao"><title id="MFC6-B1-I-ON-06-ONV1-titulo">Restaurar uma pilha</title><desc id="MFC6-B1-I-ON-06-ONV1-descricao">Fluxo vertical: quantidade inicial desconhecida, retirada de 17 copos, quantidade intermediária desconhecida, acréscimo de nove copos e quantidade final de 36. As setas seguem a ordem real das mudanças.</desc><rect x="0" y="0" width="320" height="363" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="19" fill="#172b3a" >Início desconhecido</text><rect x="70" y="39" width="180" height="46" rx="3" fill="white" stroke="#263d4d" /><text x="160" y="69" text-anchor="middle" font-size="25" fill="#172b3a" >? copos</text><path d="M160 86V142" stroke="#263d4d" stroke-width="2"/><path d="M156 137L160 142L164 137" fill="none" stroke="#263d4d" stroke-width="2"/><rect x="55" y="103" width="210" height="27" rx="3" fill="white" stroke="#263d4d" /><text x="160" y="123" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="retirados" data-valor="17">Retirar 17 copos</text><rect x="70" y="149" width="180" height="46" rx="3" fill="white" stroke="#263d4d" /><text x="160" y="179" text-anchor="middle" font-size="25" fill="#172b3a" >? copos</text><path d="M160 196V255" stroke="#263d4d" stroke-width="2"/><path d="M156 250L160 255L164 250" fill="none" stroke="#263d4d" stroke-width="2"/><rect x="45" y="214" width="230" height="27" rx="3" fill="white" stroke="#263d4d" /><text x="160" y="234" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="acrescentados" data-valor="9">Acrescentar 9 copos</text><rect x="70" y="261" width="180" height="50" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="295" text-anchor="middle" font-size="27" fill="#172b3a" data-campo="quantidade_final" data-valor="36">36 copos</text><text x="160" y="340" text-anchor="middle" font-size="18" fill="#172b3a" >Quantidade final</text></svg>
