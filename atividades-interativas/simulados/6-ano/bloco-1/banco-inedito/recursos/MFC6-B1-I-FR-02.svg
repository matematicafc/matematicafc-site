<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 272" width="320" height="272" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-02-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-02-FRV1-descricao"><title id="MFC6-B1-I-FR-02-FRV1-titulo">Metade de uma metade</title><desc id="MFC6-B1-I-FR-02-FRV1-descricao">Folha retangular de 240 por 100 unidades gráficas. A metade esquerda é subdividida em duas regiões de 120 por 50; a região superior esquerda é a etiqueta destacada. A metade direita tem 120 por 100 e permanece inteira. Há duas etiquetas de mesma área e uma região maior; nenhuma fração de resposta está escrita.</desc><rect x="0" y="0" width="320" height="272" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Folha original</text><rect x="40" y="67" width="120" height="50" fill="#aac7dd" stroke="#263d4d" data-regiao="etiqueta"/><rect x="40" y="117" width="120" height="50" fill="white" stroke="#263d4d" data-regiao="outra_etiqueta"/><rect x="160" y="67" width="120" height="100" fill="white" stroke="#263d4d" data-regiao="metade_inteira"/><text x="100" y="98" text-anchor="middle" font-size="16" fill="#172b3a" >Etiqueta</text><text x="220" y="113" text-anchor="middle" font-size="16" fill="#172b3a" >Metade</text><text x="220" y="136" text-anchor="middle" font-size="16" fill="#172b3a" >inteira</text><text x="160" y="213" text-anchor="middle" font-size="16" fill="#172b3a" data-campo="primeira_divisao" data-valor="2">Primeira divisão: 2 partes iguais</text><text x="160" y="245" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="segunda_divisao_da_metade" data-valor="2">Uma metade dividida em 2</text></svg>
