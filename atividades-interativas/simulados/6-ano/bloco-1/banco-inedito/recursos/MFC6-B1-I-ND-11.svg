<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 404" width="320" height="404" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-11-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-11-NDV1-descricao"><title id="MFC6-B1-I-ND-11-NDV1-titulo">Comparar sem antecipar arredondamentos</title><desc id="MFC6-B1-I-ND-11-NDV1-descricao">Três etiquetas de itens, cada uma com preço de R$ 4,49. Setas indicam primeiro somar para obter o total exato desconhecido e depois arredondar somente esse total. A regra mantém os reais quando os centavos vão de 00 a 49 e sobe um real quando vão de 50 a 99. Nenhum item arredondado, soma ou resultado final é apresentado.</desc><rect x="0" y="0" width="320" height="404" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Três itens do orçamento</text><rect x="12" y="49" width="90" height="75" fill="#edf4f8" stroke="#263d4d" /><text x="57" y="74" text-anchor="middle" font-size="17" fill="#172b3a" >Item 1</text><text x="57" y="106" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="itens_reais.0" data-valor="4.49">R$ 4,49</text><rect x="115" y="49" width="90" height="75" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="74" text-anchor="middle" font-size="17" fill="#172b3a" >Item 2</text><text x="160" y="106" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="itens_reais.1" data-valor="4.49">R$ 4,49</text><rect x="218" y="49" width="90" height="75" fill="#edf4f8" stroke="#263d4d" /><text x="263" y="74" text-anchor="middle" font-size="17" fill="#172b3a" >Item 3</text><text x="263" y="106" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="itens_reais.2" data-valor="4.49">R$ 4,49</text><path d="M160 137V173M156 168L160 173L164 168" stroke="#263d4d" stroke-width="2" fill="none"/><rect x="39" y="187" width="242" height="55" fill="white" stroke="#263d4d" /><text x="160" y="222" text-anchor="middle" font-size="21" fill="#172b3a" >Somar: total exato ?</text><path d="M160 243V275M156 270L160 275L164 270" stroke="#263d4d" stroke-width="2" fill="none"/><text x="160" y="308" text-anchor="middle" font-size="19" fill="#172b3a" >Arredondar somente o total</text><text x="160" y="344" text-anchor="middle" font-size="16" fill="#172b3a" >Centavos de 00 a 49: manter os reais</text><text x="160" y="374" text-anchor="middle" font-size="16" fill="#172b3a" >Centavos de 50 a 99: subir um real</text></svg>
