<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 325" width="320" height="325" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-07-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-07-ONV1-descricao"><title id="MFC6-B1-I-ON-07-ONV1-titulo">Canal de envio mais rápido</title><desc id="MFC6-B1-I-ON-07-ONV1-descricao">Pasta de 60 arquivos. Canal A: preparação de três minutos seguida de envio a seis arquivos por minuto. Canal B: preparação de sete minutos seguida de envio a dez arquivos por minuto. Os blocos indicam fases, não durações em escala; os totais não estão calculados.</desc><rect x="0" y="0" width="320" height="325" fill="white"/><text x="160" y="28" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="arquivos" data-valor="60">Pasta com 60 arquivos</text><text x="85" y="64" text-anchor="middle" font-size="20" fill="#172b3a" >Canal A</text><rect x="20" y="80" width="130" height="64" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="85" y="103" text-anchor="middle" font-size="16" fill="#172b3a" >Preparação</text><text x="85" y="130" text-anchor="middle" font-size="24" fill="#172b3a" data-campo="canal_A_preparo_min" data-valor="3">3 min</text><path d="M85 145V177" stroke="#263d4d" stroke-width="2"/><path d="M81 172L85 177L89 172" fill="none" stroke="#263d4d" stroke-width="2"/><rect x="20" y="186" width="130" height="79" rx="3" fill="white" stroke="#263d4d" /><text x="85" y="210" text-anchor="middle" font-size="17" fill="#172b3a" >Envio</text><text x="85" y="239" text-anchor="middle" font-size="15" fill="#172b3a" data-campo="canal_A_arquivos_por_min" data-valor="6">6 arquivos/min</text><text x="235" y="64" text-anchor="middle" font-size="20" fill="#172b3a" >Canal B</text><rect x="170" y="80" width="130" height="64" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="235" y="103" text-anchor="middle" font-size="16" fill="#172b3a" >Preparação</text><text x="235" y="130" text-anchor="middle" font-size="24" fill="#172b3a" data-campo="canal_B_preparo_min" data-valor="7">7 min</text><path d="M235 145V177" stroke="#263d4d" stroke-width="2"/><path d="M231 172L235 177L239 172" fill="none" stroke="#263d4d" stroke-width="2"/><rect x="170" y="186" width="130" height="79" rx="3" fill="white" stroke="#263d4d" /><text x="235" y="210" text-anchor="middle" font-size="17" fill="#172b3a" >Envio</text><text x="235" y="239" text-anchor="middle" font-size="15" fill="#172b3a" data-campo="canal_B_arquivos_por_min" data-valor="10">10 arquivos/min</text><text x="160" y="301" text-anchor="middle" font-size="16" fill="#172b3a" >Preparar primeiro, depois transmitir</text></svg>
