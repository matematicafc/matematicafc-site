<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-08-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-08-ONV1-descricao"><title id="MFC6-B1-I-ON-08-ONV1-titulo">Desconto ou entrega grátis</title><desc id="MFC6-B1-I-ON-08-ONV1-descricao">Preço anunciado comum de R$ 80. Na loja A, desconto de R$ 12 e depois entrega de R$ 15. Na loja B, o preço anunciado é mantido e a entrega custa R$ 0. Os gastos finais não estão escritos.</desc><rect x="0" y="0" width="320" height="300" fill="white"/><text x="160" y="26" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="produto_reais" data-valor="80">Preço anunciado: R$ 80</text><text x="84" y="62" text-anchor="middle" font-size="20" fill="#172b3a" >Loja A</text><rect x="19" y="78" width="130" height="58" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="84" y="100" text-anchor="middle" font-size="16" fill="#172b3a" >Desconto</text><text x="84" y="126" text-anchor="middle" font-size="23" fill="#172b3a" data-campo="loja_A_desconto_reais" data-valor="12">- R$ 12</text><path d="M84 137V169" stroke="#263d4d" stroke-width="2"/><path d="M80 164L84 169L88 164" fill="none" stroke="#263d4d" stroke-width="2"/><rect x="19" y="176" width="130" height="59" rx="3" fill="white" stroke="#263d4d" /><text x="84" y="199" text-anchor="middle" font-size="16" fill="#172b3a" >Entrega</text><text x="84" y="226" text-anchor="middle" font-size="23" fill="#172b3a" data-campo="loja_A_entrega_reais" data-valor="15">+ R$ 15</text><text x="236" y="62" text-anchor="middle" font-size="20" fill="#172b3a" >Loja B</text><rect x="171" y="78" width="130" height="58" rx="3" fill="white" stroke="#263d4d" /><text x="236" y="101" text-anchor="middle" font-size="14" fill="#172b3a" >Preço anunciado</text><text x="236" y="125" text-anchor="middle" font-size="15" fill="#172b3a" >Sem desconto</text><path d="M236 137V169" stroke="#263d4d" stroke-width="2"/><path d="M232 164L236 169L240 164" fill="none" stroke="#263d4d" stroke-width="2"/><rect x="171" y="176" width="130" height="59" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="236" y="199" text-anchor="middle" font-size="15" fill="#172b3a" >Entrega grátis</text><text x="236" y="226" text-anchor="middle" font-size="23" fill="#172b3a" data-campo="loja_B_entrega_reais" data-valor="0">R$ 0</text><text x="160" y="276" text-anchor="middle" font-size="18" fill="#172b3a" >Comparar o gasto total</text></svg>
