<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 378" width="320" height="378" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-08-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-08-NDV1-descricao"><title id="MFC6-B1-I-ND-08-NDV1-titulo">Quanto de fio pode ser comprado?</title><desc id="MFC6-B1-I-ND-08-NDV1-descricao">Orçamento de R$ 9,00. Um segmento de referência tem comprimento de um metro e preço de R$ 2,40. Uma seta liga essa correspondência ao comprimento desconhecido que pode ser adquirido pelo orçamento, sem taxa extra. Não é desenhado um fio de comprimento final nem um total de metros calculado.</desc><rect x="0" y="0" width="320" height="378" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="22" fill="#172b3a" data-campo="orcamento_reais" data-valor="9.00">Orçamento: R$ 9,00</text><text x="160" y="71" text-anchor="middle" font-size="19" fill="#172b3a" >Preço de referência</text><path d="M45 104H145M45 98V110M145 98V110" stroke="#263d4d" stroke-width="2"/><text x="95" y="133" text-anchor="middle" font-size="18" fill="#172b3a" >1 metro</text><text x="226" y="111" text-anchor="middle" font-size="22" fill="#172b3a" data-campo="preco_por_metro_reais" data-valor="2.40">R$ 2,40</text><text x="160" y="169" text-anchor="middle" font-size="16" fill="#172b3a" >Comprimento e custo proporcionais</text><path d="M160 184V214M156 209L160 214L164 209" stroke="#263d4d" stroke-width="2" fill="none"/><rect x="29" y="229" width="262" height="78" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="258" text-anchor="middle" font-size="20" fill="#172b3a" >? metros pelo orçamento</text><text x="160" y="288" text-anchor="middle" font-size="17" fill="#172b3a" >Sem taxa extra</text><text x="160" y="350" text-anchor="middle" font-size="15" fill="#172b3a" >O trecho a comprar ainda não foi medido</text></svg>
