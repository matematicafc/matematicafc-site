<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 383" width="320" height="383" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-07-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-07-FRV1-descricao"><title id="MFC6-B1-I-FR-07-FRV1-titulo">Comparar pedaços de duas fitas</title><desc id="MFC6-B1-I-FR-07-FRV1-descricao">Fita A de 20 cm, dividida em cinco partes iguais, com as três primeiras destacadas como 3/5. Fita B de 24 cm, alinhada à esquerda e sem subdivisões ou trecho destacado. As duas fitas usam a mesma escala, 12 pixels por centímetro. O pedaço mantém o comprimento físico ao mudar a referência; nem seu comprimento calculado nem sua fração de B estão escritos.</desc><rect x="0" y="0" width="320" height="383" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="fita_A_cm" data-valor="20">Fita A inteira: 20 cm</text><rect x="16.0" y="46" width="48.0" height="54" fill="#aac7dd" stroke="#263d4d" data-barra="A" data-parte="0" data-preenchida="true"/><rect x="64.0" y="46" width="48.0" height="54" fill="#aac7dd" stroke="#263d4d" data-barra="A" data-parte="1" data-preenchida="true"/><rect x="112.0" y="46" width="48.0" height="54" fill="#aac7dd" stroke="#263d4d" data-barra="A" data-parte="2" data-preenchida="true"/><rect x="160.0" y="46" width="48.0" height="54" fill="white" stroke="#263d4d" data-barra="A" data-parte="3" data-preenchida="false"/><rect x="208.0" y="46" width="48.0" height="54" fill="white" stroke="#263d4d" data-barra="A" data-parte="4" data-preenchida="false"/><text x="160" y="129" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="pedaco_de_A" data-valor="3/5">Pedaço destacado: 3/5 de A</text><text x="160" y="191" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="fita_B_cm" data-valor="24">Fita B inteira: 24 cm</text><rect x="16" y="214" width="288" height="54" fill="white" stroke="#263d4d" data-fita-inteira="B"/><text x="160" y="301" text-anchor="middle" font-size="17" fill="#172b3a" >O mesmo pedaço, outra referência</text><text x="160" y="330" text-anchor="middle" font-size="17" fill="#172b3a" >Seu comprimento não muda</text><text x="160" y="357" text-anchor="middle" font-size="16" fill="#172b3a" >Fitas inteiras na mesma escala</text></svg>
