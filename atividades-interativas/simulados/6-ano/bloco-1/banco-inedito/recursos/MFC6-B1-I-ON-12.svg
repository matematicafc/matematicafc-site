<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-12-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-12-ONV1-descricao"><title id="MFC6-B1-I-ON-12-ONV1-titulo">Reforma por faixas</title><desc id="MFC6-B1-I-ON-12-ONV1-descricao">Dois retângulos adjacentes têm altura comum de três metros e larguras de quatro e seis metros. A mesma escala é usada nos dois. Cada retângulo está dividido em quadradinhos de um metro por um metro; a área total não está escrita.</desc><rect x="0" y="0" width="320" height="250" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="20" fill="#172b3a" >Faixas lado a lado</text><rect x="40" y="82" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="0" data-coluna="0"/><rect x="64" y="82" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="0" data-coluna="1"/><rect x="88" y="82" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="0" data-coluna="2"/><rect x="112" y="82" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="0" data-coluna="3"/><rect x="40" y="106" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="1" data-coluna="0"/><rect x="64" y="106" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="1" data-coluna="1"/><rect x="88" y="106" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="1" data-coluna="2"/><rect x="112" y="106" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="1" data-coluna="3"/><rect x="40" y="130" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" data-faixa="1" data-linha="2" data-coluna="0"/><rect x="64" y="130" width="24" height="24" rx="3" fill="#edf4f8" stroke="#263d4d" 