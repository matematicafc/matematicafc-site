<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 283" width="320" height="283" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-06-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-06-MDV1-descricao"><title id="MFC6-B1-I-MD-06-MDV1-titulo">Uma planta entre estacas</title><desc id="MFC6-B1-I-MD-06-MDV1-descricao">Dezenove estacas marcam dezoito espaços iguais em uma linha. Os plantios iniciais aparecem junto às estacas 0 e 2, com arco de dois espaços; o plantio no extremo final aparece junto à estaca 18. Os plantios intermediários ficam a determinar seguindo o mesmo avanço. Os dois extremos são incluídos.</desc><rect x="0" y="0" width="320" height="283" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="espacos_entre_estacas" data-valor="18">18 espaços iguais</text><text x="160" y="57" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="espacos_por_planta" data-valor="2">Avançar 2 espaços</text><path d="M25 150H295" stroke="#263d4d" stroke-width="2"/><path d="M25 134V166" stroke="#263d4d" stroke-width="2" data-estaca="0" data-x="25"/><path d="M40 134V166" stroke="#263d4d" stroke-width="2" data-estaca="1" data-x="40"/><path d="M55 134V166" stroke="#263d4d" stroke-width="2" data-estaca="2" data-x="55"/><path d="M70 134V166" stroke="#263d4d" stroke-width="2" data-estaca="3" data-x="70"/><path d="M85 134V166" stroke="#263d4d" stroke-width="2" data-estaca="4" data-x="85"/><path d="M100 134V166" stroke="#263d4d" stroke-width="2" data-estaca="5" data-x="100"/><path d="M115 134V166" stroke="#263d4d" stroke-width="2" data-estaca="6" data-x="115"/><path d="M130 134V166" stroke="#263d4d" stroke-width="2" data-estaca="7" data-x="130"/><path d="M145 134V166" stroke="#263d4d" stroke-width="2" data-estaca="8" data-x="145"/><path d="M160 134V166" stroke="#263d4d" stroke-width="2" data-estaca="9" data-x="160"/><path d="M175 134V166" stroke="#263d4d" stroke-width="2" data-estaca="10" data-x="175"/><path d="M190 134V166" stroke="#263d4d" stroke-width="2" data-estaca="11" data-x="190"/><path d="M205 134V166" stroke="#263d4d" stroke-width="2" data-estaca="12" data-x="205"/><path d="M220 134V166" stroke="#263d4d" stroke-width="2" data-estaca="13" data-x="220"/><path d="M235 134V166" stroke="#263d4d" stroke-width="2" data-estaca="14" data-x="235"/><path d="M250 134V166" stroke="#263d4d" stroke-width="2" data-estaca="15" data-x="250"/><path d="M265 134V166" stroke="#263d4d" stroke-width="2" data-estaca="16" data-x="265"/><path d="M280 134V166" stroke="#263d4d" stroke-width="2" data-estaca="17" data-x="280"/><path d="M295 134V166" stroke="#263d4d" stroke-width="2" data-estaca="18" data-x="295"/><circle cx="25" cy="115" r="7" fill="#dceacb" stroke="#263d4d" data-plantio="0"/><path d="M25 122V134" stroke="#263d4d"/><text x="25" y="189" text-anchor="middle" font-size="16" fill="#172b3a" >0</text><circle cx="55" cy="115" r="7" fill="#dceacb" stroke="#263d4d" data-plantio="2"/><path d="M55 122V134" stroke="#263d4d"/><text x="55" y="189" text-anchor="middle" font-size="16" fill="#172b3a" >2</text><circle cx="295" cy="115" r="7" fill="#dceacb" stroke="#263d4d" data-plantio="18"/><path d="M295 122V134" stroke="#263d4d"/><text x="295" y="189" text-anchor="middle" font-size="16" fill="#172b3a" >18</text><path d="M25 99Q40 78 55 99" fill="none" stroke="#263d4d" stroke-width="2"/><text x="160" y="227" text-anchor="middle" font-size="18" fill="#172b3a" >Plantio junto à estaca</text><text x="160" y="256" text-anchor="middle" font-size="18" fill="#172b3a" >Incluir os dois extremos</text></svg>
