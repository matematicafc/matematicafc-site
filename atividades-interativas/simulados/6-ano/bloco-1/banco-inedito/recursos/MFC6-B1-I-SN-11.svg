<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-labelledby="MFC6-B1-I-SN-11-SNV1-titulo" aria-describedby="MFC6-B1-I-SN-11-SNV1-descricao" class="mfc-sn-svg" style="font-family:Arial,sans-serif"><title id="MFC6-B1-I-SN-11-SNV1-titulo">O limite de uma contagem aproximada</title><desc id="MFC6-B1-I-SN-11-SNV1-descricao">Anúncio de 70.000 visitantes e reta com 60.000, 70.000 e 80.000 como marcas principais. Há uma marca menor no meio de cada intervalo; as marcas intermediárias não têm valores escritos.</desc><rect x="0" y="0" width="320" height="240" fill="white" data-fundo="true"/><text x="160" y="25" text-anchor="middle" font-size="18" fill="#172b3a" >Anúncio aproximado</text><text x="160" y="68" text-anchor="middle" font-size="34" fill="#172b3a" data-leitura="70000">70.000</text><text x="160" y="100" text-anchor="middle" font-size="18" fill="#172b3a" >visitantes</text><path d="M35 150H285" stroke="#172b3a" stroke-width="2"/><path d="M35.0 144V156" stroke="#172b3a" data-eixo="dezenas_milhar" data-marca="60000" data-x="35.0"/><text x="35.0" y="182" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="dezenas_milhar" data-valor="60000">60.000</text><path d="M97.5 144V156" stroke="#172b3a" data-eixo="dezenas_milhar" data-marca="65000" data-x="97.5"/><path d="M160.0 144V156" stroke="#172b3a" data-eixo="dezenas_milhar" data-marca="70000" data-x="160.0"/><text x="160.0" y="182" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="dezenas_milhar" data-valor="70000">70.000</text><path d="M222.5 144V156" stroke="#172b3a" data-eixo="dezenas_milhar" data-marca="75000" data-x="222.5"/><path d="M285.0 144V156" stroke="#172b3a" data-eixo="dezenas_milhar" data-marca="80000" data-x="285.0"/><text x="285.0" y="182" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="dezenas_milhar" data-valor="80000">80.000</text><text x="160" y="218" text-anchor="middle" font-size="17" fill="#172b3a" >Passo principal: 10.000</text></svg>
