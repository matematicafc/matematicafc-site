<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 205" width="320" height="205" role="img" aria-labelledby="MFC6-B1-I-SN-03-SNV1-titulo" aria-describedby="MFC6-B1-I-SN-03-SNV1-descricao" class="mfc-sn-svg" style="font-family:Arial,sans-serif"><title id="MFC6-B1-I-SN-03-SNV1-titulo">Leitura com unidade abreviada</title><desc id="MFC6-B1-I-SN-03-SNV1-descricao">Contador de acessos ao portal mostrando 2,4 k. A legenda informa que k indica mil. A quantidade por extenso ou em unidades não aparece no painel.</desc><rect x="0" y="0" width="320" height="205" fill="white" data-fundo="true"/><text x="160" y="32" text-anchor="middle" font-size="20" fill="#172b3a" >ACESSOS AO PORTAL</text><rect x="28" y="54" width="264" height="90" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="116" text-anchor="middle" font-size="42" fill="#172b3a" data-milhares="2.4">2,4 k</text><text x="160" y="180" text-anchor="middle" font-size="20" fill="#172b3a" >k indica mil</text></svg>
