<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 444" width="320" height="444" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-01-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-01-FRV1-descricao"><title id="MFC6-B1-I-FR-01-FRV1-titulo">Duas placas de tamanhos diferentes</title><desc id="MFC6-B1-I-FR-01-FRV1-descricao">Duas placas retangulares na mesma escala de área, com formatos diferentes. A tem área total de 12 cm² e formato horizontal de 240 por 60 unidades gráficas: duas partes iguais de 120 por 60, com uma pintada. B tem área total de 8 cm² e formato vertical de 80 por 120 unidades gráficas: quatro partes iguais de 80 por 30, com três pintadas. As frações 1/2 e 3/4 estão identificadas. As regiões pintadas têm formatos distintos, não estão sobrepostas nem alinhadas para comparação direta e suas áreas não estão calculadas.</desc><rect x="0" y="0" width="320" height="444" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" >Placas de formatos diferentes</text><text x="160" y="56" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="area_placa_A_cm2" data-valor="12">Placa A: área total 12 cm²</text><rect x="40" y="76" width="120" height="60" fill="#aac7dd" stroke="#263d4d" data-barra="A" data-parte="0" data-preenchida="true"/><rect x="160" y="76" width="120" height="60" fill="white" stroke="#263d4d" data-barra="A" data-parte="1" data-preenchida="false"/><rect x="120" y="231" width="80" height="30" fill="#aac7dd" stroke="#263d4d" data-barra="B" data-parte="0" data-preenchida="true"/><rect x="120" y="261" width="80" height="30" fill="#aac7dd" stroke="#263d4d" data-barra="B" data-parte="1" data-preenchida="true"/><rect x="120" y="291" width="80" height="30" fill="#aac7dd" stroke="#263d4d" data-barra="B" data-parte="2" data-preenchida="true"/><rect x="120" y="321" width="80" height="30" fill="white" stroke="#263d4d" data-barra="B" data-parte="3" data-preenchida="false"/><text x="160" y="166" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="fracao_A" data-valor="1/2">1/2 da placa A será pintado</text><text x="160" y="212" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="area_placa_B_cm2" data-valor="8">Placa B: área total 8 cm²</text><text x="160" y="386" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="fracao_B" data-valor="3/4">3/4 da placa B será pintado</text><text x="160" y="420" text-anchor="middle" font-size="15" fill="#172b3a" >Mesma escala de área; formatos distintos</text></svg>
