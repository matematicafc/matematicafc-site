<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 451" width="320" height="451" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-03-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-03-NDV1-descricao"><title id="MFC6-B1-I-ND-03-NDV1-titulo">Litros e mililitros no pedido</title><desc id="MFC6-B1-I-ND-03-NDV1-descricao">Jarra com escala auxiliar de zero a 1.000 mL, marcada a cada 200 mL. O nível de conteúdo está em 800 mL. Os 100 mL inferiores são hachurados como reserva obrigatória, dentro do conteúdo total. O pedido aparece separado como 0,75 L, e consta a equivalência 1 L = 1.000 mL. Não estão calculados o pedido em mililitros, a parte disponível ou a diferença.</desc><rect x="0" y="0" width="320" height="451" fill="white"/><defs><pattern id="MFC6-B1-I-ND-03-reserva" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#263d4d" stroke-width="1.5"/></pattern></defs><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Jarra graduada</text><rect x="77" y="78" width="100" height="230" fill="white" stroke="#263d4d" /><rect x="77" y="124.0" width="100" height="184.0" fill="#aac7dd" stroke="#263d4d" data-conteudo="sim"/><rect x="77" y="285.0" width="100" height="23.0" fill="url(#MFC6-B1-I-ND-03-reserva)" stroke="#263d4d" data-reserva="sim"/><path d="M65 308.0H77" stroke="#263d4d" data-graduacao="0" data-y="308.0"/><text x="57" y="314.0" text-anchor="end" font-size="16" fill="#172b3a" >0</text><path d="M65 262.0H77" stroke="#263d4d" data-graduacao="200" data-y="262.0"/><text x="57" y="268.0" text-anchor="end" font-size="16" fill="#172b3a" >200</text><path d="M65 216.0H77" stroke="#263d4d" data-graduacao="400" data-y="216.0"/><text x="57" y="222.0" text-anchor="end" font-size="16" fill="#172b3a" >400</text><path d="M65 170.0H77" stroke="#263d4d" data-graduacao="600" data-y="170.0"/><text x="57" y="176.0" text-anchor="end" font-size="16" fill="#172b3a" >600</text><path d="M65 124.0H77" stroke="#263d4d" data-graduacao="800" data-y="124.0"/><text x="57" y="130.0" text-anchor="end" font-size="16" fill="#172b3a" >800</text><path d="M65 78.0H77" stroke="#263d4d" data-graduacao="1000" data-y="78.0"/><text x="57" y="84.0" text-anchor="end" font-size="16" fill="#172b3a" >1000</text><text x="38" y="57" text-anchor="middle" font-size="17" fill="#172b3a" >mL</text><text x="243" y="117" text-anchor="middle" font-size="19" fill="#172b3a" >Pedido</text><text x="243" y="147" text-anchor="middle" font-size="25" fill="#172b3a" data-campo="pedido_litros" data-valor="0.75">0,75 L</text><text x="160" y="350" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="conteudo_ml" data-valor="800">Conteúdo: 800 mL</text><text x="160" y="382" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="reserva_obrigatoria_ml" data-valor="100">Reserva: 100 mL</text><text x="160" y="422" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="mililitros_por_litro" data-valor="1000">1 L = 1000 mL</text></svg>
