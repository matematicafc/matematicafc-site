<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 353" width="320" height="353" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-12-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-12-NDV1-descricao"><title id="MFC6-B1-I-ND-12-NDV1-titulo">Reserva mínima em uma medida</title><desc id="MFC6-B1-I-ND-12-NDV1-descricao">Rolo inteiro de 3,50 m, representado por uma barra com quatro tiras iguais de comprimento desconhecido e uma faixa final de reserva mínima de 0,10 m. Todos os comprimentos usam a mesma escala de 80 pixels por metro. As tiras têm interrogações, sem valores numéricos ou comprimento disponível calculado. O esquema mostra a configuração com a reserva mínima.</desc><rect x="0" y="0" width="320" height="353" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="22" fill="#172b3a" data-campo="rolo_m" data-valor="3.50">Rolo inteiro: 3,50 m</text><text x="160" y="63" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="tiras" data-valor="4">4 tiras de igual tamanho</text><rect x="20.0" y="107" width="68.0" height="65" fill="#edf4f8" stroke="#263d4d" data-tira="0"/><text x="54.0" y="146" text-anchor="middle" font-size="28" fill="#172b3a" >?</text><rect x="88.0" y="107" width="68.0" height="65" fill="#edf4f8" stroke="#263d4d" data-tira="1"/><text x="122.0" y="146" text-anchor="middle" font-size="28" fill="#172b3a" >?</text><rect x="156.0" y="107" width="68.0" height="65" fill="#edf4f8" stroke="#263d4d" data-tira="2"/><text x="190.0" y="146" text-anchor="middle" font-size="28" fill="#172b3a" >?</text><rect x="224.0" y="107" width="68.0" height="65" fill="#edf4f8" stroke="#263d4d" data-tira="3"/><text x="258.0" y="146" text-anchor="middle" font-size="28" fill="#172b3a" >?</text><rect x="292.0" y="107" width="8.0" height="65" fill="#fff3df" stroke="#263d4d" data-reserva="sim"/><path d="M296.0 178V212H160" stroke="#263d4d" fill="none"/><text x="160" y="248" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="sobra_minima_m" data-valor="0.10">Reserva mínima: 0,10 m</text><text x="160" y="294" text-anchor="middle" font-size="16" fill="#172b3a" >Cada tira: comprimento a determinar</text><text x="160" y="325" text-anchor="middle" font-size="16" fill="#172b3a" >Rolo, tiras e reserva na mesma escala</text></svg>
