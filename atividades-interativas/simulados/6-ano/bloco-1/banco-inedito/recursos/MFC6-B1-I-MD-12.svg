<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 454" width="320" height="454" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-12-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-12-MDV1-descricao"><title id="MFC6-B1-I-MD-12-MDV1-titulo">Calendário que não recomeça na segunda</title><desc id="MFC6-B1-I-MD-12-MDV1-descricao">Calendário de dias decorridos, começando no dia zero em uma segunda-feira. As colunas são segunda a domingo; os dias seguem de zero a 28. Círculos indicam inspeções nos dias 0, 4, 8, 12, 16, 20, 24 e 28. O ciclo continua entre semanas; nenhuma data de resposta está destacada de modo diferente.</desc><rect x="0" y="0" width="320" height="454" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="19" fill="#172b3a" >Calendário de dias decorridos</text><text x="160" y="51" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="intervalo_dias" data-valor="4">Inspeção a cada 4 dias</text><text x="160" y="77" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="dias_semana" data-valor="7">Semana com 7 dias</text><text x="39" y="108" text-anchor="middle" font-size="15" fill="#172b3a" >Seg</text><text x="79" y="108" text-anchor="middle" font-size="15" fill="#172b3a" >Ter</text><text x="119" y="108" text-anchor="middle" font-size="15" fill="#172b3a" >Qua</text><text x="159" y="108" text-anchor="middle" font-size="15" fill="#172b3a" >Qui</text><text x="199" y="108" text-anchor="middle" font-size="15" fill="#172b3a" >Sex</text><text x="239" y="108" text-anchor="middle" font-size="15" fill="#172b3a" >Sáb</text><text x="279" y="108" text-anchor="middle" font-size="15" fill="#172b3a" >Dom</text><rect x="20" y="122" width="38" height="39" fill="white" stroke="#263d4d" data-dia="0" data-coluna="0" data-linha="0"/><circle cx="39" cy="142" r="15" fill="#dceacb" stroke="#263d4d" data-inspecao="0"/><text x="39" y="148" text-anchor="middle" font-size="18" fill="#172b3a" data-numero-dia