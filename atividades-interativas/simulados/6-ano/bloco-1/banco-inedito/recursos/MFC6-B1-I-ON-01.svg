<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 338" width="320" height="338" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-01-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-01-ONV1-descricao"><title id="MFC6-B1-I-ON-01-ONV1-titulo">Tarifa do armário</title><desc id="MFC6-B1-I-ON-01-ONV1-descricao">Quatro espaços de diária, um para cada dia de uso, com R$ 9 em cada. Uma faixa de pacote cobre os mesmos quatro dias por R$ 30 no total, sem cobrança diária adicional. O total do plano diário não está calculado.</desc><rect x="0" y="0" width="320" height="338" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" >Uso do serviço</text><text x="160" y="52" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="dias_de_uso" data-valor="4">4 dias</text><text x="160" y="85" text-anchor="middle" font-size="18" fill="#172b3a" >Plano diário</text><rect x="12" y="99" width="68" height="66" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="46" y="120" text-anchor="middle" font-size="15" fill="#172b3a" >Dia 1</text><text x="46" y="151" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="plano_diario_reais" data-valor="9">R$ 9</text><rect x="88" y="99" width="68" height="66" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="122" y="120" text-anchor="middle" font-size="15" fill="#172b3a" >Dia 2</text><text x="122" y="151" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="plano_diario_reais" data-valor="9">R$ 9</text><rect x="164" y="99" width="68" height="66" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="198" y="120" text-anchor="middle" font-size="15" fill="#172b3a" >Dia 3</text><text x="198" y="151" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="plano_diario_reais" data-valor="9">R$ 9</text><rect x="240" y="99" width="68" height="66" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="274" y="120" text-anchor="middle" font-size="15" fill="#172b3a" >Dia 4</text><text x="274" y="151" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="plano_diario_reais" data-valor="9">R$ 9</text><text x="160" y="202" text-anchor="middle" font-size="18" fill="#172b3a" >Pacote para os quatro dias</text><rect x="12" y="218" width="296" height="64" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="259" text-anchor="middle" font-size="26" fill="#172b3a" data-campo="plano_pacote_reais" data-valor="30">R$ 30 no total</text><text x="160" y="313" text-anchor="middle" font-size="16" fill="#172b3a" >Sem diária adicional no pacote</text></svg>
