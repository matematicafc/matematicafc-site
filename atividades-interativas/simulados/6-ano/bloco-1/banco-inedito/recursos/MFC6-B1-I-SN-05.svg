<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" width="320" height="290" role="img" aria-labelledby="MFC6-B1-I-SN-05-SNV1-titulo" aria-describedby="MFC6-B1-I-SN-05-SNV1-descricao" class="mfc-sn-svg" style="font-family:Arial,sans-serif"><title id="MFC6-B1-I-SN-05-SNV1-titulo">Maior número sem ultrapassar o teto</title><desc id="MFC6-B1-I-SN-05-SNV1-descricao">Quatro cartões com os algarismos 1, 2, 5 e 8. Abaixo há quatro espaços vazios nas posições M, C, D e U. Uma legenda indica milhar, centena, dezena e unidade. O limite é menor que 6.000.</desc><rect x="0" y="0" width="320" height="290" fill="white" data-fundo="true"/><text x="160" y="24" text-anchor="middle" font-size="18" fill="#172b3a" >Algarismos disponíveis</text><rect x="21" y="40" width="58" height="45" rx="3" fill="white" stroke="#263d4d" /><text x="50" y="71" text-anchor="middle" font-size="28" fill="#172b3a" data-algarismo="1">1</text><rect x="94" y="40" width="58" height="45" rx="3" fill="white" stroke="#263d4d" /><text x="123" y="71" text-anchor="middle" font-size="28" fill="#172b3a" data-algarismo="2">2</text><rect x="167" y="40" width="58" height="45" rx="3" fill="white" stroke="#263d4d" /><text x="196" y="71" text-anchor="middle" font-size="28" fill="#172b3a" data-algarismo="5">5</text><rect x="240" y="40" width="58" height="45" rx="3" fill="white" stroke="#263d4d" /><text x="269" y="71" text-anchor="middle" font-size="28" fill="#172b3a" data-algarismo="8">8</text><text x="160" y="119" text-anchor="middle" font-size="18" fill="#172b3a" data-teto="6000">Identificador menor que 6.000</text><text x="50" y="157" text-anchor="middle" font-size="18" fill="#172b3a" >M</text><rect x="21" y="166" width="58" height="43" rx="3" fill="white" stroke="#263d4d" /><text x="50" y="196" text-anchor="middle" font-size="25" fill="#172b3a" >□</text><text x="123" y="157" text-anchor="middle" font-size="18" fill="#172b3a" >C</text><rect x="94" y="166" width="58" height="43" rx="3" fill="white" stroke="#263d4d" /><text x="123" y="196" text-anchor="middle" font-size="25" fill="#172b3a" >□</text><text x="196" y="157" text-anchor="middle" font-size="18" fill="#172b3a" >D</text><rect x="167" y="166" width="58" height="43" rx="3" fill="white" stroke="#263d4d" /><text x="196" y="196" text-anchor="middle" font-size="25" fill="#172b3a" >□</text><text x="269" y="157" text-anchor="middle" font-size="18" fill="#172b3a" >U</text><rect x="240" y="166" width="58" height="43" rx="3" fill="white" stroke="#263d4d" /><text x="269" y="196" text-anchor="middle" font-size="25" fill="#172b3a" >□</text><text x="160" y="244" text-anchor="middle" font-size="16" fill="#172b3a" >M: milhar • C: centena</text><text x="160" y="269" text-anchor="middle" font-size="16" fill="#172b3a" >D: dezena • U: unidade</text></svg>
