<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 411" width="320" height="411" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-11-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-11-FRV1-descricao"><title id="MFC6-B1-I-FR-11-FRV1-titulo">Mesma fração, totais diferentes</title><desc id="MFC6-B1-I-FR-11-FRV1-descricao">Equipe A: 16 relatórios em quatro grupos iguais de quatro. Equipe B: 24 relatórios em quatro grupos iguais de seis. Cada relatório é uma unidade retangular sem preenchimento. As equipes concluíram 3/4 de seus respectivos totais, mas os grupos concluídos não estão destacados nem suas quantidades calculadas.</desc><rect x="0" y="0" width="320" height="411" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="fracao_concluida" data-valor="3/4">Cada equipe concluiu 3/4</text><text x="88" y="64" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="total_equipe_A" data-valor="16">Equipe A: 16</text><rect x="29" y="85" width="118" height="51" fill="#f8fafb" stroke="#263d4d" data-grupo-equipe="A" data-grupo="0"/><rect x="42" y="92" width="23" height="17" fill="white" stroke="#263d4d" data-equipe="A" data-relatorio="0"/><rect x="74" y="92" width="23" height="17" fill="white" stroke="#263d4d" data-equipe="A" data-relatorio="1"/><rect x="106" y="92" width="23" height="17" fill="white" stroke="#263d4d" data-equipe="A" data-relatorio="2"/><rect x="42" y="115" width="23" height="17" fill="white" stroke="#263d4d" data-equipe="A" data-relatorio="3"/><rect x="29" y="145" width="118" height="51" fill="#f8fafb" stroke="#263d4d" data-grupo-equipe="A" data-grupo="1"/><rect x="42" y="152" width="23" height="17" fill="white" stroke="#263d4d" data-equipe="A" data-relatorio="4"/><rect x="74" y="152" width="23" height="17" fill="white" stroke="#263d4d" data-equipe="A" data-relatorio="5"/><rect x="106" y="152" width="23" height="17" fill="white" stroke="#263d4d" data-equipe=