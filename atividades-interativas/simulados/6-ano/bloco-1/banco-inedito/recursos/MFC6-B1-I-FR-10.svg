<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 437" width="320" height="437" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-10-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-10-FRV1-descricao"><title id="MFC6-B1-I-FR-10-FRV1-titulo">Partes com tarefas sobrepostas</title><desc id="MFC6-B1-I-FR-10-FRV1-descricao">Painel retangular dividido em seis regiões iguais, em três linhas e duas colunas. As três regiões da coluna esquerda são azuis. As duas regiões da primeira linha têm textura de linhas diagonais. A região superior esquerda é azul e tem textura simultaneamente. A legenda informa azul 1/2, textura 1/3 e ambas 1/6. A união não recebe destaque adicional e sua fração não é apresentada.</desc><rect x="0" y="0" width="320" height="437" fill="white"/><defs><pattern id="MFC6-B1-I-FR-10-textura" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#263d4d" stroke-width="1.5"/></pattern></defs><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Painel de avisos</text><rect x="40" y="54" width="120" height="66" fill="#aac7dd" stroke="#263d4d" data-regiao="0" data-azul="true" data-textura="true"/><rect x="40" y="54" width="120" height="66" fill="url(#MFC6-B1-I-FR-10-textura)" stroke="#263d4d" data-sobre-textura="0"/><rect x="160" y="54" width="120" height="66" fill="white" stroke="#263d4d" data-regiao="1" data-azul="false" data-textura="true"/><rect x="160" y="54" width="120" height="66" fill="url(#MFC6-B1-I-FR-10-textura)" stroke="#263d4d" data-sobre-textura="1"/><rect x="40" y="120" width="120" height="66" fill="#aac7dd" stroke="#263d4d" data-regiao="2" data-azul="true" data-textura="false"/><rect x="160" y="120" width="120" height="66" fill="white" stroke="#263d4d" data-regiao="3" data-azul="false" data-textura="false"/><rect x="40" y="186" width="120" height="66" fill="#aac7dd" stroke="#263d4d" data-regiao="4" data-azul="true" data-textura="false"/><rect x="160" y="186" width="120" height="66" fill="white" stroke="#263d4d" data-regiao="5" data-azul="false" data-textura="false"/><rect x="25" y="277" width="28" height="22" fill="#aac7dd" stroke="#263d4d" /><text x="183" y="295" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="azul" data-valor="1/2">Azul: 1/2</text><rect x="25" y="313" width="28" height="22" fill="url(#MFC6-B1-I-FR-10-textura)" stroke="#263d4d" /><text x="183" y="331" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="textura" data-valor="1/3">Textura: 1/3</text><rect x="25" y="349" width="28" height="22" fill="#aac7dd" stroke="#263d4d" /><rect x="25" y="349" width="28" height="22" fill="url(#MFC6-B1-I-FR-10-textura)" stroke="#263d4d" /><text x="183" y="367" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="ambos" data-valor="1/6">As duas: 1/6</text><text x="160" y="411" text-anchor="middle" font-size="17" fill="#172b3a" >Regiões de mesma área</text></svg>
