<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-04-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-04-ONV1-descricao"><title id="MFC6-B1-I-ON-04-ONV1-titulo">Contagem sem repetir participantes</title><desc id="MFC6-B1-I-ON-04-ONV1-descricao">Dois círculos parcialmente sobrepostos representam os clubes. Leitura tem 18 integrantes ao todo e Xadrez, 14 ao todo; esses totais incluem os cinco participantes da região comum. As quantidades exclusivas não estão calculadas.</desc><rect x="0" y="0" width="320" height="260" fill="white"/><text x="83" y="25" text-anchor="middle" font-size="19" fill="#172b3a" >Leitura</text><text x="83" y="49" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="clube_leitura" data-valor="18">18 ao todo</text><text x="237" y="25" text-anchor="middle" font-size="19" fill="#172b3a" >Xadrez</text><text x="237" y="49" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="clube_xadrez" data-valor="14">14 ao todo</text><circle cx="110" cy="135" r="70" fill="#edf4f8" fill-opacity="0.65" stroke="#263d4d"/><circle cx="210" cy="135" r="70" fill="#fff3df" fill-opacity="0.65" stroke="#263d4d"/><text x="160" y="139" text-anchor="middle" font-size="26" fill="#172b3a" data-campo="participam_dos_dois" data-valor="5">5</text><text x="160" y="162" text-anchor="middle" font-size="14" fill="#172b3a" >Nos dois</text><text x="160" y="239" text-anchor="middle" font-size="16" fill="#172b3a" >Os totais já incluem a parte comum</text></svg>
