<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 335" width="320" height="335" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-02-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-02-NDV1-descricao"><title id="MFC6-B1-I-ND-02-NDV1-titulo">Conexão entre duas medidas</title><desc id="MFC6-B1-I-ND-02-NDV1-descricao">Duas barras alinhadas à esquerda representam as larguras A de 0,82 m e B de 0,85 m, na mesma escala de 280 pixels por metro. A largura de B é maior, mas a diferença não é escrita. A tolerância máxima de 0,03 m está indicada separadamente.</desc><rect x="0" y="0" width="320" height="335" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" >Larguras na mesma escala</text><text x="160" y="58" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="largura_A_m" data-valor="0.82">Caixa A: 0,82 m</text><rect x="20" y="73" width="229.6" height="34" fill="#edf4f8" stroke="#263d4d" data-largura="A"/><text x="160" y="144" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="largura_B_m" data-valor="0.85">Caixa B: 0,85 m</text><rect x="20" y="159" width="238.0" height="34" fill="#edf4f8" stroke="#263d4d" data-largura="B"/><path d="M20 71V220" stroke="#263d4d" stroke-dasharray="4 3"/><text x="160" y="249" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="tolerancia_m" data-valor="0.03">Diferença máxima: 0,03 m</text><text x="160" y="282" text-anchor="middle" font-size="16" fill="#172b3a" >Os extremos direitos são diferentes</text><text x="160" y="308" text-anchor="middle" font-size="17" fill="#172b3a" >Conferir a diferença e o limite</text></svg>
