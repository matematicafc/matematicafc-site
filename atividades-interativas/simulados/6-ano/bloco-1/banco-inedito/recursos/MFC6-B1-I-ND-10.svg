<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 245" width="320" height="245" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-10-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-10-NDV1-descricao"><title id="MFC6-B1-I-ND-10-NDV1-titulo">Passos de uma peça de precisão</title><desc id="MFC6-B1-I-ND-10-NDV1-descricao">Reta decimal com marcas em 1,05, 1,10, 1,15 e 1,20 cm, igualmente espaçadas, com passo de 0,05 cm. Uma seta indica o pedido de 1,13 cm entre 1,10 e 1,15, a três quintos do intervalo. Rótulos de 18 pixels têm margem nas extremidades. Nenhuma marca permitida está selecionada como resposta.</desc><rect x="0" y="0" width="320" height="245" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="passo_cm" data-valor="0.05">Passo das marcas: 0,05 cm</text><text x="160" y="58" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="medida_pedida_cm" data-valor="1.13">Pedido: 1,13 cm</text><path d="M30 136H285" stroke="#263d4d" stroke-width="2"/><path d="M30 127V145" stroke="#263d4d" data-marca="1.05" data-x="30"/><text x="30" y="178" text-anchor="middle" font-size="18" fill="#172b3a" data-rotulo-marca="1.05">1,05</text><path d="M115 127V145" stroke="#263d4d" data-marca="1.10" data-x="115"/><text x="115" y="178" text-anchor="middle" font-size="18" fill="#172b3a" data-rotulo-marca="1.10">1,10</text><path d="M200 127V145" stroke="#263d4d" data-marca="1.15" data-x="200"/><text x="200" y="178" text-anchor="middle" font-size="18" fill="#172b3a" data-rotulo-marca="1.15">1,15</text><path d="M285 127V145" stroke="#263d4d" data-marca="1.20" data-x="285"/><text x="285" y="178" text-anchor="middle" font-size="18" fill="#172b3a" data-rotulo-marca="1.20">1,20</text><path d="M166.0 81V116M161.0 110L166.0 116L171.0 110" stroke="#8a2d20" fill="none" stroke-width="2" data-pedido="1.13" data-x="166.0"/><text x="160" y="217" text-anchor="middle" font-size="15" fill="#172b3a" >Marcas permitidas igualmente espaçadas</text></svg>
