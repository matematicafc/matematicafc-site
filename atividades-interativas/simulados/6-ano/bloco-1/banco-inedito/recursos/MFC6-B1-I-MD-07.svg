<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 323" width="320" height="323" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-07-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-07-MDV1-descricao"><title id="MFC6-B1-I-MD-07-MDV1-titulo">Sinal que começou depois</title><desc id="MFC6-B1-I-MD-07-MDV1-descricao">Duas linhas do tempo com a mesma escala de zero a 24 minutos. A aparece nos minutos 0, 6, 12, 18 e 24; B aparece nos minutos 3, 12 e 21. São indicados os inícios zero e três e os intervalos seis e nove. Nenhum encontro está nomeado ou destacado.</desc><rect x="0" y="0" width="320" height="323" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="20" fill="#172b3a" >Instantes de aparição</text><text x="160" y="52" text-anchor="middle" font-size="17" fill="#172b3a" >Tempo em minutos</text><text x="160" y="86" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="inicio_A" data-valor="0">Sinal A: início no minuto 0</text><text x="160" y="111" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="intervalo_A" data-valor="6">Repete a cada 6 min</text><path d="M20 127H300" stroke="#263d4d" stroke-width="2"/><path d="M20.0 124V130" stroke="#263d4d"/><path d="M55.0 124V130" stroke="#263d4d"/><path d="M90.0 124V130" stroke="#263d4d"/><path d="M125.0 124V130" stroke="#263d4d"/><path d="M160.0 124V130" stroke="#263d4d"/><path d="M195.0 124V130" stroke="#263d4d"/><path d="M230.0 124V130" stroke="#263d4d"/><path d="M265.0 124V130" stroke="#263d4d"/><path d="M300.0 124V130" stroke="#263d4d"/><circle cx="20.0" cy="127" r="6" fill="#edf4f8" stroke="#263d4d" data-sinal="A" data-minuto="0" data-x="20.0"/><text x="20.0" y="155" text-anchor="middle" font-size="16" fill="#172b3a" >0</text><circle cx="90.0" cy="127" r="6" fill="#edf4f8" stroke="#263d4d" data-sinal="A" data-minuto="6" data-x="90.0"/><text x="90.0" y="155" text-anchor="middle" font-size="16" fill="#172b3a" >6</text><circle cx="160.0" cy="127" r="6" fill="#edf4f8" stroke="#263d4d" data-sinal="A" data-minuto="12" data-x="160.0"/><text x="160.0" y="155" text-anchor="middle" font-size="16" fill="#172b3a" >12</text><circle cx="230.0" cy="127" r="6" fill="#edf4f8" stroke="#263d4d" data-sinal="A" data-minuto="18" data-x="230.0"/><text x="230.0" y="155" text-anchor="middle" font-size="16" fill="#172b3a" >18</text><circle cx="300.0" cy="127" r="6" fill="#edf4f8" stroke="#263d4d" data-sinal="A" data-minuto="24" data-x="300.0"/><text x="300.0" y="155" text-anchor="middle" font-size="16" fill="#172b3a" >24</text><text x="160" y="203" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="inicio_B" data-valor="3">Sinal B: início no minuto 3</text><text x="160" y="228" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="intervalo_B" data-valor="9">Repete a cada 9 min</text><path d="M20 244H300" stroke="#263d4d" stroke-width="2"/><path d="M20.0 241V247" stroke="#263d4d"/><path d="M55.0 241V247" stroke="#263d4d"/><path d="M90.0 241V247" stroke="#263d4d"/><path d="M125.0 241V247" stroke="#263d4d"/><path d="M160.0 241V247" stroke="#263d4d"/><path d="M195.0 241V247" stroke="#263d4d"/><path d="M230.0 241V247" stroke="#263d4d"/><path d="M265.0 241V247" stroke="#263d4d"/><path d="M300.0 241V247" stroke="#263d4d"/><circle cx="55.0" cy="244" r="6" fill="#edf4f8" stroke="#263d4d" data-sinal="B" data-minuto="3" data-x="55.0"/><text x="55.0" y="272" text-anchor="middle" font-size="16" fill="#172b3a" >3</text><circle cx="160.0" cy="244" r="6" fill="#edf4f8" stroke="#263d4d" data-sinal="B" data-minuto="12" data-x="160.0"/><text x="160.0" y="272" text-anchor="middle" font-size="16" fill="#172b3a" >12</text><circle cx="265.0" cy="244" r="6" fill="#edf4f8" stroke="#263d4d" data-sinal="B" data-minuto="21" data-x="265.0"/><text x="265.0" y="272" text-anchor="middle" font-size="16" fill="#172b3a" >21</text><text x="160" y="299" text-anchor="middle" font-size="17" fill="#172b3a" >Mesma escala nas duas linhas</text></svg>
