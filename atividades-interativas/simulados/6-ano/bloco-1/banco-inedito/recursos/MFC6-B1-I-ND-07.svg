<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 378" width="320" height="378" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-07-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-07-NDV1-descricao"><title id="MFC6-B1-I-ND-07-NDV1-titulo">A prateleira e a folga</title><desc id="MFC6-B1-I-ND-07-NDV1-descricao">Prateleira de 0,85 m e três caixas lado a lado de 0,24 m, 0,315 m e 0,28 m, todas na escala de 320 pixels por metro e com origem comum à esquerda. As caixas ficam contíguas, sem intervalos desenhados entre elas. Linhas projetam o extremo do conjunto e o da prateleira. A folga mínima é 0,01 m; a folga real aparece como interrogação.</desc><rect x="0" y="0" width="320" height="378" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="prateleira_m" data-valor="0.85">Prateleira: 0,85 m</text><rect x="24" y="51" width="272.0" height="38" fill="#f8fafb" stroke="#263d4d" data-prateleira="sim"/><text x="160" y="127" text-anchor="middle" font-size="20" fill="#172b3a" >Caixas lado a lado</text><rect x="24" y="149" width="76.8" height="63" fill="#edf4f8" stroke="#263d4d" data-caixa="0"/><text x="62.4" y="187" text-anchor="middle" font-size="16" fill="#172b3a" data-campo="larguras_m.0" data-valor="0.24">0,24 m</text><rect x="100.8" y="149" width="100.8" height="63" fill="#edf4f8" stroke="#263d4d" data-caixa="1"/><text x="151.2" y="187" text-anchor="middle" font-size="16" fill="#172b3a" data-campo="larguras_m.1" data-valor="0.315">0,315 m</text><rect x="201.6" y="149" width="89.6" height="63" fill="#edf4f8" stroke="#263d4d" data-caixa="2"/><text x="246.39999999999998" y="187" text-anchor="middle" font-size="16" fill="#172b3a" data-campo="larguras_m.2" data-valor="0.28">0,28 m</text><path d="M291.2 212V247M296 89V247" stroke="#263d4d" stroke-dasharray="4 3"/><text x="160" y="271" text-anchor="middle" font-size="20" fill="#172b3a" >Folga total: ? m</text><text x="160" y="312" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="folga_minima_m" data-valor="0.01">Folga mínima: 0,01 m</text><text x="160" y="351" text-anchor="middle" font-size="17" fill="#172b3a" >Mesma escala de comprimento</text></svg>
