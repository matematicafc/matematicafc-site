<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340" role="img" aria-labelledby="MFC6-B1-I-SN-12-SNV1-titulo" aria-describedby="MFC6-B1-I-SN-12-SNV1-descricao" class="mfc-sn-svg" style="font-family:Arial,sans-serif"><title id="MFC6-B1-I-SN-12-SNV1-titulo">Identificadores com regra dupla</title><desc id="MFC6-B1-I-SN-12-SNV1-descricao">Quatro quadros de ordens, para 3.524, 3.452, 4.325 e 3.552, alinhando M, C, D e U. As colunas C e D têm o mesmo destaque para comparar seus algarismos. O intervalo permitido, sem os extremos, é de 3.300 a 3.600. Nenhuma linha está indicada como correta.</desc><rect x="0" y="0" width="320" height="340" fill="white" data-fundo="true"/><text x="160" y="23" text-anchor="middle" font-size="15" fill="#172b3a" >Entre 3.300 e 3.600, sem os extremos</text><text x="41" y="53" text-anchor="middle" font-size="14" fill="#172b3a" >Número</text><text x="112" y="53" text-anchor="middle" font-size="20" fill="#172b3a" >M</text><text x="166" y="53" text-anchor="middle" font-size="20" fill="#172b3a" >C</text><text x="220" y="53" text-anchor="middle" font-size="20" fill="#172b3a" >D</text><text x="274" y="53" text-anchor="middle" font-size="20" fill="#172b3a" >U</text><text x="41" y="96" text-anchor="middle" font-size="16" fill="#172b3a" data-identificador="3524">3.524</text><rect x="88" y="68" width="48" height="39" rx="3" fill="white" stroke="#263d4d" /><text x="112" y="96" text-anchor="middle" font-size="24" fill="#172b3a" data-numero="3524" data-posicao="M">3</text><rect x="142" y="68" width="48" height="39" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="166" y="96" text-anchor="middle" font-size="24" fill="#172b3a" data-numero="3524" data-posicao="C">5</text><rect x="196" y="68" width="48" height="39" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="220" y="96" text-anchor="middle" font-size="24" fill="#172b3a" data-numero="3524" data-posicao="D">2</text><rect x="250" y="68" width="48" height="39" rx="3" fill="whi