<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 378" width="320" height="378" class="mfc-md-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-MD-03-MDV1-titulo" aria-describedby="MFC6-B1-I-MD-03-MDV1-descricao"><title id="MFC6-B1-I-MD-03-MDV1-titulo">Mesmo total, pacotes diferentes</title><desc id="MFC6-B1-I-MD-03-MDV1-descricao">Um pacote tem seis objetos em duas linhas de três. Sete espaços numerados representam o limite de pacotes por professor. Abaixo, Lia tem 26 objetos, Rui 34, Nara 42 e Ivo 48 para devolver. Não estão calculados os pacotes de cada professor.</desc><rect x="0" y="0" width="320" height="378" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="tamanho_pacote" data-valor="6">Cada pacote: 6 objetos</text><rect x="88" y="42" width="144" height="66" fill="#f8fafb" stroke="#263d4d" /><circle cx="115" cy="61" r="8" fill="#edf4f8" stroke="#263d4d" data-objeto-pacote="0"/><circle cx="160" cy="61" r="8" fill="#edf4f8" stroke="#263d4d" data-objeto-pacote="1"/><circle cx="205" cy="61" r="8" fill="#edf4f8" stroke="#263d4d" data-objeto-pacote="2"/><circle cx="115" cy="89" r="8" fill="#edf4f8" stroke="#263d4d" data-objeto-pacote="3"/><circle cx="160" cy="89" r="8" fill="#edf4f8" stroke="#263d4d" data-objeto-pacote="4"/><circle cx="205" cy="89" r="8" fill="#edf4f8" stroke="#263d4d" data-objeto-pacote="5"/><text x="160" y="139" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="maximo_pacotes" data-valor="7">Limite por professor: 7 pacotes</text><rect x="23" y="155" width="34" height="41" fill="#edf4f8" stroke="#263d4d" data-vaga-pacote="0"/><text x="40" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >1</text><rect x="63" y="155" width="34" height="41" fill="#edf4f8" stroke="#263d4d" data-vaga-pacote="1"/><text x="80" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >2</text><rect x="103" y="155" width="34" height="41" fill="#edf4f8" stroke="#263d4d" data-vaga-pacote="2"/><text x="120" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >3</text><rect x="143" y="155" width="34" height="41" fill="#edf4f8" stroke="#263d4d" data-vaga-pacote="3"/><text x="160" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >4</text><rect x="183" y="155" width="34" height="41" fill="#edf4f8" stroke="#263d4d" data-vaga-pacote="4"/><text x="200" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >5</text><rect x="223" y="155" width="34" height="41" fill="#edf4f8" stroke="#263d4d" data-vaga-pacote="5"/><text x="240" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >6</text><rect x="263" y="155" width="34" height="41" fill="#edf4f8" stroke="#263d4d" data-vaga-pacote="6"/><text x="280" y="181" text-anchor="middle" font-size="16" fill="#172b3a" >7</text><text x="160" y="228" text-anchor="middle" font-size="19" fill="#172b3a" >Objetos para devolver</text><text x="160" y="260" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="professores.0.1" data-valor="26">Lia: 26 objetos</text><text x="160" y="289" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="professores.1.1" data-valor="34">Rui: 34 objetos</text><text x="160" y="318" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="professores.2.1" data-valor="42">Nara: 42 objetos</text><text x="160" y="347" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="professores.3.1" data-valor="48">Ivo: 48 objetos</text></svg>
