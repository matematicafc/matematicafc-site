<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 349" width="320" height="349" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-05-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-05-NDV1-descricao"><title id="MFC6-B1-I-ND-05-NDV1-titulo">Escala que arredonda ao décimo</title><desc id="MFC6-B1-I-ND-05-NDV1-descricao">Visor mostrando 23,4 °C. Uma escala neutra de 23,30 a 23,50 tem marcas uniformes a cada 0,01 e rótulos em 23,30, 23,35, 23,40, 23,45 e 23,50. A regra informa arredondamento ao décimo mais próximo, subindo quando o centésimo é cinco ou maior. Não há faixa de aceitação destacada nem pontos das alternativas posicionados.</desc><rect x="0" y="0" width="320" height="349" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Visor do termômetro</text><rect x="46" y="44" width="228" height="70" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="91" text-anchor="middle" font-size="34" fill="#172b3a" data-campo="temperatura_mostrada" data-valor="23.4">23,4 °C</text><text x="160" y="149" text-anchor="middle" font-size="17" fill="#172b3a" >Escala de leituras em centésimos</text><path d="M25 208H295" stroke="#263d4d" stroke-width="2"/><path d="M25.0 198V218" stroke="#263d4d" data-marca="233/10" data-x="25.0"/><text x="25.0" y="246" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="233/10">23,30</text><path d="M38.5 203V213" stroke="#263d4d" data-marca="2331/100" data-x="38.5"/><path d="M52.0 203V213" stroke="#263d4d" data-marca="583/25" data-x="52.0"/><path d="M65.5 203V213" stroke="#263d4d" data-marca="2333/100" data-x="65.5"/><path d="M79.0 203V213" stroke="#263d4d" data-marca="1167/50" data-x="79.0"/><path d="M92.5 198V218" stroke="#263d4d" data-marca="467/20" data-x="92.5"/><text x="92.5" y="246" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="467/20">23,35</text><path d="M106.0 203V213" stroke="#263d4d" data-marca="584/25" data-x="106.0"/><path d="M119.5 203V213" stroke="#263d4d" data-marca="2337/100" data-x="119.5"/><path d="M133.0 203V213" stroke="#263d4d" data-marca="1169/50" data-x="133.0"/><path d="M146.5 203V213" stroke="#263d4d" data-marca="2339/100" data-x="146.5"/><path d="M160.0 198V218" stroke="#263d4d" data-marca="117/5" data-x="160.0"/><text x="160.0" y="246" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="117/5">23,40</text><path d="M173.5 203V213" stroke="#263d4d" data-marca="2341/100" data-x="173.5"/><path d="M187.0 203V213" stroke="#263d4d" data-marca="1171/50" data-x="187.0"/><path d="M200.5 203V213" stroke="#263d4d" data-marca="2343/100" data-x="200.5"/><path d="M214.0 203V213" stroke="#263d4d" data-marca="586/25" data-x="214.0"/><path d="M227.5 198V218" stroke="#263d4d" data-marca="469/20" data-x="227.5"/><text x="227.5" y="246" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="469/20">23,45</text><path d="M241.0 203V213" stroke="#263d4d" data-marca="1173/50" data-x="241.0"/><path d="M254.5 203V213" stroke="#263d4d" data-marca="2347/100" data-x="254.5"/><path d="M268.0 203V213" stroke="#263d4d" data-marca="587/25" data-x="268.0"/><path d="M281.5 203V213" stroke="#263d4d" data-marca="2349/100" data-x="281.5"/><path d="M295.0 198V218" stroke="#263d4d" data-marca="47/2" data-x="295.0"/><text x="295.0" y="246" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="47/2">23,50</text><text x="160" y="292" text-anchor="middle" font-size="16" fill="#172b3a" >Arredondar ao décimo mais próximo</text><text x="160" y="322" text-anchor="middle" font-size="16" fill="#172b3a" >Centésimo 5 ou maior: subir o décimo</text></svg>
