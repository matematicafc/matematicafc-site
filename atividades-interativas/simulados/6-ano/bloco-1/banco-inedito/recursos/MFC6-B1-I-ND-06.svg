<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 364" width="320" height="364" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-06-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-06-NDV1-descricao"><title id="MFC6-B1-I-ND-06-NDV1-titulo">Custo por distância com taxa fixa</title><desc id="MFC6-B1-I-ND-06-NDV1-descricao">Um bloco de taxa fixa mostra R$ 4,50, cobrado uma única vez. Um sinal de adição o separa da cobrança de R$ 1,20 por quilômetro. O percurso de 2,5 km aparece dividido em dois trechos de 1 km e um de meio quilômetro; o último tem metade da largura dos demais. Nenhum custo variável ou total está calculado.</desc><rect x="0" y="0" width="320" height="364" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Duas partes da cobrança</text><rect x="30" y="44" width="260" height="80" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="69" text-anchor="middle" font-size="18" fill="#172b3a" >Taxa fixa, uma única vez</text><text x="160" y="107" text-anchor="middle" font-size="28" fill="#172b3a" data-campo="taxa_fixa_reais" data-valor="4.50">R$ 4,50</text><text x="160" y="159" text-anchor="middle" font-size="30" fill="#172b3a" >+</text><text x="160" y="196" text-anchor="middle" font-size="22" fill="#172b3a" data-campo="preco_por_km_reais" data-valor="1.20">R$ 1,20 por km</text><text x="160" y="231" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="distancia_km" data-valor="2.5">Percurso: 2,5 km</text><rect x="60" y="253" width="80" height="42" fill="#f8fafb" stroke="#263d4d" data-trecho="0"/><text x="100.0" y="280" text-anchor="middle" font-size="15" fill="#172b3a" >1 km</text><rect x="140" y="253" width="80" height="42" fill="#f8fafb" stroke="#263d4d" data-trecho="1"/><text x="180.0" y="280" text-anchor="middle" font-size="15" fill="#172b3a" >1 km</text><rect x="220" y="253" width="40" height="42" fill="#f8fafb" stroke="#263d4d" data-trecho="2"/><text x="240.0" y="280" text-anchor="middle" font-size="15" fill="#172b3a" >½ km</text><text x="160" y="338" text-anchor="middle" font-size="16" fill="#172b3a" >Calcular o percurso e somar a taxa</text></svg>
