<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-10-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-10-ONV1-descricao"><title id="MFC6-B1-I-ON-10-ONV1-titulo">Caminho com uma ponte fechada</title><desc id="MFC6-B1-I-ON-10-ONV1-descricao">As rotas ligam a mesma origem ao mesmo destino. Na rota A, os trechos externos têm 120 m e 150 m; a ponte de 80 m aparece tracejada e riscada. Um desvio de 170 m liga os mesmos extremos da ponte. A rota B tem trechos de 190 m e 210 m. O esquema não está em escala.</desc><rect x="0" y="0" width="320" height="380" fill="white"/><text x="160" y="24" text-anchor="middle" font-size="20" fill="#172b3a" >Rota A: ponte fechada</text><path d="M20 180L90 120" stroke="#263d4d" stroke-width="2" fill="none"/><path d="M90 120H230" stroke="#263d4d" stroke-width="2" stroke-dasharray="5 4" data-ponte="fechada"/><path d="M230 120L300 180" stroke="#263d4d" stroke-width="2" fill="none"/><path d="M90 120V65H230V120" stroke="#263d4d" stroke-width="2" fill="none" data-rota="desvio"/><path d="M151 111L169 129M169 111L151 129" stroke="#8a2d20" stroke-width="3"/><text x="48" y="136" text-anchor="middle" font-size="16" fill="#172b3a" data-campo="rota_A_trechos.0" data-valor="120">120 m</text><text x="272" y="136" text-anchor="middle" font-size="16" fill="#172b3a" data-campo="rota_A_trechos.2" data-valor="150">150 m</text><text x="160" y="158" text-anchor="middle" font-size="15" fill="#172b3a" data-campo="trecho_A_substituido" data-valor="80">80 m: ponte fechada</text><text x="160" y="50" text-anchor="middle" font-size="16" fill="#172b3a" data-campo="desvio_no_lugar_da_ponte" data-valor="170">Desvio: 170 m</text><path d="M20 180L160 273L300 180" stroke="#263d4d" stroke-width="2" fill="none"/><text x="85" y="244" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="rota_B_trechos.0" data-valor="190">190 m</text><text x="239" y="244" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="rota_B_trechos.1" data-valor="210">210 m</text><text x="160" y="300" text-anchor="middle" font-size="18" fill="#172b3a" >Rota B</text><text x="5" y="207" text-anchor="start" font-size="15" fill="#172b3a" >Origem</text><text x="315" y="207" text-anchor="end" font-size="15" fill="#172b3a" >Destino</text><circle cx="20" cy="180" r="4" fill="#263d4d"/><circle cx="300" cy="180" r="4" fill="#263d4d"/><text x="160" y="332" text-anchor="middle" font-size="16" fill="#172b3a" >Distâncias em metros</text><text x="160" y="355" text-anchor="middle" font-size="16" fill="#172b3a" >Esquema sem escala</text></svg>
