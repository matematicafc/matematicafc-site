<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-02-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-02-ONV1-descricao"><title id="MFC6-B1-I-ON-02-ONV1-titulo">Pontos com penalidade</title><desc id="MFC6-B1-I-ON-02-ONV1-descricao">Sete círculos de acerto mostram +5 cada um. Abaixo, três círculos de tentativa inválida mostram -2 cada um. Os sinais e os títulos distinguem ganhos e perdas; o saldo não está escrito.</desc><rect x="0" y="0" width="320" height="280" fill="white"/><text x="160" y="26" text-anchor="middle" font-size="19" fill="#172b3a" >Acertos: ganham pontos</text><circle cx="42" cy="65" r="26" fill="#edf4f8" stroke="#263d4d" data-evento="acerto" data-pontos="5"/><text x="42" y="72" text-anchor="middle" font-size="23" fill="#172b3a" >+5</text><circle cx="119" cy="65" r="26" fill="#edf4f8" stroke="#263d4d" data-evento="acerto" data-pontos="5"/><text x="119" y="72" text-anchor="middle" font-size="23" fill="#172b3a" >+5</text><circle cx="196" cy="65" r="26" fill="#edf4f8" stroke="#263d4d" data-evento="acerto" data-pontos="5"/><text x="196" y="72" text-anchor="middle" font-size="23" fill="#172b3a" >+5</text><circle cx="273" cy="65" r="26" fill="#edf4f8" stroke="#263d4d" data-evento="acerto" data-pontos="5"/><text x="273" y="72" text-anchor="middle" font-size="23" fill="#172b3a" >+5</text><circle cx="42" cy="125" r="26" fill="#edf4f8" stroke="#263d4d" data-evento="acerto" data-pontos="5"/><text x="42" y="132" text-anchor="middle" font-size="23" fill="#172b3a" >+5</text><circle cx="119" cy="125" r="26" fill="#edf4f8" stroke="#263d4d" data-evento="acerto" data-pontos="5"/><text x="119" y="132" text-anchor="middle" font-size="23" fill="#172b3a" >+5</text><circle cx="196" cy="125" r="26" fill="#edf4f8" stroke="#263d4d" data-evento="acerto" data-pontos="5"/><text x="196" y="132" text-anchor="middle" font-size="23" fill="#172b3a" >+5</text><text x="160" y="190" text-anchor="middle" font-size="19" fill="#172b3a" >Inválidas: retiram pontos</text><circle cx="75" cy="231" r="27" fill="#fff3df" stroke="#263d4d" data-evento="invalida" data-pontos="2"/><text x="75" y="239" text-anchor="middle" font-size="23" fill="#172b3a" >-2</text><circle cx="160" cy="231" r="27" fill="#fff3df" stroke="#263d4d" data-evento="invalida" data-pontos="2"/><text x="160" y="239" text-anchor="middle" font-size="23" fill="#172b3a" >-2</text><circle cx="245" cy="231" r="27" fill="#fff3df" stroke="#263d4d" data-evento="invalida" data-pontos="2"/><text x="245" y="239" text-anchor="middle" font-size="23" fill="#172b3a" >-2</text></svg>
