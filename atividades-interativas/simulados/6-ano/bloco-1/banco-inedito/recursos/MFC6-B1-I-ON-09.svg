<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 328" width="320" height="328" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-09-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-09-ONV1-descricao"><title id="MFC6-B1-I-ON-09-ONV1-titulo">Pacotes inteiros pelo menor custo</title><desc id="MFC6-B1-I-ON-09-ONV1-descricao">Necessidade de 35 adesivos. Um pacote P tem oito adesivos, desenhados em duas linhas de quatro, e custa R$ 10. Um pacote Q tem doze adesivos, em três linhas de quatro, e custa R$ 14. Não são mostradas quantidades de pacotes a comprar.</desc><rect x="0" y="0" width="320" height="328" fill="white"/><text x="160" y="26" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="adesivos_necessarios" data-valor="35">Necessidade: 35 adesivos</text><text x="85" y="67" text-anchor="middle" font-size="20" fill="#172b3a" >Pacote P</text><rect x="37" y="88" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="P" data-adesivo="0"/><rect x="61" y="88" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="P" data-adesivo="1"/><rect x="85" y="88" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="P" data-adesivo="2"/><rect x="109" y="88" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="P" data-adesivo="3"/><rect x="37" y="112" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="P" data-adesivo="4"/><rect x="61" y="112" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="P" data-adesivo="5"/><rect x="85" y="112" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="P" data-adesivo="6"/><rect x="109" y="112" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="P" data-adesivo="7"/><text x="85" y="193" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="pacote_P_unidades" data-valor="8">8 adesivos</text><text x="85" y="227" text-anchor="middle" font-size="25" fill="#172b3a" data-campo="pacote_P_reais" data-valor="10">R$ 10</text><text x="235" y="67" text-anchor="middle" font-size="20" fill="#172b3a" >Pacote Q</text><rect x="187" y="88" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="0"/><rect x="211" y="88" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="1"/><rect x="235" y="88" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="2"/><rect x="259" y="88" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="3"/><rect x="187" y="112" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="4"/><rect x="211" y="112" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="5"/><rect x="235" y="112" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="6"/><rect x="259" y="112" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="7"/><rect x="187" y="136" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="8"/><rect x="211" y="136" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="9"/><rect x="235" y="136" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="10"/><rect x="259" y="136" width="23" height="23" rx="3" fill="#edf4f8" stroke="#263d4d" data-pacote="Q" data-adesivo="11"/><text x="235" y="193" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="pacote_Q_unidades" data-valor="12">12 adesivos</text><text x="235" y="227" text-anchor="middle" font-size="25" fill="#172b3a" data-campo="pacote_Q_reais" data-valor="14">R$ 14</text><text x="160" y="278" text-anchor="middle" font-size="17" fill="#172b3a" >Compra só em pacotes inteiros</text><text x="160" y="306" text-anchor="middle" font-size="17" fill="#172b3a" >Escolher um único tamanho</text></svg>
