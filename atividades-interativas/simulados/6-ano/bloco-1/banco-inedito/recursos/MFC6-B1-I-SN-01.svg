<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="320" height="230" role="img" aria-labelledby="MFC6-B1-I-SN-01-SNV1-titulo" aria-describedby="MFC6-B1-I-SN-01-SNV1-descricao" class="mfc-sn-svg" style="font-family:Arial,sans-serif"><title id="MFC6-B1-I-SN-01-SNV1-titulo">O arredondamento do painel</title><desc id="MFC6-B1-I-SN-01-SNV1-descricao">Painel com 4.200 sementes. A escala abaixo tem marcas igualmente espaçadas em 4.000, 4.100, 4.200, 4.300 e 4.400; apenas 4.000, 4.200 e 4.400 estão escritos. A escala indica o passo de uma centena.</desc><rect x="0" y="0" width="320" height="230" fill="white" data-fundo="true"/><text x="160" y="24" text-anchor="middle" font-size="18" fill="#172b3a" >Contagem aproximada de sementes</text><rect x="80" y="40" width="160" height="52" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="76" text-anchor="middle" font-size="30" fill="#172b3a" data-leitura="4200">4.200</text><path d="M35 140H285" stroke="#172b3a" stroke-width="2"/><path d="M35.0 134V146" stroke="#172b3a" data-eixo="centenas" data-marca="4000" data-x="35.0"/><text x="35.0" y="172" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="centenas" data-valor="4000">4.000</text><path d="M97.5 134V146" stroke="#172b3a" data-eixo="centenas" data-marca="4100" data-x="97.5"/><path d="M160.0 134V146" stroke="#172b3a" data-eixo="centenas" data-marca="4200" data-x="160.0"/><text x="160.0" y="172" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="centenas" data-valor="4200">4.200</text><path d="M222.5 134V146" stroke="#172b3a" data-eixo="centenas" data-marca="4300" data-x="222.5"/><path d="M285.0 134V146" stroke="#172b3a" data-eixo="centenas" data-marca="4400" data-x="285.0"/><text x="285.0" y="172" text-anchor="middle" font-size="17" fill="#172b3a" data-rotulo-eixo="centenas" data-valor="4400">4.400</text><text x="160" y="210" text-anchor="middle" font-size="16" fill="#172b3a" >Marcas igualmente espaçadas</text></svg>
