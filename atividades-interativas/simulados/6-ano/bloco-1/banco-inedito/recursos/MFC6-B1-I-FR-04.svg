<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 292" width="320" height="292" class="mfc-fr-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-FR-04-FRV1-titulo" aria-describedby="MFC6-B1-I-FR-04-FRV1-descricao"><title id="MFC6-B1-I-FR-04-FRV1-titulo">O corte de oitavos mais próximo do pedido</title><desc id="MFC6-B1-I-FR-04-FRV1-descricao">Reta fracionária de zero a um, com nove marcas igualmente espaçadas: zero, 1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8 e um. Uma seta marca 3/10 na posição exata, entre 2/8 e 3/8. Nenhuma marca é destacada como escolha correta e as diferenças não estão calculadas.</desc><rect x="0" y="0" width="320" height="292" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="partes_iguais" data-valor="8">Cortes em 8 partes iguais</text><text x="160" y="58" text-anchor="middle" font-size="21" fill="#172b3a" data-campo="fracao_pedida" data-valor="3/10">Pedido: 3/10</text><path d="M25 164H295" stroke="#263d4d" stroke-width="2"/><path d="M25.0 156V172" stroke="#263d4d" data-marca="0/8" data-x="25.0"/><text x="25.0" y="199" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="0">0</text><path d="M58.75 156V172" stroke="#263d4d" data-marca="1/8" data-x="58.75"/><text x="58.75" y="225" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="1">1/8</text><path d="M92.5 156V172" stroke="#263d4d" data-marca="2/8" data-x="92.5"/><text x="92.5" y="199" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="2">2/8</text><path d="M126.25 156V172" stroke="#263d4d" data-marca="3/8" data-x="126.25"/><text x="126.25" y="225" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="3">3/8</text><path d="M160.0 156V172" stroke="#263d4d" data-marca="4/8" data-x="160.0"/><text x="160.0" y="199" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="4">4/8</text><path d="M193.75 156V172" stroke="#263d4d" data-marca="5/8" data-x="193.75"/><text x="193.75" y="225" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="5">5/8</text><path d="M227.5 156V172" stroke="#263d4d" data-marca="6/8" data-x="227.5"/><text x="227.5" y="199" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="6">6/8</text><path d="M261.25 156V172" stroke="#263d4d" data-marca="7/8" data-x="261.25"/><text x="261.25" y="225" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="7">7/8</text><path d="M295.0 156V172" stroke="#263d4d" data-marca="8/8" data-x="295.0"/><text x="295.0" y="199" text-anchor="middle" font-size="16" fill="#172b3a" data-rotulo-marca="8">1</text><path d="M106.0 86V146M101.0 139L106.0 146L111.0 139" fill="none" stroke="#8a2d20" stroke-width="2" data-pedido="3/10" data-x="106.0"/><text x="160" y="266" text-anchor="middle" font-size="16" fill="#172b3a" >Comparar as distâncias até as marcas</text></svg>
