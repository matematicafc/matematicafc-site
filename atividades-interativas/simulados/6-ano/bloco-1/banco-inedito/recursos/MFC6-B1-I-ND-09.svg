<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 426" width="320" height="426" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-09-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-09-NDV1-descricao"><title id="MFC6-B1-I-ND-09-NDV1-titulo">Mesma tinta, dois tamanhos</title><desc id="MFC6-B1-I-ND-09-NDV1-descricao">Um frasco A com capacidade de 0,5 L e preço de R$ 3,20; um frasco B com capacidade de 0,8 L e preço de R$ 4,80. Os corpos retangulares têm a mesma largura e alturas proporcionais às capacidades; pequenas tampas são símbolos de embalagem. O volume exigido é exatamente 2 L, em frascos inteiros de um único tamanho. Nenhuma quantidade de frascos a comprar está desenhada.</desc><rect x="0" y="0" width="320" height="426" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="19" fill="#172b3a" data-campo="pedido_l" data-valor="2">Volume exigido: exatamente 2 L</text><text x="82" y="64" text-anchor="middle" font-size="20" fill="#172b3a" >Frasco A</text><rect x="68" y="149.0" width="28" height="15" fill="#d6d6d6" stroke="#263d4d" /><rect x="43" y="164.0" width="78" height="75.0" fill="#edf4f8" stroke="#263d4d" data-frasco="A"/><text x="82" y="278" text-anchor="middle" font-size="23" fill="#172b3a" data-campo="frasco_A_l" data-valor="0.5">0,5 L</text><text x="82" y="316" text-anchor="middle" font-size="24" fill="#172b3a" data-campo="frasco_A_reais" data-valor="3.20">R$ 3,20</text><text x="238" y="64" text-anchor="middle" font-size="20" fill="#172b3a" >Frasco B</text><rect x="224" y="104.0" width="28" height="15" fill="#d6d6d6" stroke="#263d4d" /><rect x="199" y="119.0" width="78" height="120.0" fill="#edf4f8" stroke="#263d4d" data-frasco="B"/><text x="238" y="278" text-anchor="middle" font-size="23" fill="#172b3a" data-campo="frasco_B_l" data-valor="0.8">0,8 L</text><text x="238" y="316" text-anchor="middle" font-size="24" fill="#172b3a" data-campo="frasco_B_reais" data-valor="4.80">R$ 4,80</text><text x="160" y="367" text-anchor="middle" font-size="16" fill="#172b3a" >Frascos inteiros, todos de um tamanho</text><text x="160" y="398" text-anchor="middle" font-size="16" fill="#172b3a" >Sem falta nem excedente de volume</text></svg>
