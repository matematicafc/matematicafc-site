<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 483" width="320" height="483" class="mfc-nd-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ND-01-NDV1-titulo" aria-describedby="MFC6-B1-I-ND-01-NDV1-descricao"><title id="MFC6-B1-I-ND-01-NDV1-titulo">Comparação de etiquetas com zeros</title><desc id="MFC6-B1-I-ND-01-NDV1-descricao">Etiqueta A: 1,50 kg; etiqueta B: 1,500 kg, preservando todos os zeros escritos. Um quadro alinha unidade, décimo, centésimo e milésimo: A mostra 1, 5, 0 e um traço para a ordem não escrita; B mostra 1, 5, 0 e 0. A legenda explica as ordens. Não há sinal de igualdade nem conclusão de comparação.</desc><rect x="0" y="0" width="320" height="483" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="21" fill="#172b3a" >Etiquetas de massa</text><rect x="24" y="47" width="272" height="76" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="70" text-anchor="middle" font-size="17" fill="#172b3a" >Etiqueta A</text><text x="160" y="105" text-anchor="middle" font-size="29" fill="#172b3a" data-campo="etiqueta_A_kg" data-valor="1.50">1,50 kg</text><rect x="24" y="142" width="272" height="76" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="165" text-anchor="middle" font-size="17" fill="#172b3a" >Etiqueta B</text><text x="160" y="200" text-anchor="middle" font-size="29" fill="#172b3a" data-campo="etiqueta_B_kg" data-valor="1.500">1,500 kg</text><text x="160" y="255" text-anchor="middle" font-size="19" fill="#172b3a" >Ordens da parte decimal</text><text x="115" y="284" text-anchor="middle" font-size="18" fill="#172b3a" >U</text><text x="165" y="284" text-anchor="middle" font-size="18" fill="#172b3a" >d</text><text x="215" y="284" text-anchor="middle" font-size="18" fill="#172b3a" >c</text><text x="265" y="284" text-anchor="middle" font-size="18" fill="#172b3a" >m</text><text x="45" y="330" text-anchor="middle" font-size="20" fill="#172b3a" >A</text><rect x="90" y="300" width="50" height="42" fill="white" stroke="#263d4d" /><text x="115" y="328" text-anchor="middle" font-size="22" fill="#172b3a" data-quadro="A" data-ordem="U">1</text><rect x="140" y="300" width="50" height="42" fill="white" stroke="#263d4d" /><text x="165" y="328" text-anchor="middle" font-size="22" fill="#172b3a" data-quadro="A" data-ordem="d">5</text><rect x="190" y="300" width="50" height="42" fill="white" stroke="#263d4d" /><text x="215" y="328" text-anchor="middle" font-size="22" fill="#172b3a" data-quadro="A" data-ordem="c">0</text><rect x="240" y="300" width="50" height="42" fill="white" stroke="#263d4d" /><text x="265" y="328" text-anchor="middle" font-size="22" fill="#172b3a" data-quadro="A" data-ordem="m">—</text><text x="45" y="382" text-anchor="middle" font-size="20" fill="#172b3a" >B</text><rect x="90" y="352" width="50" height="42" fill="white" stroke="#263d4d" /><text x="115" y="380" text-anchor="middle" font-size="22" fill="#172b3a" data-quadro="B" data-ordem="U">1</text><rect x="140" y="352" width="50" height="42" fill="white" stroke="#263d4d" /><text x="165" y="380" text-anchor="middle" font-size="22" fill="#172b3a" data-quadro="B" data-ordem="d">5</text><rect x="190" y="352" width="50" height="42" fill="white" stroke="#263d4d" /><text x="215" y="380" text-anchor="middle" font-size="22" fill="#172b3a" data-quadro="B" data-ordem="c">0</text><rect x="240" y="352" width="50" height="42" fill="white" stroke="#263d4d" /><text x="265" y="380" text-anchor="middle" font-size="22" fill="#172b3a" data-quadro="B" data-ordem="m">0</text><text x="160" y="430" text-anchor="middle" font-size="16" fill="#172b3a" >U: unidade; d: décimo</text><text x="160" y="456" text-anchor="middle" font-size="16" fill="#172b3a" >c: centésimo; m: milésimo</text></svg>
