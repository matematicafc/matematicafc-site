<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 462" width="320" height="462" class="mfc-on-svg" style="font-family:Arial,sans-serif" role="img" aria-labelledby="MFC6-B1-I-ON-11-ONV1-titulo" aria-describedby="MFC6-B1-I-ON-11-ONV1-descricao"><title id="MFC6-B1-I-ON-11-ONV1-titulo">Turnos com limites de uso</title><desc id="MFC6-B1-I-ON-11-ONV1-descricao">Sequência de experimentos de 12 minutos separados por limpezas de três minutos. Há três pontos indicando continuação, uma limpeza antes do último experimento e nenhuma depois dele. O período disponível é 65 minutos; o número total de experimentos ainda não é informado.</desc><rect x="0" y="0" width="320" height="462" fill="white"/><text x="160" y="25" text-anchor="middle" font-size="20" fill="#172b3a" data-campo="periodo_min" data-valor="65">Tempo disponível: 65 min</text><rect x="30" y="43" width="260" height="47" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="73" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="experimento_min" data-valor="12">Experimento: 12 min</text><rect x="30" y="166" width="260" height="47" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="196" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="experimento_min" data-valor="12">Experimento: 12 min</text><rect x="30" y="329" width="260" height="47" rx="3" fill="#edf4f8" stroke="#263d4d" /><text x="160" y="359" text-anchor="middle" font-size="18" fill="#172b3a" data-campo="experimento_min" data-valor="12">Último experimento: 12 min</text><rect x="70" y="108" width="180" height="38" rx="3" fill="#fff3df" stroke="#263d4d" /><text x="160" y="134" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="limpeza_entre_min" data-valor="3">Limpeza: 3 min</text><rect x="70" y="271" width="180" height="38" rx="3" fill="#fff3df" stroke="#263d4d" /><text x="160" y="297" text-anchor="middle" font-size="17" fill="#172b3a" data-campo="limpeza_entre_min" data-valor="3">Limpeza: 3 min</text><path d="M160 91V106" stroke="#263d4d" stroke-width="2"/><path d="M156 101L160 106L164 101" fill="none" stroke="#263d4d" stroke-width="2"/><path d="M160 147V164" stroke="#263d4d" stroke-width="2"/><path d="M156 159L160 164L164 159" fill="none" stroke="#263d4d" stroke-width="2"/><path d="M160 213V228" stroke="#263d4d" stroke-width="2"/><path d="M156 223L160 228L164 223" fill="none" stroke="#263d4d" stroke-width="2"/><path d="M160 250V269" stroke="#263d4d" stroke-width="2"/><path d="M156 264L160 269L164 264" fill="none" stroke="#263d4d" stroke-width="2"/><path d="M160 310V327" stroke="#263d4d" stroke-width="2"/><path d="M156 322L160 327L164 322" fill="none" stroke="#263d4d" stroke-width="2"/><circle cx="160" cy="234" r="2.5" fill="#263d4d"/><circle cx="160" cy="241" r="2.5" fill="#263d4d"/><circle cx="160" cy="248" r="2.5" fill="#263d4d"/><text x="160" y="410" text-anchor="middle" font-size="16" fill="#172b3a" >Após o último, não há limpeza</text><text x="160" y="439" text-anchor="middle" font-size="14" fill="#172b3a" >Continuação indicada pelos três pontos</text></svg>
