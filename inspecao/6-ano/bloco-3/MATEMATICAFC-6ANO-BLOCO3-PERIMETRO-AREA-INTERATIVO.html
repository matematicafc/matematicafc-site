<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MatemáticaFC — Perímetro e Área — inspeção interativa</title><style>.mfc-simulado{--mfc-ink:#16343f;--mfc-teal:#086a68;--mfc-line:#c9d9dc;--mfc-muted:#4d6570;box-sizing:border-box;color:var(--mfc-ink);font:17px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1140px;margin:0 auto;padding:28px 24px 48px;min-height:100vh}
.mfc-simulado *{box-sizing:border-box}
.mfc-simulado [hidden]{display:none!important}
.mfc-simulado h1,.mfc-simulado h2,.mfc-simulado h3,.mfc-simulado p{margin:0 0 16px}

.mfc-simulado button{cursor:pointer;min-height:46px;border:1px solid var(--mfc-line);border-radius:10px;padding:10px 18px;background:#fff;color:var(--mfc-ink);font-weight:650}
.mfc-simulado button:hover{background:#eaf3f3}

.mfc-simulado .mfc-kicker{font-size:14px;font-weight:750;color:var(--mfc-teal);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

.mfc-simulado .mfc-question-heading{scroll-margin-top:20px}

.mfc-simulado dialog{border:1px solid var(--mfc-line);border-radius:18px;padding:28px;max-width:480px;width:calc(100% - 32px);color:var(--mfc-ink)}
.mfc-simulado dialog::backdrop{background:#16343f99}
.mfc-simulado .mfc-dialog-buttons{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}

.mfc-simulado .mfc-stat{background:#eef6f5;border-radius:12px;padding:20px}

.mfc-simulado .mfc-review{margin-top:28px}

.mfc-simulado .mfc-answer-status{font-weight:650}

@media(max-width:760px){.mfc-simulado{padding:18px 12px 32px}.mfc-simulado .mfc-layout{grid-template-columns:minmax(0,1fr)}.mfc-simulado .mfc-card{padding:20px;border-radius:16px}.mfc-simulado .mfc-numbers{grid-template-columns:repeat(5,minmax(0,1fr))}.mfc-simulado .mfc-question-map{padding:18px}.mfc-simulado .mfc-brand{margin-bottom:22px}.mfc-simulado .mfc-toolbar{align-items:flex-start}.mfc-simulado .mfc-toolbar>button{width:100%}.mfc-simulado .mfc-option{padding:12px;gap:9px}.mfc-simulado .mfc-stats{gap:10px}.mfc-simulado .mfc-stat{padding:14px}.mfc-simulado .mfc-stat strong{font-size:1.7rem}}

.mfc-simulado .mfc-identificacao input{display:block;width:100%;min-height:46px;border:1px solid var(--mfc-line);border-radius:10px;padding:10px 12px;color:var(--mfc-ink);background:white}
.mfc-simulado .mfc-identificacao .mfc-note{font-size:14px;margin-top:8px}

@media(max-width:380px){.mfc-simulado .mfc-stats{grid-template-columns:minmax(0,1fr)}}


.mfc-simulado .mfc-question-heading{font-size:clamp(1.35rem,3vw,1.8rem);line-height:1.3;letter-spacing:normal}
.mfc-simulado .mfc-titulo-problema{font-size:1.15rem;line-height:1.4}
.mfc-simulado .mfc-numbers button{position:relative;min-height:60px;padding:8px 2px 20px}
.mfc-simulado .mfc-marca-resposta{position:absolute;right:3px;top:8px;font-size:14px;font-weight:800}
.mfc-simulado .mfc-marca-atual{position:absolute;bottom:3px;left:0;right:0;font-size:12px;line-height:1.2}
.mfc-simulado .mfc-numbers button[aria-current="step"]:focus-visible{outline:3px solid #a85b00;outline-offset:4px;box-shadow:inset 0 0 0 2px var(--mfc-ink)}
.mfc-simulado .mfc-nav-actions{flex-wrap:wrap}
.mfc-simulado h1,.mfc-simulado h2,.mfc-simulado h3,.mfc-simulado p,.mfc-simulado summary{overflow-wrap:anywhere}
.mfc-simulado .mfc-identificacao input{border-color:#637b82}
@media(forced-colors:active){.mfc-simulado .mfc-numbers button[aria-current="step"]{border:3px double CanvasText}.mfc-simulado .mfc-option:has(input:checked){border:3px solid Highlight}.mfc-simulado :focus-visible{outline:3px solid Highlight!important}}

.mfc-simulado .mfc-numero-questao{display:block;margin-right:12px}
.mfc-simulado .mfc-brand>span{min-width:0;overflow-wrap:anywhere}



.mfc-simulado .mfc-rotulo-celula{display:none}
.mfc-simulado .mfc-rotulo-celula::before{content:attr(data-rotulo)}
@media(max-width:480px){
 .mfc-simulado .mfc-tabela-responsiva{display:block;font-size:1rem;overflow-wrap:normal;word-break:normal}

 .mfc-simulado .mfc-tabela-responsiva .mfc-rotulo-celula{display:block;font-weight:650;margin-bottom:3px}
}

</style></head><body><div id="simulado-pa" class="mfc-simulado" data-etapa="preparando"></div><noscript>Esta versão interativa precisa de JavaScript para registrar respostas e apresentar o resultado. Nenhuma conexão com a internet é necessária.</noscript><script id="conteudo-pa" type="application/json">{"origem_html_sha256":"b0de551fa3b5f7cb9f27de7718c292694cdb10ce593a230c4c7af61dda41a41c","estado":"inspecao_interativa_local_sem_integracao","questoes":[{"id":"MFC6-B3-I-PA-01","codigo":"PA-01","titulo":"Fita para a borda do painel","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Compreender perímetro como comprimento de um contorno fechado.","dificuldade":{"nivel":"facil"},"enunciado":"Uma biblioteca vai colocar uma fita de acabamento em toda a borda de um painel retangular de 3 m de comprimento por 2 m de altura. A fita passará uma única vez pelos quatro lados, sem sobreposição nas emendas. Quantos metros de fita serão necessários?","alternativas":[{"letra":"A","texto":"6 m."},{"letra":"B","texto":"10 m."},{"letra":"C","texto":"5 m."},{"letra":"D","texto":"12 m."}],"gabarito":"B","resolucao_comentada":"A fita acompanha o contorno, por isso somamos os quatro lados: 3 + 2 + 3 + 2 = 10 m. O produto 3 × 2 mede a superfície do painel, não o comprimento da borda.","justificativas_distratores":{"A":"Calcula 3 × 2, confundindo a área com o comprimento do contorno.","C":"Soma apenas um comprimento e uma altura, deixando de contar os lados opostos.","D":"Dobra o resultado de 3 × 2, ainda sem representar a soma dos lados."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 300\" role=\"img\" aria-label=\"Painel retangular com comprimento de 3 m e altura de 2 m. Os quatro lados estão inteiros e o interior está vazio.\"\u003e\u003ctitle\u003ePainel retangular com comprimento de 3 m e altura de 2 m. Os quatro lados estão inteiros e o interior está vazio.\u003c/title\u003e\u003crect x=\"70\" y=\"85\" width=\"225\" height=\"150\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"182.5\" y=\"69\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 m\u003c/text\u003e\u003ctext x=\"38\" y=\"166.0\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e2 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Painel retangular com comprimento de 3 m e altura de 2 m. Os quatro lados estão inteiros e o interior está vazio."}]},{"id":"MFC6-B3-I-PA-02","codigo":"PA-02","titulo":"A superfície do mosaico","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Medir área por contagem de quadrados unitários.","dificuldade":{"nivel":"facil"},"enunciado":"Uma artesã está planejando um pequeno mosaico para a tampa de uma caixa. O desenho ocupa três fileiras encostadas: a de baixo tem quatro quadradinhos, a do meio tem três e a de cima tem dois, todos alinhados à esquerda e com lado de 1 cm. Qual é a área ocupada pelo desenho?","alternativas":[{"letra":"A","texto":"9 cm²."},{"letra":"B","texto":"12 cm²."},{"letra":"C","texto":"16 cm²."},{"letra":"D","texto":"18 cm²."}],"gabarito":"A","resolucao_comentada":"Cada quadradinho de lado 1 cm ocupa 1 cm². O desenho tem 4 + 3 + 2 = 9 quadradinhos, sem sobreposições. Portanto, sua área é 9 cm²; os espaços vazios da malha não entram na contagem.","justificativas_distratores":{"B":"Conta toda a malha retangular de quatro colunas e três fileiras, incluindo espaços não ocupados.","C":"Considera um quadrado de quatro por quatro, que não corresponde ao desenho.","D":"Conta duas vezes a superfície ocupada."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" role=\"img\" aria-label=\"Malha de quatro colunas e três fileiras. Há quatro células hachuradas embaixo, três no meio e duas em cima, todas alinhadas à esquerda. Cada célula tem lado de 1 cm.\"\u003e\u003ctitle\u003eMalha de quatro colunas e três fileiras. Há quatro células hachuradas embaixo, três no meio e duas em cima, todas alinhadas à esquerda. Cada célula tem lado de 1 cm.\u003c/title\u003e\u003cdefs\u003e\u003cpattern id=\"PA02p\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\u003crect x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"#ffffff\"/\u003e\u003cpath d=\"M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8\" fill=\"none\" stroke=\"#60747e\" stroke-width=\"1\"/\u003e\u003c/pattern\u003e\u003c/defs\u003e\u003crect x=\"80\" y=\"70\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"130\" y=\"70\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"180\" y=\"70\" width=\"50\" height=\"50\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"230\" y=\"70\" width=\"50\" height=\"50\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"80\" y=\"120\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"130\" y=\"120\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"180\" y=\"120\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"230\" y=\"120\" width=\"50\" height=\"50\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"80\" y=\"170\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"130\" y=\"170\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"180\" y=\"170\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"230\" y=\"170\" width=\"50\" height=\"50\" fill=\"url(#PA02p)\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"80\" y=\"70\" width=\"200\" height=\"150\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"280\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eCada lado de célula: 1 cm\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Malha de quatro colunas e três fileiras. Há quatro células hachuradas embaixo, três no meio e duas em cima, todas alinhadas à esquerda. Cada célula tem lado de 1 cm."}]},{"id":"MFC6-B3-I-PA-03","codigo":"PA-03","titulo":"Cortar somente a borda da etiqueta","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Distinguir bordas externas e lados compartilhados em uma malha.","dificuldade":{"nivel":"facil"},"enunciado":"Uma gráfica montou uma etiqueta em forma de L unindo três quadrados de lado 1 cm: dois lado a lado na fileira de baixo e um acima do quadrado da esquerda. A máquina deve recortar apenas a borda externa, sem cortar as linhas de união entre os quadrados. Qual é o comprimento total desse recorte?","alternativas":[{"letra":"A","texto":"3 cm."},{"letra":"B","texto":"6 cm."},{"letra":"C","texto":"8 cm."},{"letra":"D","texto":"12 cm."}],"gabarito":"C","resolucao_comentada":"Percorrendo a borda externa, contamos oito trechos de 1 cm, totalizando 8 cm. Outra conferência: os três quadrados têm, juntos, doze lados unitários; há duas uniões, e cada união retira dois lados da borda externa. Assim, 12 − 4 = 8 cm.","justificativas_distratores":{"A":"Usa a quantidade de quadrados como se ela medisse o contorno.","B":"Conta os seis segmentos retos do L como se todos medissem 1 cm, embora dois deles meçam 2 cm.","D":"Soma os contornos dos três quadrados sem retirar as linhas internas de união."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 350\" role=\"img\" aria-label=\"Etiqueta em L formada por três quadrados de lado 1 cm: dois na base e um acima do quadrado esquerdo. A borda externa é contínua; as duas uniões internas são mais finas.\"\u003e\u003ctitle\u003eEtiqueta em L formada por três quadrados de lado 1 cm: dois na base e um acima do quadrado esquerdo. A borda externa é contínua; as duas uniões internas são mais finas.\u003c/title\u003e\u003cpath d=\"M 100 260 L 260 260 L 260 180 L 180 180 L 180 100 L 100 100 Z\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"180\" y1=\"180\" x2=\"180\" y2=\"260\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003cline x1=\"100\" y1=\"180\" x2=\"180\" y2=\"180\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003cline x1=\"100\" y1=\"305\" x2=\"180\" y2=\"305\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"100\" y1=\"299\" x2=\"100\" y2=\"311\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"180\" y1=\"299\" x2=\"180\" y2=\"311\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"140\" y=\"337\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e1 cm\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Etiqueta em L formada por três quadrados de lado 1 cm: dois na base e um acima do quadrado esquerdo. A borda externa é contínua; as duas uniões internas são mais finas."}]},{"id":"MFC6-B3-I-PA-04","codigo":"PA-04","titulo":"Proteger o piso da sala de leitura","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Relacionar área retangular a fileiras de unidades quadradas.","dificuldade":{"nivel":"facil"},"enunciado":"Um centro cultural vai proteger uma parte retangular do piso com placas que cobrem 1 m² cada. O espaço mede 4 m de comprimento por 3 m de largura, e as placas serão colocadas sem frestas nem sobreposições. Qual é a área que ficará protegida?","alternativas":[{"letra":"A","texto":"7 m²."},{"letra":"B","texto":"14 m²."},{"letra":"C","texto":"24 m²."},{"letra":"D","texto":"12 m²."}],"gabarito":"D","resolucao_comentada":"É possível organizar três fileiras de quatro quadrados de 1 m². São 3 × 4 = 12 unidades quadradas, portanto a área protegida é 12 m². Somar os lados mede outra grandeza e não conta a superfície.","justificativas_distratores":{"A":"Soma 4 + 3 em vez de contar unidades quadradas.","B":"Calcula o perímetro 4 + 3 + 4 + 3 e o apresenta como área.","C":"Conta duas vezes as doze unidades quadradas da superfície."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 340\" role=\"img\" aria-label=\"Piso retangular de 4 m por 3 m dividido em quatro colunas e três fileiras. Uma placa corresponde a uma célula de área 1 m².\"\u003e\u003ctitle\u003ePiso retangular de 4 m por 3 m dividido em quatro colunas e três fileiras. Uma placa corresponde a uma célula de área 1 m².\u003c/title\u003e\u003crect x=\"70\" y=\"87\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"126\" y=\"87\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"182\" y=\"87\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"238\" y=\"87\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"70\" y=\"143\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"126\" y=\"143\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"182\" y=\"143\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"238\" y=\"143\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"70\" y=\"199\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"126\" y=\"199\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"182\" y=\"199\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"238\" y=\"199\" width=\"56\" height=\"56\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"70\" y=\"87\" width=\"224\" height=\"168\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"182\" y=\"66\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 m\u003c/text\u003e\u003ctext x=\"32\" y=\"177\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 m\u003c/text\u003e\u003ctext x=\"180\" y=\"305\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eCada placa: 1 m²\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Piso retangular de 4 m por 3 m dividido em quatro colunas e três fileiras. Uma placa corresponde a uma célula de área 1 m²."}]},{"id":"MFC6-B3-I-PA-05","codigo":"PA-05","titulo":"Dois materiais para a mesma capa","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Distinguir unidades de comprimento e unidades de área.","dificuldade":{"nivel":"facil"},"enunciado":"Uma encadernadora vai restaurar a capa retangular de um álbum. Ela usará uma fita estreita ao longo de toda a borda e uma película sobre toda a superfície externa da capa. Para registrar as duas quantidades em uma ficha, quais unidades são adequadas?","alternativas":[{"letra":"A","texto":"Centímetros para a fita e centímetros quadrados para a película."},{"letra":"B","texto":"Centímetros quadrados para a fita e centímetros para a película."},{"letra":"C","texto":"Centímetros para a fita e para a película."},{"letra":"D","texto":"Centímetros quadrados para a fita e para a película."}],"gabarito":"A","resolucao_comentada":"A fita é escolhida pelo comprimento que acompanha o contorno, medido em centímetros. A película é escolhida pela superfície que cobre, medida em centímetros quadrados. Portanto, as unidades adequadas são cm e cm², respectivamente.","justificativas_distratores":{"B":"Troca as unidades próprias do comprimento e da área.","C":"Usa uma unidade de comprimento para medir também a superfície.","D":"Usa uma unidade de área para medir também o comprimento da fita."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 570\" role=\"img\" aria-label=\"Duas representações iguais da capa retangular: na primeira está indicada a fita na borda; na segunda, a película hachurada na superfície. Não são informadas unidades.\"\u003e\u003ctitle\u003eDuas representações iguais da capa retangular: na primeira está indicada a fita na borda; na segunda, a película hachurada na superfície. Não são informadas unidades.\u003c/title\u003e\u003ctext x=\"180\" y=\"32\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eFita na borda\u003c/text\u003e\u003crect x=\"115\" y=\"65\" width=\"130\" height=\"180\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"3\"/\u003e\u003ctext x=\"180\" y=\"302\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003ePelícula na superfície\u003c/text\u003e\u003cdefs\u003e\u003cpattern id=\"PA05p\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\u003crect x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"#ffffff\"/\u003e\u003cpath d=\"M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8\" fill=\"none\" stroke=\"#60747e\" stroke-width=\"1\"/\u003e\u003c/pattern\u003e\u003c/defs\u003e\u003crect x=\"115\" y=\"335\" width=\"130\" height=\"180\" fill=\"url(#PA05p)\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003c/svg\u003e","css":"","acessibilidade":"Duas representações iguais da capa retangular: na primeira está indicada a fita na borda; na segunda, a película hachurada na superfície. Não são informadas unidades."}]},{"id":"MFC6-B3-I-PA-06","codigo":"PA-06","titulo":"Dois formatos para o mesmo tecido","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Reconhecer áreas iguais em retângulos de formatos diferentes.","dificuldade":{"nivel":"facil"},"enunciado":"Um grupo de dança precisa de duas peças de tecido: uma de 2 m por 6 m e outra de 3 m por 4 m. O tecido é cobrado pela área, e o fornecedor informou que não haverá perdas nos cortes. Qual comparação está correta?","alternativas":[{"letra":"A","texto":"A primeira peça tem 2 m² a mais."},{"letra":"B","texto":"A segunda peça tem 1 m² a mais."},{"letra":"C","texto":"A primeira peça tem o dobro da área da segunda."},{"letra":"D","texto":"As duas peças têm a mesma área, de 12 m² cada."}],"gabarito":"D","resolucao_comentada":"A primeira peça ocupa 2 × 6 = 12 m², e a segunda, 3 × 4 = 12 m². Apesar dos formatos diferentes, ambas têm a mesma área e exigem a mesma quantidade de tecido.","justificativas_distratores":{"A":"Compara os perímetros de 16 m e 14 m e interpreta a diferença de 2 m como diferença de área.","B":"Compara somente as larguras de 3 m e 2 m e interpreta a diferença de 1 m como diferença de área, ignorando os comprimentos.","C":"Usa apenas o comprimento 6 m em comparação com 3 m e ignora as outras dimensões."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 455\" role=\"img\" aria-label=\"Duas peças de tecido na mesma escala: a primeira mede 6 m por 2 m; a segunda mede 4 m por 3 m. Malhas unitárias permitem comparar suas superfícies, sem totais impressos.\"\u003e\u003ctitle\u003eDuas peças de tecido na mesma escala: a primeira mede 6 m por 2 m; a segunda mede 4 m por 3 m. Malhas unitárias permitem comparar suas superfícies, sem totais impressos.\u003c/title\u003e\u003ctext x=\"180\" y=\"30\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003ePeça 1\u003c/text\u003e\u003crect x=\"60\" y=\"80\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"10 "40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"180\" y=\"290\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"220\" y=\"290\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"100\" y=\"330\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"140\" y=\"330\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"180\" y=\"330\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"220\" y=\"330\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"100\" y=\"370\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"140\" y=\"370\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"180\" y=\"370\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"220\" y=\"370\" width=\"40\" height=\"40\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003crect x=\"100\" y=\"290\" width=\"160\" height=\"120\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"274\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 m\u003c/text\u003e\u003ctext x=\"67\" y=\"356\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Duas peças de tecido na mesma escala: a primeira mede 6 m por 2 m; a segunda mede 4 m por 3 m. Malhas unitárias permitem comparar suas superfícies, sem totais impressos."}]},{"id":"MFC6-B3-I-PA-07","codigo":"PA-07","titulo":"A tela precisa deixar espaço para o portão","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Calcular a parte de um contorno que receberá material.","dificuldade":{"nivel":"facil"},"enunciado":"Uma horta retangular de 6 m por 4 m receberá uma tela de proteção. Um trecho de 2 m em um dos lados ficará reservado para o portão e não receberá tela. Sem considerar perdas ou emendas, quantos metros de tela serão usados?","alternativas":[{"letra":"A","texto":"20 m."},{"letra":"B","texto":"18 m."},{"letra":"C","texto":"22 m."},{"letra":"D","texto":"8 m."}],"gabarito":"B","resolucao_comentada":"O contorno completo mede 6 + 4 + 6 + 4 = 20 m. Como 2 m serão ocupados pelo portão, a tela deve cobrir 20 − 2 = 18 m. O perímetro da horta continua sendo 20 m; 18 m é apenas o comprimento de tela necessário.","justificativas_distratores":{"A":"Calcula o contorno completo, mas não desconta o espaço do portão.","C":"Soma a medida do portão ao contorno em vez de descontá-la.","D":"Soma apenas os dois lados de 4 m."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" role=\"img\" aria-label=\"Horta retangular de 6 m por 4 m. No centro do lado inferior, um trecho tracejado de 2 m está identificado como portão; os demais trechos do contorno são contínuos.\"\u003e\u003ctitle\u003eHorta retangular de 6 m por 4 m. No centro do lado inferior, um trecho tracejado de 2 m está identificado como portão; os demais trechos do contorno são contínuos.\u003c/title\u003e\u003cpath d=\"M 60 255 L 60 95 L 300 95 L 300 255 L 220 255\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"60\" y1=\"255\" x2=\"140\" y2=\"255\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"140\" y1=\"255\" x2=\"220\" y2=\"255\" stroke=\"#183e4b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"180\" y=\"76\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e6 m\u003c/text\u003e\u003ctext x=\"27\" y=\"181\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 m\u003c/text\u003e\u003ctext x=\"180\" y=\"301\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003ePortão: 2 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Horta retangular de 6 m por 4 m. No centro do lado inferior, um trecho tracejado de 2 m está identificado como portão; os demais trechos do contorno são contínuos."}]},{"id":"MFC6-B3-I-PA-08","codigo":"PA-08","titulo":"Uma bandeirola a partir de um retângulo","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Compreender área triangular como metade de uma área retangular.","dificuldade":{"nivel":"facil"},"enunciado":"Para decorar uma feira, uma equipe corta um papel retangular de 8 cm por 4 cm exatamente pela diagonal. Os dois pedaços triangulares serão usados como bandeirolas iguais, sem retirar outras partes do papel. Qual é a área de cada bandeirola?","alternativas":[{"letra":"A","texto":"16 cm²."},{"letra":"B","texto":"32 cm²."},{"letra":"C","texto":"12 cm²."},{"letra":"D","texto":"24 cm²."}],"gabarito":"A","resolucao_comentada":"O retângulo tem área de 8 × 4 = 32 cm². A diagonal o divide em dois triângulos de mesma área, que podem ser sobrepostos um ao outro. Cada bandeirola ocupa metade: 32 ÷ 2 = 16 cm².","justificativas_distratores":{"B":"Atribui a uma bandeirola a área do retângulo inteiro.","C":"Soma 8 + 4 e trata o resultado como área.","D":"Usa o perímetro do retângulo, 24 cm, como se fosse a área de um triângulo."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 300\" role=\"img\" aria-label=\"Papel retangular de 8 cm por 4 cm cortado pela diagonal que liga os cantos inferior esquerdo e superior direito. Os dois triângulos são identificados como I e II, sem áreas.\"\u003e\u003ctitle\u003ePapel retangular de 8 cm por 4 cm cortado pela diagonal que liga os cantos inferior esquerdo e superior direito. Os dois triângulos são identificados como I e II, sem áreas.\u003c/title\u003e\u003crect x=\"60\" y=\"130\" width=\"240\" height=\"120\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180.0\" y=\"114\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e8 cm\u003c/text\u003e\u003ctext x=\"28\" y=\"196.0\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 cm\u003c/text\u003e\u003cline x1=\"60\" y1=\"250\" x2=\"300\" y2=\"130\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"220\" y=\"217\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eI\u003c/text\u003e\u003ctext x=\"140\" y=\"177\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eII\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Papel retangular de 8 cm por 4 cm cortado pela diagonal que liga os cantos inferior esquerdo e superior direito. Os dois triângulos são identificados como I e II, sem áreas."}]},{"id":"MFC6-B3-I-PA-09","codigo":"PA-09","titulo":"Um cercado com toda a tela disponível","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Determinar um lado de retângulo a partir do perímetro e do outro lado.","dificuldade":{"nivel":"media"},"enunciado":"Um abrigo de animais recebeu 28 m de tela para montar um cercado retangular fechado. A equipe decidiu usar toda a tela e fixou a largura em 4 m, mantendo dois lados dessa medida. Sem descontar aberturas, qual deve ser o comprimento de cada um dos outros dois lados?","alternativas":[{"letra":"A","texto":"24 m."},{"letra":"B","texto":"14 m."},{"letra":"C","texto":"10 m."},{"letra":"D","texto":"7 m."}],"gabarito":"C","resolucao_comentada":"As duas larguras consomem 4 + 4 = 8 m. Restam 28 − 8 = 20 m para os dois comprimentos, que são iguais. Cada um deve medir 20 ÷ 2 = 10 m. Conferindo: 10 + 4 + 10 + 4 = 28 m.","justificativas_distratores":{"A":"Retira apenas uma largura do total e atribui todo o restante a um lado.","B":"Divide o perímetro por dois, mas não desconta a largura do semiperímetro.","D":"Divide 28 por quatro como se o cercado tivesse de ser quadrado."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 300\" role=\"img\" aria-label=\"Cercado retangular com contorno total de 28 m. Os dois lados menores têm 4 m; os dois maiores têm interrogações, sem medida calculada.\"\u003e\u003ctitle\u003eCercado retangular com contorno total de 28 m. Os dois lados menores têm 4 m; os dois maiores têm interrogações, sem medida calculada.\u003c/title\u003e\u003ctext x=\"180\" y=\"30\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eContorno total: 28 m\u003c/text\u003e\u003crect x=\"60\" y=\"129\" width=\"240\" height=\"96\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"113\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e? m\u003c/text\u003e\u003ctext x=\"180\" y=\"261\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e? m\u003c/text\u003e\u003ctext x=\"28\" y=\"183\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 m\u003c/text\u003e\u003ctext x=\"331\" y=\"183\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Cercado retangular com contorno total de 28 m. Os dois lados menores têm 4 m; os dois maiores têm interrogações, sem medida calculada."}]},{"id":"MFC6-B3-I-PA-10","codigo":"PA-10","titulo":"Revestir a parede sem cobrir a janela","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Calcular área disponível pela diferença entre superfícies.","dificuldade":{"nivel":"media"},"enunciado":"Uma cozinha vai receber um novo revestimento em uma parede retangular de 5 m por 3 m. Nessa parede há uma janela de 2 m por 1 m, que ficará sem revestimento. Desconsiderando perdas de material, qual área precisa ser revestida?","alternativas":[{"letra":"A","texto":"15 m²."},{"letra":"B","texto":"13 m²."},{"letra":"C","texto":"17 m²."},{"letra":"D","texto":"14 m²."}],"gabarito":"B","resolucao_comentada":"A parede inteira mede 5 × 3 = 15 m². A janela ocupa 2 × 1 = 2 m². Portanto, o revestimento cobrirá 15 − 2 = 13 m².","justificativas_distratores":{"A":"Considera a parede inteira e não desconta a janela.","C":"Acrescenta a área da janela à área total da parede.","D":"Desconta apenas 1 m², usando somente uma das medidas da janela."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" role=\"img\" aria-label=\"Parede retangular de 5 m por 3 m com janela interna de 2 m por 1 m. A parede a revestir é hachurada e a janela está sem hachura, identificada por nome.\"\u003e\u003ctitle\u003eParede retangular de 5 m por 3 m com janela interna de 2 m por 1 m. A parede a revestir é hachurada e a janela está sem hachura, identificada por nome.\u003c/title\u003e\u003cdefs\u003e\u003cpattern id=\"PA10p\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\u003crect x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"#ffffff\"/\u003e\u003cpath d=\"M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8\" fill=\"none\" stroke=\"#60747e\" stroke-width=\"1\"/\u003e\u003c/pattern\u003e\u003c/defs\u003e\u003crect x=\"60\" y=\"106\" width=\"240\" height=\"144\" fill=\"url(#PA10p)\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180.0\" y=\"90\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e5 m\u003c/text\u003e\u003ctext x=\"28\" y=\"184.0\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 m\u003c/text\u003e\u003crect x=\"132\" y=\"154\" width=\"96\" height=\"48\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"185\" font-size=\"17\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eJanela\u003c/text\u003e\u003ctext x=\"180\" y=\"302\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eJanela: 2 m × 1 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Parede retangular de 5 m por 3 m com janela interna de 2 m por 1 m. A parede a revestir é hachurada e a janela está sem hachura, identificada por nome."}]},{"id":"MFC6-B3-I-PA-11","codigo":"PA-11","titulo":"Um toldo com espaço para o balcão","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Calcular área de figura composta por retângulos sem sobreposição.","dificuldade":{"nivel":"media"},"enunciado":"Uma barraca de feira terá um toldo formado por uma parte retangular de 6 m por 3 m e uma extensão de 2 m por 2 m para proteger o balcão. A extensão ficará encostada pelo lado de 2 m no centro de um dos lados de 6 m, sem sobreposição entre as partes. Qual será a área total do toldo?","alternativas":[{"letra":"A","texto":"18 m²."},{"letra":"B","texto":"20 m²."},{"letra":"C","texto":"26 m²."},{"letra":"D","texto":"22 m²."}],"gabarito":"D","resolucao_comentada":"A parte principal tem 6 × 3 = 18 m². A extensão tem 2 × 2 = 4 m². Como as superfícies não se sobrepõem, somamos: 18 + 4 = 22 m².","justificativas_distratores":{"A":"Considera somente a parte principal e esquece a extensão.","B":"Acrescenta 2 ao total, confundindo uma medida de lado com a área de 4 m².","C":"Conta duas extensões de 4 m², embora exista apenas uma."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 360\" role=\"img\" aria-label=\"Toldo em T, composto por retângulo principal de 6 m por 3 m e extensão central de 2 m por 2 m, encostados sem sobreposição. A união é tracejada.\"\u003e\u003ctitle\u003eToldo em T, composto por retângulo principal de 6 m por 3 m e extensão central de 2 m por 2 m, encostados sem sobreposição. A união é tracejada.\u003c/title\u003e\u003cpath d=\"M 54 206 L 138 206 L 138 290 L 222 290 L 222 206 L 306 206 L 306 80 L 54 80 Z\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"138\" y1=\"206\" x2=\"222\" y2=\"206\" stroke=\"#183e4b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"180\" y=\"64\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e6 m\u003c/text\u003e\u003ctext x=\"23\" y=\"150\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 m\u003c/text\u003e\u003ctext x=\"180\" y=\"329\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e2 m\u003c/text\u003e\u003ctext x=\"254\" y=\"254\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e2 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Toldo em T, composto por retângulo principal de 6 m por 3 m e extensão central de 2 m por 2 m, encostados sem sobreposição. A união é tracejada."}]},{"id":"MFC6-B3-I-PA-12","codigo":"PA-12","titulo":"A mesma tela pode proteger mais espaço?","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Comparar áreas de retângulos com perímetros iguais.","dificuldade":{"nivel":"media"},"enunciado":"Um projeto de recuperação de animais estuda dois cercados retangulares: P, de 5 m por 3 m, e Q, de 6 m por 2 m. Os dois serão fechados nos quatro lados com o mesmo tipo de tela. Qual opção aproveita mais área sem exigir uma quantidade maior de tela?","alternativas":[{"letra":"A","texto":"P, com 3 m² a mais que Q e o mesmo comprimento de tela."},{"letra":"B","texto":"Q, com 3 m² a mais que P e o mesmo comprimento de tela."},{"letra":"C","texto":"Os dois oferecem a mesma área e usam o mesmo comprimento de tela."},{"letra":"D","texto":"P, com 3 m² a mais que Q, mas exigindo mais tela."}],"gabarito":"A","resolucao_comentada":"O contorno de P é 5 + 3 + 5 + 3 = 16 m, e o de Q é 6 + 2 + 6 + 2 = 16 m. As áreas são 5 × 3 = 15 m² e 6 × 2 = 12 m². Portanto, P oferece 15 − 12 = 3 m² a mais, usando a mesma quantidade de tela.","justificativas_distratores":{"B":"Calcula a diferença de área, mas inverte qual cercado tem a maior superfície.","C":"Supõe que perímetros iguais obrigam áreas iguais.","D":"Calcula a diferença de área, mas compara apenas as larguras e supõe que P exige mais tela, sem somar seus quatro lados."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 480\" role=\"img\" aria-label=\"Cercados P e Q na mesma escala: P mede 5 m por 3 m; Q mede 6 m por 2 m. Nenhum deles é destacado como melhor.\"\u003e\u003ctitle\u003eCercados P e Q na mesma escala: P mede 5 m por 3 m; Q mede 6 m por 2 m. Nenhum deles é destacado como melhor.\u003c/title\u003e\u003ctext x=\"180\" y=\"30\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eP\u003c/text\u003e\u003crect x=\"80\" y=\"90\" width=\"200\" height=\"120\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180.0\" y=\"74\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e5 m\u003c/text\u003e\u003ctext x=\"48\" y=\"156.0\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 m\u003c/text\u003e\u003ctext x=\"180\" y=\"280\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eQ\u003c/text\u003e\u003crect x=\"60\" y=\"350\" width=\"240\" height=\"80\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180.0\" y=\"334\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e6 m\u003c/text\u003e\u003ctext x=\"28\" y=\"396.0\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e2 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Cercados P e Q na mesma escala: P mede 5 m por 3 m; Q mede 6 m por 2 m. Nenhum deles é destacado como melhor."}]},{"id":"MFC6-B3-I-PA-13","codigo":"PA-13","titulo":"A largura necessária para o tapete","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Encontrar uma dimensão retangular a partir da área e de outra dimensão.","dificuldade":{"nivel":"media"},"enunciado":"Um museu vai cobrir uma área retangular de 48 m² com um tapete feito sob medida. O comprimento disponível é de 8 m, e o tapete deverá ocupar toda a área, sem sobras laterais. Qual largura deve ser informada ao fornecedor?","alternativas":[{"letra":"A","texto":"40 m."},{"letra":"B","texto":"8 m."},{"letra":"C","texto":"6 m."},{"letra":"D","texto":"3 m."}],"gabarito":"C","resolucao_comentada":"Cada faixa de 1 m de largura ao longo dos 8 m de comprimento ocupa 8 m². Para chegar a 48 m², são necessárias 48 ÷ 8 = 6 dessas faixas. A largura é 6 m, e a conferência é 8 × 6 = 48 m².","justificativas_distratores":{"A":"Subtrai 8 de 48, misturando comprimento e área.","B":"Repete o comprimento e supõe que a região é quadrada, o que daria 64 m².","D":"Divide 48 por 16, contando o comprimento de 8 m duas vezes no cálculo da largura."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" role=\"img\" aria-label=\"Região retangular com comprimento de 8 m e área informada de 48 m². A largura aparece com interrogação; não há malha ou número de faixas.\"\u003e\u003ctitle\u003eRegião retangular com comprimento de 8 m e área informada de 48 m². A largura aparece com interrogação; não há malha ou número de faixas.\u003c/title\u003e\u003crect x=\"60\" y=\"100\" width=\"240\" height=\"180\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180.0\" y=\"84\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e8 m\u003c/text\u003e\u003ctext x=\"28\" y=\"196.0\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e? m\u003c/text\u003e\u003ctext x=\"180\" y=\"196\" font-size=\"20\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eÁrea: 48 m²\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Região retangular com comprimento de 8 m e área informada de 48 m². A largura aparece com interrogação; não há malha ou número de faixas."}]},{"id":"MFC6-B3-I-PA-14","codigo":"PA-14","titulo":"Placas inteiras para a bancada","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Determinar quantidade de unidades quadradas por organização em fileiras.","dificuldade":{"nivel":"media"},"enunciado":"Um laboratório de artes vai proteger somente a superfície superior de uma bancada retangular de 80 cm por 60 cm. Estão disponíveis placas quadradas de 20 cm de lado, que serão colocadas inteiras, sem frestas ou sobreposições. Quantas placas serão necessárias?","alternativas":[{"letra":"A","texto":"7 placas."},{"letra":"B","texto":"6 placas."},{"letra":"C","texto":"24 placas."},{"letra":"D","texto":"12 placas."}],"gabarito":"D","resolucao_comentada":"No lado de 80 cm cabem 80 ÷ 20 = 4 placas. No lado de 60 cm cabem 60 ÷ 20 = 3 placas. São três fileiras de quatro, totalizando 3 × 4 = 12 placas. Não é necessário converter as medidas, pois todas estão em centímetros.","justificativas_distratores":{"A":"Soma quatro placas de uma direção com três da outra, em vez de contar as fileiras completas.","B":"Conta apenas duas das quatro colunas de três placas.","C":"Conta duas superfícies da bancada, embora apenas a parte superior seja protegida."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 480\" role=\"img\" aria-label=\"Superfície retangular da bancada de 80 cm por 60 cm e uma placa quadrada separada de 20 cm de lado, desenhadas na mesma escala. A bancada não está preenchida com placas.\"\u003e\u003ctitle\u003eSuperfície retangular da bancada de 80 cm por 60 cm e uma placa quadrada separada de 20 cm de lado, desenhadas na mesma escala. A bancada não está preenchida com placas.\u003c/title\u003e\u003ctext x=\"180\" y=\"30\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eSomente a face superior\u003c/text\u003e\u003crect x=\"60\" y=\"100\" width=\"240\" height=\"180\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180.0\" y=\"84\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e80 cm\u003c/text\u003e\u003ctext x=\"28\" y=\"196.0\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e60 cm\u003c/text\u003e\u003crect x=\"150\" y=\"350\" width=\"60\" height=\"60\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"451\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003ePlaca: 20 cm × 20 cm\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Superfície retangular da bancada de 80 cm por 60 cm e uma placa quadrada separada de 20 cm de lado, desenhadas na mesma escala. A bancada não está preenchida com placas."}]},{"id":"MFC6-B3-I-PA-15","codigo":"PA-15","titulo":"A parte do cartão que receberá pintura","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Decompor uma superfície triangular e descontar uma região reservada.","dificuldade":{"nivel":"media"},"enunciado":"Uma artista fez um cartão triangular cortando pela diagonal um retângulo de 6 cm por 4 cm. No canto de ângulo reto do triângulo, reservou um quadrado de 2 cm de lado para colar uma fotografia. Qual área do cartão triangular ficará disponível para a pintura?","alternativas":[{"letra":"A","texto":"20 cm²."},{"letra":"B","texto":"8 cm²."},{"letra":"C","texto":"12 cm²."},{"letra":"D","texto":"4 cm²."}],"gabarito":"B","resolucao_comentada":"O retângulo original tem 6 × 4 = 24 cm². O cartão triangular ocupa metade: 24 ÷ 2 = 12 cm². O quadrado da fotografia ocupa 2 × 2 = 4 cm²; por isso, a pintura terá 12 − 4 = 8 cm².","justificativas_distratores":{"A":"Desconta a fotografia do retângulo inteiro e esquece que o cartão é triangular.","C":"Calcula a área do triângulo, mas não desconta a fotografia.","D":"Informa a área da fotografia, não a região disponível para pintura."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 350\" role=\"img\" aria-label=\"Cartão triangular obtido do retângulo de 6 cm por 4 cm, cujo contorno original aparece tracejado. No canto reto, um quadrado hachurado de 2 cm de lado está inteiramente dentro do triângulo e reservado para a foto.\"\u003e\u003ctitle\u003eCartão triangular obtido do retângulo de 6 cm por 4 cm, cujo contorno original aparece tracejado. No canto reto, um quadrado hachurado de 2 cm de lado está inteiramente dentro do triângulo e reservado para a foto.\u003c/title\u003e\u003crect x=\"60\" y=\"100\" width=\"240\" height=\"160\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/\u003e\u003cpath d=\"M 60 260 L 300 260 L 60 100 Z\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cdefs\u003e\u003cpattern id=\"PA15p\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\u003crect x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"#ffffff\"/\u003e\u003cpath d=\"M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8\" fill=\"none\" stroke=\"#60747e\" stroke-width=\"1\"/\u003e\u003c/pattern\u003e\u003c/defs\u003e\u003crect x=\"60\" y=\"180\" width=\"80\" height=\"80\" fill=\"url(#PA15p)\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"100\" y=\"226\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eFoto\u003c/text\u003e\u003ctext x=\"180\" y=\"80\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e6 cm\u003c/text\u003e\u003ctext x=\"27\" y=\"186\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 cm\u003c/text\u003e\u003ctext x=\"180\" y=\"318\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eFoto: quadrado de lado 2 cm\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Cartão triangular obtido do retângulo de 6 cm por 4 cm, cujo contorno original aparece tracejado. No canto reto, um quadrado hachurado de 2 cm de lado está inteiramente dentro do triângulo e reservado para a foto."}]},{"id":"MFC6-B3-I-PA-16","codigo":"PA-16","titulo":"Quatro propostas para o mesmo espaço","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Verificar simultaneamente restrições de comprimento, perímetro e área.","dificuldade":{"nivel":"media"},"enunciado":"Uma associação dispõe de um espaço retangular de 8 m por 6 m para instalar uma horta menor dentro dele. As quatro plantas são propostas alternativas para essa mesma horta, não partes a serem construídas juntas. Para escolher uma, é preciso atender simultaneamente a três condições: largura de pelo menos 4 m, área de pelo menos 24 m² e contorno de no máximo 22 m. Qual proposta atende a todas as condições?","alternativas":[{"letra":"A","texto":"A: comprimento de 8 m e largura de 3 m."},{"letra":"B","texto":"B: comprimento de 8 m e largura de 4 m."},{"letra":"C","texto":"C: comprimento de 7 m e largura de 4 m."},{"letra":"D","texto":"D: comprimento de 5 m e largura de 4 m."}],"gabarito":"C","resolucao_comentada":"A proposta A tem área de 24 m² e contorno de 22 m, mas largura de apenas 3 m. B tem largura de 4 m e área de 32 m², mas seu contorno mede 24 m, acima do limite. C tem largura de 4 m, área de 7 × 4 = 28 m² e contorno de 7 + 4 + 7 + 4 = 22 m: atende às três condições. D tem largura de 4 m e contorno de 18 m, mas área de apenas 20 m². Todas cabem no espaço disponível, e somente C cumpre também as três exigências.","justificativas_distratores":{"A":"Verifica área e contorno, mas ignora a largura mínima.","B":"Verifica largura e área, mas ignora o limite de contorno.","D":"Verifica largura e contorno, mas ignora a área mínima."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 950\" role=\"img\" aria-label=\"Quatro propostas alternativas A, B, C e D para a mesma horta, todas na mesma escala, dentro da referência tracejada de 8 m por 6 m. As dimensões são, respectivamente, 8 por 3, 8 por 4, 7 por 4 e 5 por 4 metros. Nenhuma planta recebe sinal de aprovação.\"\u003e\u003ctitle\u003eQuatro propostas alternativas A, B, C e D para a mesma horta, todas na mesma escala, dentro da referência tracejada de 8 m por 6 m. As dimensões são, respectivamente, 8 por 3, 8 por 4, 7 por 4 e 5 por 4 metros. Nenhuma planta recebe sinal de aprovação.\u003c/title\u003e\u003ctext x=\"180\" y=\"28\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eEspaço comum: 8 m × 6 m\u003c/text\u003e\u003ctext x=\"180\" y=\"75\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eA — 8 m × 3 m\u003c/text\u003e\u003crect x=\"90\" y=\"100\" width=\"176\" height=\"132\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/\u003e\u003crect x=\"90\" y=\"166\" width=\"176\" height=\"66\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"305\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eB — 8 m × 4 m\u003c/text\u003e\u003crect x=\"90\" y=\"330\" width=\"176\" height=\"132\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/\u003e\u003crect x=\"90\" y=\"374\" width=\"176\" height=\"88\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"535\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eC — 7 m × 4 m\u003c/text\u003e\u003crect x=\"90\" y=\"560\" width=\"176\" height=\"132\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/\u003e\u003crect x=\"90\" y=\"604\" width=\"154\" height=\"88\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"765\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eD — 5 m × 4 m\u003c/text\u003e\u003crect x=\"90\" y=\"790\" width=\"176\" height=\"132\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/\u003e\u003crect x=\"90\" y=\"834\" width=\"110\" height=\"88\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003c/svg\u003e","css":"","acessibilidade":"Quatro propostas alternativas A, B, C e D para a mesma horta, todas na mesma escala, dentro da referência tracejada de 8 m por 6 m. As dimensões são, respectivamente, 8 por 3, 8 por 4, 7 por 4 e 5 por 4 metros. Nenhuma planta recebe sinal de aprovação."}]},{"id":"MFC6-B3-I-PA-17","codigo":"PA-17","titulo":"O recorte muda o comprimento da borda?","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Analisar como um recorte de canto altera o percurso de um contorno.","dificuldade":{"nivel":"media"},"enunciado":"Uma oficina de cenografia preparou uma placa retangular de 8 cm por 5 cm. Para encaixá-la em uma peça do cenário, retirou um quadrado de 2 cm de lado de um dos cantos, formando um L. Uma fita será colocada em toda a nova borda, incluindo o recuo. Qual comprimento de fita será necessário?","alternativas":[{"letra":"A","texto":"26 cm."},{"letra":"B","texto":"22 cm."},{"letra":"C","texto":"30 cm."},{"letra":"D","texto":"36 cm."}],"gabarito":"A","resolucao_comentada":"O contorno original mede 8 + 5 + 8 + 5 = 26 cm. Ao retirar o canto, desaparecem dois trechos de 2 cm, mas surgem dois outros trechos de 2 cm no recuo. O total não muda: continuam sendo necessários 26 cm. A área diminui, mas isso não significa que o perímetro também diminua.","justificativas_distratores":{"B":"Desconta os dois trechos de 2 cm retirados e não inclui as duas novas bordas do recuo.","C":"Soma as duas novas bordas de 2 cm, mas não retira os trechos que desapareceram.","D":"Usa a área restante, 8 × 5 − 2 × 2 = 36 cm², como se fosse comprimento."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 350\" role=\"img\" aria-label=\"Placa de 8 cm por 5 cm com recorte quadrado de 2 cm de lado no canto superior direito. O antigo canto aparece tracejado; o contorno restante inclui os dois segmentos do recuo.\"\u003e\u003ctitle\u003ePlaca de 8 cm por 5 cm com recorte quadrado de 2 cm de lado no canto superior direito. O antigo canto aparece tracejado; o contorno restante inclui os dois segmentos do recuo.\u003c/title\u003e\u003cpath d=\"M 60 270 L 300 270 L 300 180 L 240 180 L 240 120 L 60 120 Z\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cpath d=\"M 240 120 L 300 120 L 300 180\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"180\" y=\"94\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e8 cm\u003c/text\u003e\u003ctext x=\"27\" y=\"201\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e5 cm\u003c/text\u003e\u003ctext x=\"180\" y=\"325\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eRecorte: 2 cm × 2 cm\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Placa de 8 cm por 5 cm com recorte quadrado de 2 cm de lado no canto superior direito. O antigo canto aparece tracejado; o contorno restante inclui os dois segmentos do recuo."}]},{"id":"MFC6-B3-I-PA-18","codigo":"PA-18","titulo":"O caminho ao redor do jardim","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Calcular a área de uma faixa externa de largura uniforme.","dificuldade":{"nivel":"media"},"enunciado":"Um jardim retangular de 6 m por 4 m receberá um caminho de 1 m de largura em toda a sua volta, pelo lado de fora. O caminho também ocupará os quatro cantos ao redor do jardim, formando com ele um retângulo maior. Qual será a área somente do caminho?","alternativas":[{"letra":"A","texto":"20 m²."},{"letra":"B","texto":"28 m²."},{"letra":"C","texto":"48 m²."},{"letra":"D","texto":"24 m²."}],"gabarito":"D","resolucao_comentada":"Como há 1 m de caminho em cada extremidade, o retângulo externo mede 6 + 1 + 1 = 8 m por 4 + 1 + 1 = 6 m. Sua área é 8 × 6 = 48 m². O jardim ocupa 6 × 4 = 24 m². Portanto, o caminho ocupa 48 − 24 = 24 m².","justificativas_distratores":{"A":"Usa o perímetro de 20 m do jardim como se fosse a área do caminho, sem considerar os cantos.","B":"Apresenta o perímetro de 28 m do retângulo externo como área.","C":"Conta toda a superfície externa, incluindo o jardim."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 435\" role=\"img\" aria-label=\"Jardim retangular de 6 m por 4 m cercado externamente por caminho de 1 m de largura, inclusive nos cantos. O caminho é hachurado; as dimensões externas calculadas não estão impressas.\"\u003e\u003ctitle\u003eJardim retangular de 6 m por 4 m cercado externamente por caminho de 1 m de largura, inclusive nos cantos. O caminho é hachurado; as dimensões externas calculadas não estão impressas.\u003c/title\u003e\u003cdefs\u003e\u003cpattern id=\"PA18p\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\u003crect x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"#ffffff\"/\u003e\u003cpath d=\"M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8\" fill=\"none\" stroke=\"#60747e\" stroke-width=\"1\"/\u003e\u003c/pattern\u003e\u003c/defs\u003e\u003crect x=\"36\" y=\"89\" width=\"288\" height=\"216\" fill=\"url(#PA18p)\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003crect x=\"72\" y=\"125\" width=\"216\" height=\"144\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003crect x=\"156\" y=\"92\" width=\"48\" height=\"26\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"0\"/\u003e\u003ctext x=\"180\" y=\"113\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e6 m\u003c/text\u003e\u003ctext x=\"95\" y=\"204\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 m\u003c/text\u003e\u003ctext x=\"180\" y=\"210\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eJardim\u003c/text\u003e\u003cline x1=\"36\" y1=\"342\" x2=\"72\" y2=\"342\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"36\" y1=\"335\" x2=\"36\" y2=\"349\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"72\" y1=\"335\" x2=\"72\" y2=\"349\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"54\" y=\"376\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e1 m\u003c/text\u003e\u003ctext x=\"214\" y=\"376\" font-size=\"17\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eLargura do caminho\u003c/text\u003e\u003ctext x=\"180\" y=\"413\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eCaminho em toda a volta\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Jardim retangular de 6 m por 4 m cercado externamente por caminho de 1 m de largura, inclusive nos cantos. O caminho é hachurado; as dimensões externas calculadas não estão impressas."}]},{"id":"MFC6-B3-I-PA-19","codigo":"PA-19","titulo":"O mesmo piso, menos acabamento","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Comparar perímetros de organizações retangulares com área fixa.","dificuldade":{"nivel":"media"},"enunciado":"Um espaço de jogos será montado com 24 placas quadradas de 1 m de lado, todas usadas sem sobreposição. A equipe pode organizá-las em qualquer um dos quatro retângulos indicados nas alternativas e quer gastar a menor quantidade possível de acabamento na borda externa. Qual organização deve escolher?","alternativas":[{"letra":"A","texto":"3 fileiras de 8 placas."},{"letra":"B","texto":"4 fileiras de 6 placas."},{"letra":"C","texto":"2 fileiras de 12 placas."},{"letra":"D","texto":"1 fileira de 24 placas."}],"gabarito":"B","resolucao_comentada":"Todas as organizações usam 24 placas e, portanto, cobrem 24 m². Os contornos são: 3 por 8, 22 m; 4 por 6, 20 m; 2 por 12, 28 m; 1 por 24, 50 m. A organização de 4 por 6 usa a menor quantidade de acabamento: 20 m.","justificativas_distratores":{"A":"Escolhe um contorno de 22 m, mas existe outro menor, de 20 m, com a mesma área.","C":"Supõe que usar menos fileiras reduz a borda, sem comparar os dois lados do retângulo.","D":"Escolhe a menor quantidade de fileiras, mas cria o formato mais alongado e o maior contorno."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 1230\" role=\"img\" aria-label=\"Quatro organizações das mesmas 24 placas quadradas de lado 1 m, todas na mesma escala. A: três fileiras de oito; B: quatro de seis; C: duas de doze; D: uma de 24. A organização D está girada 90 graus e é mostrada na vertical para permitir leitura no celular, sem dobrar ou interromper a fileira.\"\u003e\u003ctitle\u003eQuatro organizações das mesmas 24 placas quadradas de lado 1 m, todas na mesma escala. A: três fileiras de oito; B: quatro de seis; C: duas de doze; D: uma de 24. A organização D está girada 90 graus e é mostrada na vertical para permitir leitura no celular, sem dobrar ou interromper a fileira.\u003c/title\u003e\u003ctext x=\"180\" y=\"45\" fo
