os um retângulo, sem sobreposição. Uma fita cobrirá somente a borda externa do conjunto. Quantos metros de fita serão usados?","alternativas":[{"letra":"A","texto":"14 m."},{"letra":"B","texto":"18 m."},{"letra":"C","texto":"16 m."},{"letra":"D","texto":"10 m."}],"gabarito":"A","resolucao_comentada":"Os tapetes juntos formam um retângulo de 3 + 2 = 5 m por 2 m. O contorno externo mede 5 + 2 + 5 + 2 = 14 m. Também podemos somar os contornos separados, 10 + 8 = 18 m, e retirar duas vezes a união de 2 m, pois ela foi contada em cada tapete: 18 − 4 = 14 m.","justificativas_distratores":{"B":"Soma os dois contornos separados e inclui a união interna duas vezes.","C":"Desconta a linha de união apenas uma vez, embora tenha sido contada nos dois contornos.","D":"Usa a área total de 10 m² como se fosse comprimento de fita."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" role=\"img\" aria-label=\"Tapete de 3 m por 2 m unido lado a lado a um quadrado de 2 m de lado. A união interna de 2 m é tracejada, e o contorno externo é contínuo. Não há sobreposição.\"\u003e\u003ctitle\u003eTapete de 3 m por 2 m unido lado a lado a um quadrado de 2 m de lado. A união interna de 2 m é tracejada, e o contorno externo é contínuo. Não há sobreposição.\u003c/title\u003e\u003crect x=\"60\" y=\"144\" width=\"240\" height=\"96\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"204\" y1=\"144\" x2=\"204\" y2=\"240\" stroke=\"#183e4b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"132\" y=\"128\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 m\u003c/text\u003e\u003ctext x=\"252\" y=\"128\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e2 m\u003c/text\u003e\u003ctext x=\"27\" y=\"198\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e2 m\u003c/text\u003e\u003ctext x=\"180\" y=\"298\" font-size=\"17\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eTracejado: união dos tapetes\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Tapete de 3 m por 2 m unido lado a lado a um quadrado de 2 m de lado. A união interna de 2 m é tracejada, e o contorno externo é contínuo. Não há sobreposição."}]},{"id":"MFC6-B3-I-PA-21","codigo":"PA-21","titulo":"Piso e acabamento para o pátio em L","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Combinar decomposição de área, contorno e compra mínima de material.","dificuldade":{"nivel":"dificil"},"enunciado":"Um centro comunitário vai reformar um pátio em L, obtido de um retângulo de 9 m por 7 m com um recorte de 3 m por 2 m no canto superior direito. O piso é vendido em pacotes que cobrem 10 m² cada, e os recortes das peças serão totalmente aproveitados, sem perdas. Um perfil de acabamento será instalado em todo o contorno do pátio, exceto em uma entrada de 1 m situada no lado de 9 m; o perfil pode ser comprado e cortado na medida necessária. Qual é a compra mínima de piso e o comprimento de perfil exigidos?","alternativas":[{"letra":"A","texto":"6 pacotes e 41 m de perfil."},{"letra":"B","texto":"6 pacotes e 31 m de perfil."},{"letra":"C","texto":"5 pacotes e 31 m de perfil."},{"letra":"D","texto":"7 pacotes e 31 m de perfil."}],"gabarito":"B","resolucao_comentada":"O retângulo original tem 9 × 7 = 63 m², e o recorte tem 3 × 2 = 6 m². A área do pátio é 63 − 6 = 57 m². Cinco pacotes cobrem só 50 m²; seis cobrem 60 m², sendo a compra mínima. Para o contorno, o trecho superior restante mede 9 − 3 = 6 m e o trecho direito restante mede 7 − 2 = 5 m. Percorrendo o L, somamos 9 + 5 + 3 + 2 + 6 + 7 = 32 m. Como a entrada de 1 m não recebe perfil, são necessários 32 − 1 = 31 m.","justificativas_distratores":{"A":"Soma o perímetro completo do recorte ao contorno externo original: 32 + 10 − 1 = 41 m, contando bordas que não pertencem ao pátio.","C":"Escolhe cinco pacotes, embora eles cubram apenas 50 m², menos que os 57 m² necessários.","D":"Calcula os pacotes pela área do retângulo inteiro de 63 m² e não desconta o recorte."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 465\" role=\"img\" aria-label=\"Pátio em L obtido de retângulo de 9 m por 7 m, com recorte superior direito de 3 m na horizontal por 2 m na vertical. Há entrada de 1 m no lado inferior, indicada por tracejado e rótulo. O piso é fornecido em pacotes de 10 m². Não há medidas derivadas ou totais impressos.\"\u003e\u003ctitle\u003ePátio em L obtido de retângulo de 9 m por 7 m, com recorte superior direito de 3 m na horizontal por 2 m na vertical. Há entrada de 1 m no lado inferior, indicada por tracejado e rótulo. O piso é fornecido em pacotes de 10 m². Não há medidas derivadas ou totais impressos.\u003c/title\u003e\u003cpath d=\"M 50 310 L 302 310 L 302 170 L 218 170 L 218 114 L 50 114 Z\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"0\"/\u003e\u003cpath d=\"M 50 310 L 162 310\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cpath d=\"M 190 310 L 302 310 L 302 170 L 218 170 L 218 114 L 50 114 L 50 310\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"162\" y1=\"310\" x2=\"190\" y2=\"310\" stroke=\"#183e4b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"180\" y=\"30\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003ePátio em L\u003c/text\u003e\u003ctext x=\"22\" y=\"218\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e7 m\u003c/text\u003e\u003ctext x=\"260\" y=\"155\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 m\u003c/text\u003e\u003ctext x=\"333\" y=\"148\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e2 m\u003c/text\u003e\u003ctext x=\"85\" y=\"345\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e9 m\u003c/text\u003e\u003cline x1=\"176\" y1=\"320\" x2=\"176\" y2=\"365\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003ctext x=\"176\" y=\"398\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eEntrada: 1 m\u003c/text\u003e\u003ctext x=\"180\" y=\"442\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003ePacote de piso: 10 m²\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Pátio em L obtido de retângulo de 9 m por 7 m, com recorte superior direito de 3 m na horizontal por 2 m na vertical. Há entrada de 1 m no lado inferior, indicada por tracejado e rótulo. O piso é fornecido em pacotes de 10 m². Não há medidas derivadas ou totais impressos."}]},{"id":"MFC6-B3-I-PA-22","codigo":"PA-22","titulo":"Duas reservas no mesmo mural","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Descontar a união de regiões reservadas sem contar a sobreposição duas vezes.","dificuldade":{"nivel":"dificil"},"enunciado":"No planejamento de um mural retangular de 12 m por 8 m, duas equipes marcaram regiões que devem ficar sem revestimento. Uma reserva é um retângulo de 5 m por 4 m, e a outra, de 6 m por 3 m; suas marcações se sobrepõem em um retângulo de 2 m por 3 m. Toda a região marcada por pelo menos uma equipe ficará descoberta. Qual área do mural receberá revestimento?","alternativas":[{"letra":"A","texto":"58 m²."},{"letra":"B","texto":"90 m²."},{"letra":"C","texto":"64 m²."},{"letra":"D","texto":"32 m²."}],"gabarito":"C","resolucao_comentada":"O mural tem 12 × 8 = 96 m². As reservas medem 5 × 4 = 20 m² e 6 × 3 = 18 m². Ao somar 20 + 18, a sobreposição de 2 × 3 = 6 m² entra duas vezes; por isso, ela deve ser descontada uma vez dessa soma. A região reservada ocupa 20 + 18 − 6 = 32 m². O revestimento cobrirá 96 − 32 = 64 m².","justificativas_distratores":{"A":"Retira 20 e 18 da área total sem corrigir a sobreposição, descontando a mesma região duas vezes.","B":"Desconta somente a sobreposição de 6 m² e ignora o restante das reservas.","D":"Informa a área que ficará reservada, não a que receberá revestimento."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 480\" role=\"img\" aria-label=\"Mural de 12 m por 8 m. A reserva A mede 5 m por 4 m e tem hachura diagonal; a reserva B mede 6 m por 3 m e tem linhas horizontais. A interseção de 2 m por 3 m tem pontilhado próprio e rótulo A e B, sem dupla hachura. A superfície branca fora das reservas está identificada como região a revestir.\"\u003e\u003ctitle\u003eMural de 12 m por 8 m. A reserva A mede 5 m por 4 m e tem hachura diagonal; a reserva B mede 6 m por 3 m e tem linhas horizontais. A interseção de 2 m por 3 m tem pontilhado próprio e rótulo A e B, sem dupla hachura. A superfície branca fora das reservas está identificada como região a revestir.\u003c/title\u003e\u003crect x=\"48\" y=\"70\" width=\"264\" height=\"176\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180.0\" y=\"54\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e12 m\u003c/text\u003e\u003ctext x=\"16\" y=\"164.0\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e8 m\u003c/text\u003e\u003cdefs\u003e\u003cpattern id=\"PA22a\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\u003crect x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"#ffffff\"/\u003e\u003cpath d=\"M -2 2 L 2 -2 M 0 10 L 10 0 M 8 12 L 12 8\" fill=\"none\" stroke=\"#60747e\" stroke-width=\"1\"/\u003e\u003c/pattern\u003e\u003c/defs\u003e\u003cdefs\u003e\u003cpattern id=\"PA22b\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\u003crect x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"#ffffff\"/\u003e\u003cline x1=\"0\" y1=\"5\" x2=\"10\" y2=\"5\" stroke=\"#60747e\" stroke-width=\"1\"/\u003e\u003c/pattern\u003e\u003c/defs\u003e\u003cdefs\u003e\u003cpattern id=\"PA22ab\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"\u003e\u003crect x=\"0\" y=\"0\" width=\"10\" height=\"10\" fill=\"#ffffff\"/\u003e\u003ccircle cx=\"5\" cy=\"5\" r=\"1.3\" fill=\"#183e4b\"/\u003e\u003c/pattern\u003e\u003c/defs\u003e\u003cpath d=\"M 70 224 L 180 224 L 180 202 L 136 202 L 136 136 L 70 136 Z\" fill=\"url(#PA22a)\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003crect x=\"180\" y=\"136\" width=\"88\" height=\"66\" fill=\"url(#PA22b)\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003crect x=\"136\" y=\"136\" width=\"44\" height=\"66\" fill=\"url(#PA22ab)\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003crect x=\"75.0\" y=\"161\" width=\"30\" height=\"25\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"0\"/\u003e\u003ctext x=\"90\" y=\"180\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eA\u003c/text\u003e\u003crect x=\"209.0\" y=\"161\" width=\"30\" height=\"25\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"0\"/\u003e\u003ctext x=\"224\" y=\"180\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eB\u003c/text\u003e\u003crect x=\"137.0\" y=\"151\" width=\"42\" height=\"25\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"0\"/\u003e\u003ctext x=\"158\" y=\"170\" font-size=\"16\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eA e B\u003c/text\u003e\u003ctext x=\"230\" y=\"106\" font-size=\"17\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eRevestir\u003c/text\u003e\u003ctext x=\"180\" y=\"301\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eA: 5 m × 4 m\u003c/text\u003e\u003ctext x=\"180\" y=\"342\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eB: 6 m × 3 m\u003c/text\u003e\u003ctext x=\"180\" y=\"383\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eA e B: 2 m × 3 m\u003c/text\u003e\u003ctext x=\"180\" y=\"436\" font-size=\"17\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eReservas sem revestimento\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Mural de 12 m por 8 m. A reserva A mede 5 m por 4 m e tem hachura diagonal; a reserva B mede 6 m por 3 m e tem linhas horizontais. A interseção de 2 m por 3 m tem pontilhado próprio e rótulo A e B, sem dupla hachura. A superfície branca fora das reservas está identificada como região a revestir."}]},{"id":"MFC6-B3-I-PA-23","codigo":"PA-23","titulo":"Uma peça com canto inclinado","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Calcular área e perímetro de polígono obtido por corte triangular.","dificuldade":{"nivel":"dificil"},"enunciado":"Uma artista fará uma peça para um móbile a partir de um cartão retangular de 10 cm por 6 cm. No canto superior direito, retirará um triângulo cujos lados sobre as bordas do cartão medem 3 cm e 4 cm; o corte inclinado entre eles mede 5 cm. Ela precisa saber a superfície que poderá pintar e o comprimento de fita para toda a borda da peça restante. Quais são essas duas medidas, respectivamente?","alternativas":[{"letra":"A","texto":"54 cm² e 32 cm."},{"letra":"B","texto":"48 cm² e 30 cm."},{"letra":"C","texto":"60 cm² e 30 cm."},{"letra":"D","texto":"54 cm² e 30 cm."}],"gabarito":"D","resolucao_comentada":"O cartão inteiro tem 10 × 6 = 60 cm². O triângulo retirado é metade de um retângulo de 3 cm por 4 cm, logo tem 3 × 4 ÷ 2 = 6 cm². Restam 60 − 6 = 54 cm² para pintar. Na borda, o lado superior passa a medir 10 − 3 = 7 cm e o direito, 6 − 4 = 2 cm. Com o novo lado inclinado de 5 cm, o contorno é 10 + 2 + 5 + 7 + 6 = 30 cm. Os 5 cm do corte são um dado, não precisam ser descobertos por uma fórmula.","justificativas_distratores":{"A":"Desconta a área do triângulo, mas conserva o perímetro original de 32 cm após a mudança da borda.","B":"Retira a área inteira de 3 × 4, sem considerar que o recorte é triangular.","C":"Calcula a nova borda, mas não retira a área do triângulo da superfície."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 350\" role=\"img\" aria-label=\"Peça obtida de cartão retangular de 10 cm por 6 cm. No canto superior direito foi retirado triângulo com lados de 3 cm e 4 cm sobre as antigas bordas, mostradas tracejadas, e corte inclinado de 5 cm.\"\u003e\u003ctitle\u003ePeça obtida de cartão retangular de 10 cm por 6 cm. No canto superior direito foi retirado triângulo com lados de 3 cm e 4 cm sobre as antigas bordas, mostradas tracejadas, e corte inclinado de 5 cm.\u003c/title\u003e\u003cpath d=\"M 60 280 L 300 280 L 300 232 L 228 136 L 60 136 Z\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cpath d=\"M 228 136 L 300 136 L 300 232\" fill=\"none\" stroke=\"#183e4b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/\u003e\u003ctext x=\"180\" y=\"320\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e10 cm\u003c/text\u003e\u003ctext x=\"27\" y=\"214\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e6 cm\u003c/text\u003e\u003ctext x=\"264\" y=\"114\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e3 cm\u003c/text\u003e\u003ctext x=\"330\" y=\"190\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 cm\u003c/text\u003e\u003ctext x=\"235\" y=\"203\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e5 cm\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Peça obtida de cartão retangular de 10 cm por 6 cm. No canto superior direito foi retirado triângulo com lados de 3 cm e 4 cm sobre as antigas bordas, mostradas tracejadas, e corte inclinado de 5 cm."}]},{"id":"MFC6-B3-I-PA-24","codigo":"PA-24","titulo":"Quanto piso vai para as oficinas?","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Inferir uma dimensão pelo contorno e calcular a área de um setor.","dificuldade":{"nivel":"dificil"},"enunciado":"Uma feira terá um estande retangular de 12 m de comprimento e contorno externo de 34 m. O setor de recepção ocupa um trecho de 4 m desse comprimento e toda a largura do estande. O restante será destinado às oficinas e receberá um piso removível. Qual é a área que receberá esse piso?","alternativas":[{"letra":"A","texto":"20 m²."},{"letra":"B","texto":"40 m²."},{"letra":"C","texto":"60 m²."},{"letra":"D","texto":"88 m²."}],"gabarito":"B","resolucao_comentada":"Os dois lados de 12 m somam 24 m do contorno. Restam 34 − 24 = 10 m para as duas larguras iguais; cada uma mede 5 m. Ao retirar os 4 m de comprimento da recepção, o setor de oficinas fica com 12 − 4 = 8 m de comprimento e a mesma largura de 5 m. Sua área é 8 × 5 = 40 m². Conferindo por diferença: o total é 12 × 5 = 60 m² e a recepção ocupa 4 × 5 = 20 m²; restam 40 m².","justificativas_distratores":{"A":"Calcula a área da recepção, não a do setor de oficinas.","C":"Inclui toda a área do estande e não desconta a recepção.","D":"Retira apenas um lado de 12 m do contorno e divide o restante por dois, obtendo largura incorreta de 11 m."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 330\" role=\"img\" aria-label=\"Estande retangular com comprimento de 12 m e contorno externo informado de 34 m. Uma divisória separa a recepção, com trecho de 4 m do comprimento, do setor de oficinas. A largura comum aparece com interrogação.\"\u003e\u003ctitle\u003eEstande retangular com comprimento de 12 m e contorno externo informado de 34 m. Uma divisória separa a recepção, com trecho de 4 m do comprimento, do setor de oficinas. A largura comum aparece com interrogação.\u003c/title\u003e\u003ctext x=\"180\" y=\"30\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eContorno: 34 m\u003c/text\u003e\u003crect x=\"48\" y=\"135\" width=\"264\" height=\"110\" fill=\"#ffffff\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003cline x1=\"136\" y1=\"135\" x2=\"136\" y2=\"245\" stroke=\"#183e4b\" stroke-width=\"2\"/\u003e\u003ctext x=\"180\" y=\"119\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e12 m\u003c/text\u003e\u003ctext x=\"23\" y=\"196\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e? m\u003c/text\u003e\u003ctext x=\"92\" y=\"194\" font-size=\"16\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eRecepção\u003c/text\u003e\u003ctext x=\"224\" y=\"194\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eOficinas\u003c/text\u003e\u003ctext x=\"92\" y=\"281\" font-size=\"18\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003e4 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Estande retangular com comprimento de 12 m e contorno externo informado de 34 m. Uma divisória separa a recepção, com trecho de 4 m do comprimento, do setor de oficinas. A largura comum aparece com interrogação."}]},{"id":"MFC6-B3-I-PA-25","codigo":"PA-25","titulo":"Dois terrenos, caminhos diferentes","assunto":"PA","assunto_nome":"Perímetro e Área","habilidade":"Comparar áreas úteis e contornos sob condições simultâneas.","dificuldade":{"nivel":"dificil"},"enunciado":"Uma associação de bairro escolherá um terreno para uma horta que precisa ter pelo menos 75 m² de área útil de cultivo e contorno externo de no máximo 40 m. O terreno I mede 12 m por 8 m e terá uma passagem interna de 2 m de largura ao longo de um lado inteiro de 12 m. O terreno II mede 10 m por 10 m e terá duas passagens internas de 1 m de largura, uma ao longo de cada um de dois lados vizinhos, compartilhando o canto. As passagens não serão cultivadas e não alteram os limites externos dos terrenos. Qual análise está correta?","alternativas":[{"letra":"A","texto":"Os dois atendem: as áreas úteis são 84 m² no I e 81 m² no II."},{"letra":"B","texto":"Somente o II atende: as áreas úteis são 72 m² no I e 80 m² no II."},{"letra":"C","texto":"Nenhum atende: os dois teriam contorno externo de 44 m."},{"letra":"D","texto":"Somente o II atende: as áreas úteis são 72 m² no I e 81 m² no II."}],"gabarito":"D","resolucao_comentada":"No terreno I, a área total é 12 × 8 = 96 m², e a passagem ocupa 12 × 2 = 24 m². A área útil é 96 − 24 = 72 m², abaixo dos 75 m² exigidos. No II, as passagens deixam um quadrado de 9 m por 9 m para cultivo, com 81 m². Outra conferência: as passagens ocupam 10 + 10 − 1 = 19 m², pois o canto de 1 m² foi contado duas vezes; a área útil é 100 − 19 = 81 m². O contorno de I é 12 + 8 + 12 + 8 = 40 m, e o de II é 4 × 10 = 40 m. Ambos respeitam o limite externo, mas somente II oferece a área útil mínima.","justificativas_distratores":{"A":"Desconta apenas 12 m² de passagem no terreno I, esquecendo sua largura de 2 m, e aprova indevidamente esse terreno.","B":"Desconta duas faixas de 10 m² no terreno II sem corrigir o canto compartilhado de 1 m²; a conclusão sobre o terreno não torna correta a área informada.","C":"Trata as passagens internas como acréscimos externos: amplia indevidamente uma dimensão de I em 2 m e as duas dimensões de II em 1 m."},"recursos_visuais":[{"tipo":"svg","html":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 795\" role=\"img\" aria-label=\"Dois terrenos com a mesma escala e sem indicação de melhor proposta. I mede 12 m por 8 m e tem passagem interna de 2 m ao longo de todo o lado inferior. II mede 10 m por 10 m e tem passagens internas de 1 m junto aos lados inferio " stroke-width=\"1\"/\u003e\u003cline x1=\"145\" y1=\"685\" x2=\"235\" y2=\"685\" stroke=\"#183e4b\" stroke-width=\"1\"/\u003e\u003ctext x=\"235\" y=\"711\" font-size=\"17\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eTrecho comum\u003c/text\u003e\u003ctext x=\"180\" y=\"755\" font-size=\"17\" font-family=\"Arial, sans-serif\" text-anchor=\"middle\" fill=\"#183e4b\"\u003eDuas faixas internas de 1 m\u003c/text\u003e\u003c/svg\u003e","css":"","acessibilidade":"Dois terrenos com a mesma escala e sem indicação de melhor proposta. I mede 12 m por 8 m e tem passagem interna de 2 m ao longo de todo o lado inferior. II mede 10 m por 10 m e tem passagens internas de 1 m junto aos lados inferior e esquerdo. O canto comum das duas passagens de II aparece pontilhado e identificado por uma linha de chamada. As áreas de cultivo estão sem hachura; não há áreas calculadas."}]}]}</script><script>function copiar(v){return structuredClone(v);}
function congelar(v){if(v&&typeof v==='object'){Object.values(v).forEach(congelar);Object.freeze(v);}return v;}
function criarAplicacao(selecionadas) {
  const correcao = [], respostas = new Map();
  const questoes = congelar(selecionadas.map(q => {
    const opcoes = q.alternativas.map((o, i) => ({ id: `${q.id}:opcao:${o.letra}`, letra: 'ABCD'[i], texto: o.texto }));
    const correta = opcoes.find(o => o.id === `${q.id}:opcao:${q.gabarito}`);
    correcao.push({ questaoId: q.id, opcaoCorretaId: correta.id, letraCorreta: correta.letra, resolucao: q.resolucao_comentada });
    // Projeção por lista explícita: nunca envia valor, erro comum, modelo ou gabarito.
    return { id: q.id, titulo: q.titulo, assunto: q.assunto, assuntoNome: q.assunto_nome,
      habilidade: q.habilidade, dificuldade: copiar(q.dificuldade), enunciado: q.enunciado,
      recursosVisuais: q.recursos_visuais.map(r => ({ tipo: r.tipo, html: r.html, css: r.css, descricao: r.acessibilidade })), alternativas: opcoes };
  }));
  const ids = new Map(questoes.map(q => [q.id, new Set(q.alternativas.map(o => o.id))]));
  let finalizada = false, resultado;
  function obterCorrecao() {
    if (!finalizada) throw new Error('A correção só é liberada após a finalização.');
    return resultado;
  }
  return Object.freeze({
    obterQuestoes: () => questoes,
    estaFinalizada: () => finalizada,
    responder(questaoId, opcaoId) {
      if (finalizada) throw new Error('Aplicação finalizada.');
      if (!ids.has(questaoId) || (opcaoId !== null && !ids.get(questaoId).has(opcaoId))) throw new Error('Questão ou alternativa não pertence à aplicação.');
      if (opcaoId === null) respostas.delete(questaoId); else respostas.set(questaoId, opcaoId);
    },
    obterRespostas: () => congelar(Object.fromEntries(respostas)),
    finalizar() {
      if (!finalizada) {
        resultado = congelar(correcao.map(q => ({ ...q, respostaId: respostas.get(q.questaoId) ?? null })));
        finalizada = true;
      }
      return obterCorrecao();
    },
    obterCorrecao,
  });
}

function calcularResultados(questoes, correcao, ordemAssuntos) {
  if (questoes.length !== correcao.length || new Set(correcao.map(c => c.questaoId)).size !== questoes.length) throw new Error('Correção incompleta.');
  const porId = new Map(correcao.map(c => [c.questaoId, c]));
  const assuntos = new Map();
  let acertos = 0, respondidas = 0;
  for (const q of questoes) {
    const c = porId.get(q.id);
    if (!c || !q.alternativas.some(o => o.id === c.opcaoCorretaId) || (c.respostaId !== null && !q.alternativas.some(o => o.id === c.respostaId))) throw new Error('Correção incompatível com a aplicação.');
    const certo = c.respostaId === c.opcaoCorretaId;
    acertos += Number(certo); respondidas += Number(c.respostaId !== null);
    if (!assuntos.has(q.assunto)) assuntos.set(q.assunto, { codigo: q.assunto, nome: q.assuntoNome, acertos: 0, total: 0 });
    const a = assuntos.get(q.assunto); a.total++; a.acertos += Number(certo);
  }
  return { acertos, erros: respondidas - acertos, total: questoes.length, respondidas, semResposta: questoes.length - respondidas,
    percentual: acertos / questoes.length * 100,
    assuntos: (ordemAssuntos || [...assuntos.keys()]).filter(c => assuntos.has(c)).map(c => { const a = assuntos.get(c); return { ...a, percentual: a.acertos / a.total * 100 }; }) };
}
function formatarPercentual(valor) {
  return new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }).format(valor) + '%';
}

const SVG = 'http://www.w3.org/2000/svg';
const SVG_TAGS = new Set(['svg', 'title', 'desc', 'rect', 'text', 'defs', 'pattern', 'circle', 'line', 'path']);
const TABLE_TAGS = new Set(['table', 'caption', 'thead', 'tbody', 'tr', 'th', 'td', 'span']);
const ATTRS = new Set(['viewBox', 'role', 'aria-label', 'aria-hidden', 'width', 'height', 'fill', 'x', 'y',
  'font-family', 'font-size', 'text-anchor', 'rx', 'stroke', 'id', 'patternUnits', 'cx', 'cy', 'r',
  'data-pintada', 'data-marcacao-acessivel', 'x1', 'x2', 'y1', 'y2', 'stroke-width', 'data-subdivisao',
  'class', 'scope', 'data-rotulo', 'data-ciclo', 'd', 'stroke-dasharray', 'data-tira', 'data-fita',
  'data-valor', 'data-regua', 'data-plano', 'data-marca', 'data-posicao']);
const NUMERICOS = new Set(['viewBox', 'width', 'height', 'x', 'y', 'font-size', 'rx', 'cx', 'cy', 'r',
  'x1', 'x2', 'y1', 'y2', 'stroke-width', 'stroke-dasharray']);
const ID = /^[A-Za-z][A-Za-z0-9_.:-]*$/;
function rejeitar(motivo) { throw new Error(`Recurso visual não permitido: ${motivo}.`); }

function criarRecursoSeguro(recurso, destino = document) {
  if (!recurso || !['svg', 'tabela_html'].includes(recurso.tipo) || typeof recurso.html !== 'string') rejeitar('tipo ou conteúdo');
  // Não permitir DTD, entidades definidas pelo documento ou instruções de processamento.
  if (/<!DOCTYPE|<!ENTITY|<\?/i.test(recurso.html)) rejeitar('declaração XML');
  // O parser XML não cria contexto HTML ativo nem carrega imagens/iframes HTML.
  const xml = new DOMParser().parseFromString(recurso.html, 'application/xml');
  if (xml.getElementsByTagName('parsererror').length) rejeitar('XML inválido');
  const raiz = xml.documentElement;
  const svg = recurso.tipo === 'svg';
  const tags = svg ? SVG_TAGS : TABLE_TAGS;
  if (raiz.localName !== (svg ? 'svg' : 'table')) rejeitar('elemento principal');
  const elementos = [raiz, ...raiz.querySelectorAll('*')], ids = new Map(), referencias = [];
  for (const node of elementos) {
    if (!tags.has(node.localName) || node.prefix || node.namespaceURI !== (svg ? SVG : null)) rejeitar('elemento ou namespace');
    for (const attr of node.attributes) {
      if (attr.name === 'xmlns' && node === raiz && svg && attr.value === SVG) continue;
      if (attr.namespaceURI || !ATTRS.has(attr.name)) rejeitar(`atributo ${attr.name}`);
      const valor = attr.value;
      if (NUMERICOS.has(attr.name) && !/^[0-9eE+.,\s-]+$/.test(valor)) rejeitar('medida');
      if (attr.name === 'id') {
        if (!ID.test(valor) || ids.has(valor)) rejeitar('identificador');
        ids.set(valor, node);
      }
      if (['fill', 'stroke'].includes(attr.name)) {
        const ref = /^url\(#([A-Za-z][A-Za-z0-9_.:-]*)\)$/.exec(valor);
        if (ref) referencias.push(ref[1]);
        else if (!/^(?:none|#[0-9a-f]{3}|#[0-9a-f]{6})$/i.test(valor)) rejeitar('cor ou referência');
      }
      if (attr.name === 'font-family' && !/^[A-Za-z,\s-]+$/.test(valor)) rejeitar('fonte');
      if (attr.name === 'd' && !/^[MmLlHhVvCcSsQqTtAaZz0-9eE+.,\s-]+$/.test(valor)) rejeitar('trajeto');
      if (attr.name === 'patternUnits' && !['userSpaceOnUse', 'objectBoundingBox'].includes(valor)) rejeitar('unidade de padrão');
    }
  }
  for (const ref of referencias) if (ids.get(ref)?.localName !== 'pattern') rejeitar('referência de padrão ausente');
  function construir(node) {
    if (node.nodeType === 3) return destino.createTextNode(node.data);
    if (node.nodeType !== 1) rejeitar('nó não permitido');
    const novo = svg ? destino.createElementNS(SVG, node.localName) : destino.createElement(node.localName);
    for (const attr of node.attributes) novo.setAttribute(attr.name, attr.value);
    for (const filho of node.childNodes) novo.append(construir(filho));
    return novo;
  }
  return construir(raiz);
}

}
function iniciar(){
 app=criarAplicacao(banco);questoes=app.obterQuestoes();indice=0;correcao=null;status.textContent='';container.dataset.etapa='aplicacao';mostrarQuestao();
}
function atualizarProgresso(){
 const respostas=app.obterRespostas(),n=Object.keys(respostas).length;
 contador.textContent=`${n} de ${total} questões respondidas`;progresso.value=n;
 mapa.querySelectorAll('button[data-indice]').forEach((b,i)=>{
  const respondida=Boolean(respostas[questoes[i].id]);b.dataset.respondida=String(respondida);
  b.setAttribute('aria-label',`Questão ${i+1}, ${codigo(questoes[i])}, ${respondida?'respondida':'não respondida'}${i===indice?', atual':''}`);
  b.querySelector('.mfc-marca-resposta').textContent=respondida?'✓':'';
 });
}
function navegar(n){if(!app || app.estaFinalizada() || n<0 || n>=total)return;indice=n;status.textContent='';mostrarQuestao();}
function pedirFinalizacao(event){
 if(!app || app.estaFinalizada())return;
 dialogOrigin=event.currentTarget;const faltam=total-Object.keys(app.obterRespostas()).length;
 dialogMessage.textContent=faltam?`Ainda ${faltam===1?'há 1 questão sem resposta':`há ${faltam} questões sem resposta`}. Elas serão apresentadas como não respondidas. Depois de finalizar, você não poderá alterar as respostas. Deseja continuar?`:`Você respondeu às ${total} questões. Depois da finalização, não poderá alterar as respostas. Deseja continuar?`;
 dialog.showModal();cancelar.focus();
}
function mostrarQuestao(){
 const q=questoes[indice];container.dataset.questao=codigo(q);
 contador=elemento('p',{'aria-live':'polite',id:'contador-respostas'});progresso=elemento('progress',{max:total,value:0,'aria-label':'Progresso de respostas'});
 const toolbar=elemento('div',{classe:'mfc-toolbar'},[elemento('div',{},[contador,progresso]),botao('Finalizar simulado',pedirFinalizacao,{id:'finalizar'})]);
 const heading=elemento('h1',{id:'questao-titulo',classe:'mfc-question-heading',tabindex:-1,texto:`Questão ${indice+1} de ${total}`});
 const card=elemento('article',{classe:'mfc-card','data-questao-id':q.id,'aria-labelledby':'questao-titulo questao-tema'},[
  elemento('p',{classe:'mfc-pill',texto:`${q.assuntoNome} • ${codigo(q)}`}),heading,
  elemento('h2',{id:'questao-tema',classe:'mfc-titulo-problema',texto:q.titulo}),
  elemento('p',{id:'questao-enunciado',classe:'mfc-enunciado',texto:q.enunciado})
 ]);
 recursos(q,card);
 const field=elemento('fieldset',{'aria-labelledby':'questao-titulo alternativas-legenda','aria-describedby':'questao-enunciado'},[elemento('legend',{id:'alternativas-legenda',texto:'Escolha uma alternativa:'})]);
 const resposta=app.obterRespostas()[q.id];
 for(const o of q.alternativas){
  const radio=elemento('input',{type:'radio',name:q.id,value:o.id,checked:o.id===resposta,'aria-label':`${o.letra}) ${o.texto}`});
  radio.addEventListener('change',()=>{app.responder(q.id,o.id);atualizarProgresso();status.textContent=`Resposta da questão ${indice+1} registrada.`;});
  field.append(elemento('label',{classe:'mfc-option'},[radio,elemento('span',{classe:'mfc-letter',texto:o.letra+')'}),elemento('span',{texto:o.texto})]));
 }
 card.append(field,botao('Limpar resposta',()=>{app.responder(q.id,null);field.querySelectorAll('input').forEach(r=>r.checked=false);atualizarProgresso();status.textContent=`Resposta da questão ${indice+1} removida.`;},{id:'limpar-resposta'}),elemento('div',{classe:'mfc-nav-actions'},[
  botao('Anterior',()=>navegar(indice-1),{id:'anterior',disabled:indice===0}),
  botao('Próxima',()=>navegar(indice+1),{id:'proxima',disabled:indice===total-1,classe:'mfc-primary'})
 ]));
 mapa=elemento('nav',{classe:'mfc-card mfc-question-map','aria-label':'Navegação pelas questões'},[elemento('h2',{texto:'Ir para a questão'})]);
 const numeros=elemento('div',{classe:'mfc-numbers'});
 questoes.forEach((q,i)=>{
  const b=botao('',()=>navegar(i),{'data-indice':i,'aria-current':i===indice?'step':null});
  b.append(elemento('span',{classe:'mfc-numero-questao',texto:i+1}),elemento('span',{classe:'mfc-marca-resposta','aria-hidden':'true'}));
  if(i===indice)b.append(elemento('span',{classe:'mfc-marca-atual','aria-hidden':'true',texto:'Atual'}));numeros.append(b);
 });
 mapa.append(numeros,elemento('p',{classe:'mfc-legend',texto:'✓: respondida. Sem ✓: não respondida. “Atual”: questão em exibição.'}));
 main.replaceChildren(toolbar,elemento('div',{classe:'mfc-layout'},[card,mapa]));atualizarProgresso();heading.focus({preventScroll:true});container.scrollIntoView({block:'start'});
}
function mostrarResultado(){
 container.dataset.etapa='resultado';delete container.dataset.questao;status.textContent='Simulado finalizado. Resultado disponível.';
 const result=calcularResultados(questoes,correcao,['PA']);const heading=elemento('h1',{tabindex:-1,texto:'Seu resultado',id:'resultado-titulo'});
 const stats=elemento('div',{classe:'mfc-stats'});
 for(const [label,key,value] of [['Acertos','acertos',`${result.acertos} de ${total}`],['Erros','erros',result.erros],['Não respondidas','branco',result.semResposta],['Aproveitamento','percentual',formatarPercentual(result.percentual)]]){
  stats.append(elemento('div',{classe:'mfc-stat'},[elemento('span',{texto:label}),elemento('strong',{['data-total-'+key]:'',texto:value})]));
 }
 const card=elemento('section',{classe:'mfc-card','aria-labelledby':'resultado-titulo'},[
  elemento('p',{classe:'mfc-kicker',texto:'Simulado concluído'}),heading,
  elemento('p',{texto:'6º ano — Bloco 3 — Perímetro e Área'}),
  ...(nome?[elemento('p',{'data-nome-estudante':'',texto:`Nome do estudante: ${nome}`})]:[]),
  stats,elemento('p',{texto:`${result.respondidas} questões respondidas; ${result.semResposta} sem resposta.`}),
  elemento('h2',{texto:'Desempenho por assunto'}),
  elemento('ul',{classe:'mfc-performance','aria-label':'Desempenho por assunto'},[elemento('li',{'data-assunto':'PA'},[elemento('span',{texto:'Perímetro e Área'}),elemento('strong',{texto:`${result.acertos} de ${total} · ${formatarPercentual(result.percentual)}`})])]),
  elemento('p',{classe:'mfc-note',texto:'Confira as resoluções para compreender as estratégias e retomar os conceitos que precisam de estudo.'})
 ]);
 const review=elemento('section',{classe:'mfc-review',hidden:true,id:'gabarito-comentado','aria-label':'Gabarito comentado','data-correcao':''});let criada=false;
 const ver=botao('Ver gabarito comentado',()=>{
  if(!criada){montarGabarito(review);criada=true;}
  review.hidden=!review.hidden;ver.setAttribute('aria-expanded',String(!review.hidden));ver.textContent=review.hidden?'Ver gabarito comentado':'Ocultar gabarito comentado';
 },{id:'ver-gabarito','aria-expanded':false,'aria-controls':review.id});
 card.append(elemento('div',{classe:'mfc-result-actions'},[ver,botao('Iniciar nova aplicação',iniciar,{id:'nova-aplicacao',classe:'mfc-primary'}),botao('Voltar ao início',inicio,{id:'voltar-inicio'})]));
 main.replaceChildren(card,review);heading.focus({preventScroll:true});container.scrollIntoView({block:'start'});
}
function montarGabarito(destino){
 if(!app.estaFinalizada())throw new Error('Finalize antes de consultar a correção.');
 destino.append(elemento('h2',{texto:'Gabarito comentado',tabindex:-1}));
 const porId=new Map(correcao.map(c=>[c.questaoId,c]));
 questoes.forEach((q,i)=>{
  const c=porId.get(q.id);const correto=c.respostaId===c.opcaoCorretaId;
  const detalhe=elemento('details',{'data-questao-id':q.id,'data-codigo':codigo(q)},[elemento('summary',{texto:`Questão ${i+1} — ${codigo(q)} — ${q.titulo}`})]);
  detalhe.append(elemento('p',{classe:'mfc-answer-status',texto:c.respostaId===null?'Você não respondeu.':correto?'Sua resposta está correta.':'Sua resposta está incorreta.'}),elemento('p',{classe:'mfc-enunciado',texto:q.enunciado}));recursos(q,detalhe);
  for(const o of q.alternativas){
   const marcas=[o.id===c.opcaoCorretaId?'Resposta correta':'',o.id===c.respostaId?'Sua resposta':''].filter(Boolean);
   detalhe.append(elemento('p',{classe:'mfc-review-option','data-correta':String(o.id===c.opcaoCorretaId),texto:`${o.letra}) ${o.texto}${marcas.length?' — '+marcas.join(' · '):''}`}));
  }
  detalhe.append(elemento('div',{classe:'mfc-resolution'},[elemento('h3',{texto:'Resolução comentada'}),elemento('p',{texto:c.resolucao})]));destino.append(detalhe);
 });
}
inicio();
})();
</script></body></html>
